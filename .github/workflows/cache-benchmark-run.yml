# Hand-written, NOT generated by .github/render-workflows.sh.
#
# One instrumented full FE build phase of the cache benchmark. Called by
# .github/workflows/cache-only-benchmark.yml at the same commit; it is never dispatched directly.
# The build itself is the original PR 779 FE workload against the populated working dev
# registry: stages and build metadata ARE published there, exactly as a normal build publishes
# them. What never happens is product publication: no release, no tag, no module publishing, no
# mirroring, no host cleanup, no prune and no registry deletion.

name: Cache benchmark phase

on:
  workflow_call:
    inputs:
      phase:
        description: "Phase id, used for artifact and file names (cold-a, warm-a, strict-a, parallel-b-one, ...)."
        required: true
        type: string
      deckhouse_ref:
        description: "Deckhouse commit to build (full 40-hex, already validated by the caller)."
        required: true
        type: string
      candidate_ref:
        description: "delivery-kit commit the benchmark binary must be built from (full 40-hex)."
        required: true
        type: string
      werf_artifact:
        description: "Artifact name holding the benchmark werf binary tarball."
        required: true
        type: string
      werf_sha256:
        description: "sha256 of the benchmark werf binary as recorded by the producer job."
        required: true
        type: string
      expect_cache_version:
        description: "If set, build.cacheVersion of the checked out werf.yaml must equal it."
        required: false
        type: string
        default: ""
      strict:
        description: "Add --check-built-images and require full reuse plus zero registry mutations."
        required: false
        type: boolean
        default: false
      expect_full_reuse:
        description: "Require that every image and stage was reused and nothing was built or discarded."
        required: false
        type: boolean
        default: false
      barrier_group:
        description: "If set, wait at a ready barrier shared by all legs of this group before building."
        required: false
        type: string
        default: ""
      barrier_legs:
        description: "Number of legs that must reach the barrier."
        required: false
        type: number
        default: 0

permissions: {}

jobs:

  build_fe:
    name: ${{ inputs.phase }}
    runs-on: [self-hosted, large]
    timeout-minutes: 720
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      # <template: werf_envs> — copied from .github/ci_includes/werf_envs.yml at DECKHOUSE_REF.
      # Caller env does not propagate into a reusable workflow, so it is repeated here verbatim.
      WERF_ENV: "FE"
      DOCKER_BUILDKIT: "1"
      WERF_FINAL_IMAGES_ONLY: true
      WERF_LOG_TERMINAL_WIDTH: "200"
      WERF_LOG_TIME: true
      WERF_GIT_WORK_TREE_POOL_LIMIT: "10"
      GOPROXY: "${{vars.GOPROXY}}"
      # </template: werf_envs>

      # The populated working dev-registry repository of the original successful run. WERF_REPO
      # and WERF_META_REPO are derived from it below, so stage and meta storage are exactly the
      # ones that run used.
      REGISTRY_PATH: "sys/deckhouse-oss"
      WERF_BUILDAH_MODE: "docker"
      WERF_DISABLE_AUTO_HOST_CLEANUP: "1"
      CI_COMMIT_TAG: ""
      CI_COMMIT_BRANCH: "migrate-to-werf-v3"
      CI_COMMIT_REF_NAME: "migrate-to-werf-v3"
      CI_COMMIT_REF_SLUG: "pr779"

      PHASE: ${{ inputs.phase }}
      DECKHOUSE_REF: ${{ inputs.deckhouse_ref }}
      CANDIDATE_DELIVERY_KIT_SHA: ${{ inputs.candidate_ref }}
      EXPECT_CACHE_VERSION: ${{ inputs.expect_cache_version }}
      EXPECT_WERF_SHA256: ${{ inputs.werf_sha256 }}
    steps:
      - name: Isolate docker config
        run: |
          mkdir -p "$RUNNER_TEMP/.docker-${PHASE}"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker-${PHASE}" >> "$GITHUB_ENV"

      # WERF_HOME is deliberately left at the runner default: werf's host locks live under it,
      # and an isolated home hides this build's locks from every other werf process on the host.

      - name: Docker health gate
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "BENCH_STARTED_AT=${started_at}" >> "$GITHUB_ENV"
          echo "runner=${RUNNER_NAME:-unknown} phase=${PHASE} started=${started_at}"
          timeout 15 docker info --format '{{.ServerVersion}} {{.Driver}} {{.DockerRootDir}} ncpu={{.NCPU}} mem={{.MemTotal}}'
          if timeout 15 docker system df; then
            echo "Docker storage accounting completed"
          else
            status=$?
            if [[ "$status" -ne 124 ]]; then
              exit "$status"
            fi
            echo "::warning::Docker storage accounting exceeded 15s; daemon info succeeded, storage integrity remains unverified"
          fi

      - name: Host resource telemetry
        continue-on-error: true
        run: |
          echo "nproc=$(nproc)"
          timeout 15 free -h || true
          timeout 15 df -h || true
          timeout 15 docker version --format '{{.Server.Version}}' || true

      - name: Split repository name
        id: split
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO" == "deckhouse/deckhouse" ]; then
            echo "name=deckhouse" >> "$GITHUB_OUTPUT"
          else
            echo "name=deckhouse-test" >> "$GITHUB_OUTPUT"
          fi

      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v2
        with:
          url: https://seguro.flant.com
          path: github
          role: "${{ steps.split.outputs.name }}"
          method: jwt
          jwtGithubAudience: github-access-aud
          secrets: |
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/registry_host DECKHOUSE_DEV_REGISTRY_HOST | DECKHOUSE_DEV_REGISTRY_HOST ;
            projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/dev-registry/writetoken login | DECKHOUSE_DEV_REGISTRY_USER ;
            projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/dev-registry/writetoken password | DECKHOUSE_DEV_REGISTRY_PASSWORD ;
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret SOURCE_REPO_GIT | SOURCE_REPO_GIT ;
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret CLOUD_PROVIDERS_SOURCE_REPO | CLOUD_PROVIDERS_SOURCE_REPO ;
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret OBSERVABILITY_SOURCE_REPO | OBSERVABILITY_SOURCE_REPO ;
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret DECKHOUSE_PRIVATE_REPO | DECKHOUSE_PRIVATE_REPO ;
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret SOURCE_REPO_SSH_KEY | SOURCE_REPO_SSH_KEY ;
            projects/data/24cb1d7c-717a-4f92-8547-26f632916a7a/Svace_CI SVACE_ANALYZE_SSH_PRIVATE_KEY | SVACE_ANALYZE_SSH_PRIVATE_KEY ;
            projects/data/24cb1d7c-717a-4f92-8547-26f632916a7a/Svace_CI SVACE_ANALYZE_HOST | SVACE_ANALYZE_HOST ;

      - name: Checkout frozen Deckhouse sources
        uses: actions/checkout@v3.5.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.deckhouse_ref }}

      - name: Verify checked out commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "${DECKHOUSE_REF}" ]]; then
            echo "::error title=Wrong commit::HEAD is ${actual}, expected ${DECKHOUSE_REF}"
            exit 1
          fi
          echo "HEAD = ${actual}"

      # Reads the checked out werf.yaml only: the first document is plain YAML, so the stage cache
      # namespace of this phase is known without rendering templates and without network access.
      - name: Verify build.cacheVersion of the checked out source
        id: cache_version
        run: |
          set -euo pipefail
          actual="$(awk '/^---[[:space:]]*$/ { doc++; next } doc > 1 { exit } /^[[:space:]]*cacheVersion:[[:space:]]*/ { sub(/^[[:space:]]*cacheVersion:[[:space:]]*/, ""); gsub(/"/, ""); sub(/[[:space:]]*$/, ""); print; exit }' werf.yaml)"
          echo "build.cacheVersion = '${actual}'"
          echo "value=${actual}" >> "$GITHUB_OUTPUT"
          if [[ -z "${EXPECT_CACHE_VERSION}" ]]; then
            echo "No expected cache version was passed; recorded only"
            exit 0
          fi
          if [[ "${actual}" != "${EXPECT_CACHE_VERSION}" ]]; then
            echo "::error title=Unexpected cache version::werf.yaml has build.cacheVersion '${actual}', expected '${EXPECT_CACHE_VERSION}'"
            exit 1
          fi

      - name: Check dev registry credentials
        id: check_dev_registry
        env:
          HOST: ${{steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_HOST}}
        run: |
          if [[ -n $HOST ]]; then
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to dev registry
        uses: docker/login-action@v2.1.0
        if: ${{ steps.check_dev_registry.outputs.has_credentials == 'true' }}
        with:
          registry: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_HOST }}
          username: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_USER }}
          password: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_PASSWORD }}
          logout: false

      - name: Download benchmark werf binary
        uses: actions/download-artifact@v4.1.8
        with:
          name: ${{ inputs.werf_artifact }}
          path: ${{ runner.temp }}/werf-artifact-${{ inputs.phase }}

      # The release-installer step of the source workflow is intentionally absent: this is the only
      # werf on PATH, so every later invocation — including `werf ci-env` — uses the pinned binary.
      - name: Install benchmark werf binary
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/werf-bench-bin-${PHASE}"
          rm -rf "$bin_dir"
          mkdir -p "$bin_dir"
          tar -xf "$RUNNER_TEMP/werf-artifact-${PHASE}/werf-candidate.tar" -C "$bin_dir"
          ( cd "$bin_dir" && sha256sum --check werf.sha256 )
          chmod +x "$bin_dir/werf"
          cat "$bin_dir/werf.metadata"
          echo "$bin_dir" >> "$GITHUB_PATH"

      # The producer's werf.metadata travels next to the binary; it is only consulted when
      # `go version -m` is unavailable on the runner. Identity does not rest on it: the
      # binary is already pinned by the sha256 the producer job published.
      - name: Verify benchmark werf binary is in use
        run: |
          set -euo pipefail
          resolved="$(command -v werf)"
          expected="$RUNNER_TEMP/werf-bench-bin-${PHASE}/werf"
          metadata="$RUNNER_TEMP/werf-bench-bin-${PHASE}/werf.metadata"
          if [[ "$resolved" != "$expected" ]]; then
            echo "::error title=Wrong werf::PATH resolves werf to ${resolved}, expected ${expected}"
            exit 1
          fi
          actual_sha256="$(sha256sum "$resolved" | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "${EXPECT_WERF_SHA256}" ]]; then
            echo "::error title=Wrong binary::werf sha256 is ${actual_sha256}, expected ${EXPECT_WERF_SHA256}"
            exit 1
          fi
          # `set -e` would kill the step on a missing toolchain before any fallback could run,
          # so the probe is guarded and its failure is a recognised, reported state.
          revision=""
          revision_source="go version -m"
          if go_build_info="$(go version -m "$resolved" 2>/dev/null)"; then
            revision="$(awk '$1 == "build" && $2 ~ /^vcs.revision=/ { sub(/^vcs.revision=/, "", $2); print $2; exit }' <<< "$go_build_info")"
          else
            echo "go toolchain unusable on this runner; falling back to the producer manifest"
          fi
          if [[ -z "$revision" ]]; then
            revision_source="producer manifest"
            if [[ ! -f "$metadata" ]]; then
              echo "::error title=No binary identity::no usable go toolchain and no producer manifest at ${metadata}"
              exit 1
            fi
            manifest_sha256="$(awk -F= '$1 == "sha256" { print $2; exit }' "$metadata")"
            manifest_kit_sha="$(awk -F= '$1 == "delivery_kit_sha" { print $2; exit }' "$metadata")"
            if [[ "$manifest_sha256" != "${EXPECT_WERF_SHA256}" ]]; then
              echo "::error title=Manifest mismatch::producer manifest records sha256 '${manifest_sha256}', expected ${EXPECT_WERF_SHA256}"
              exit 1
            fi
            if [[ "$manifest_kit_sha" != "${CANDIDATE_DELIVERY_KIT_SHA}" ]]; then
              echo "::error title=Manifest mismatch::producer manifest records delivery_kit_sha '${manifest_kit_sha}', expected ${CANDIDATE_DELIVERY_KIT_SHA}"
              exit 1
            fi
            revision="$(awk '$1 == "build" && $2 ~ /^vcs.revision=/ { sub(/^vcs.revision=/, "", $2); print $2; exit }' "$metadata")"
          fi
          if [[ "$revision" != "${CANDIDATE_DELIVERY_KIT_SHA}" ]]; then
            echo "::error title=Wrong revision::binary vcs.revision is '${revision}' (from ${revision_source}), expected ${CANDIDATE_DELIVERY_KIT_SHA}"
            exit 1
          fi
          echo "werf sha256=${actual_sha256} vcs.revision=${revision} (${revision_source})"
          werf version

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ steps.secrets.outputs.SOURCE_REPO_SSH_KEY }}
            ${{ steps.secrets.outputs.SVACE_ANALYZE_SSH_PRIVATE_KEY }}

      - name: Add ssh_known_hosts
        run: |
          HOST=$(grep -oP '(?<=@)[^/:]+' <<< ${{ steps.secrets.outputs.SOURCE_REPO_GIT }})
          echo "::add-mask::$HOST"
          IPS=$(timeout 15 nslookup "$HOST" | awk '/^Address: / { print $2 }')
          for IP in $IPS; do
            echo "::add-mask::$IP"
          done
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          HOST_KEYS=$(timeout 15 ssh-keyscan -T 5 -H "$HOST" 2>/dev/null)
          while IFS= read -r KEY_LINE; do
            CONSTANT_PART=$(awk '{print $2, $3}' <<< "$KEY_LINE")
            if ! grep -q "$CONSTANT_PART" ~/.ssh/known_hosts; then
              echo "$KEY_LINE" >> ~/.ssh/known_hosts
            fi
          done <<< "$HOST_KEYS"

      - name: Add svace analyze server to ssh_known_hosts
        continue-on-error: true
        run: |
          host=${{ steps.secrets.outputs.SVACE_ANALYZE_HOST }}
          host_ip=$(timeout 15 nslookup "$host" | awk '/^Address: / { print $2 }')
          echo "::add-mask::$host_ip"
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          HOST_KEYS=$(timeout 15 ssh-keyscan -T 5 -H "$host" 2>/dev/null)
          while IFS= read -r KEY_LINE; do
              CONSTANT_PART=$(awk '{print $2, $3}' <<< "$KEY_LINE")
              if grep -q "$CONSTANT_PART" ~/.ssh/known_hosts; then
                  ssh-keygen -R "$host"
                  ssh-keygen -R "$host_ip"
              fi
              echo "$KEY_LINE" >> ~/.ssh/known_hosts
          done <<< "$HOST_KEYS"

      # Barrier, parallel phase only: every leg publishes what it is about to run — runner name,
      # binary checksum, source commit, cache version — and only starts building once every leg
      # has published a matching marker from a different runner. Contains no credentials.
      - name: Publish ready marker
        if: ${{ inputs.barrier_group != '' }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/ready-${PHASE}.json"
          printf '{"phase":"%s","runner":"%s","werf_sha256":"%s","candidate_ref":"%s","deckhouse_ref":"%s","cache_version":"%s","ready_at":"%s"}\n' \
            "${PHASE}" "${RUNNER_NAME:-unknown}" "${EXPECT_WERF_SHA256}" "${CANDIDATE_DELIVERY_KIT_SHA}" \
            "${DECKHOUSE_REF}" "${{ steps.cache_version.outputs.value }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$marker"
          cat "$marker"

      - name: Upload ready marker
        if: ${{ inputs.barrier_group != '' }}
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ready-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.barrier_group }}-${{ inputs.phase }}
          path: ${{ runner.temp }}/ready-${{ inputs.phase }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Wait for the other legs
        if: ${{ inputs.barrier_group != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKER_PREFIX: ready-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.barrier_group }}-
          BARRIER_LEGS: ${{ inputs.barrier_legs }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, json, os, sys, time, urllib.error, urllib.parse, urllib.request, zipfile

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          prefix = os.environ["MARKER_PREFIX"]
          want = int(os.environ["BARRIER_LEGS"])
          deadline = time.time() + 600

          # GITHUB_API_URL is set by Actions itself. The token is attached to this origin
          # and to nothing else: an artifact download answers with a redirect to a signed
          # blob URL, and forwarding the token there would hand it to the storage service.
          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          api_parts = urllib.parse.urlsplit(api_url)
          api_origin = "%s://%s" % (api_parts.scheme, api_parts.netloc)

          # The only destinations a GitHub artifact redirect legitimately reaches.
          trusted_suffixes = ("github.com", "githubusercontent.com", "blob.core.windows.net",
                              "azureedge.net", "windows.net")
          max_redirects = 5
          timeout_seconds = 30
          redirect_codes = (301, 302, 303, 307, 308)


          def fail(title, message):
              print("::error title=%s::%s" % (title, message))
              sys.exit(1)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              """Stops urllib from following anything on its own: every hop is inspected here."""

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          opener = urllib.request.build_opener(NoRedirect)


          def check_destination(url):
              parts = urllib.parse.urlsplit(url)
              host = parts.hostname or ""
              # https only; the configured API scheme is accepted as well so the hop is never
              # held to a weaker standard than the endpoint this job was pointed at.
              if parts.scheme not in ("https", api_parts.scheme):
                  fail("Untrusted redirect", "artifact redirect uses scheme '%s'" % parts.scheme)
              if not (host == api_parts.hostname or
                      any(host == s or host.endswith("." + s) for s in trusted_suffixes)):
                  fail("Untrusted redirect", "artifact redirect points at host '%s'" % host)
              return "%s://%s" % (parts.scheme, parts.netloc)


          def api(url):
              """GET url, following redirects by hand. Authorization is sent to the API origin
              only, is dropped at the first hop, and no redirect target is ever printed:
              those URLs carry their own signature."""
              parts = urllib.parse.urlsplit(url)
              origin = "%s://%s" % (parts.scheme, parts.netloc)
              authenticated = True
              for _ in range(max_redirects + 1):
                  headers = {
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  }
                  if authenticated and origin == api_origin:
                      headers["Authorization"] = "Bearer " + token
                  request = urllib.request.Request(url, headers=headers)
                  try:
                      with opener.open(request, timeout=timeout_seconds) as response:
                          return response.read()
                  except urllib.error.HTTPError as error:
                      location = error.headers.get("Location") if error.headers else None
                      error.close()
                      if error.code not in redirect_codes or not location:
                          fail("Artifact request failed",
                               "%s returned HTTP %d" % (origin, error.code))
                      url = urllib.parse.urljoin(url, location)
                      origin = check_destination(url)
                      # A fresh, unauthenticated request for every hop after the API call.
                      authenticated = False
              fail("Too many redirects",
                   "more than %d redirects while reading a ready marker" % max_redirects)


          found = []
          while True:
              listing = json.loads(api(
                  "%s/repos/%s/actions/runs/%s/artifacts?per_page=100" % (api_url, repo, run_id)))
              found = [a for a in listing.get("artifacts", [])
                       if a["name"].startswith(prefix) and not a.get("expired")]
              print("ready markers: %d of %d" % (len(found), want), flush=True)
              if len(found) >= want:
                  break
              if time.time() > deadline:
                  fail("Barrier timed out",
                       "only %d of %d legs became ready within 600s; a second concurrent runner was "
                       "not available, so this run proves nothing about parallel behaviour" % (len(found), want))
              time.sleep(20)

          markers = []
          for artifact in found[:want]:
              payload = api(artifact["archive_download_url"])
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  name = archive.namelist()[0]
                  markers.append(json.loads(archive.read(name)))

          print(json.dumps(markers, indent=2, sort_keys=True))

          runners = {m["runner"] for m in markers}
          if len(runners) != want:
              fail("Legs share a runner",
                   "the %d legs reported %d distinct runner names (%s); they are not running in "
                   "parallel on separate hosts" % (want, len(runners), ", ".join(sorted(runners))))

          for key in ("werf_sha256", "candidate_ref", "deckhouse_ref", "cache_version"):
              values = {m[key] for m in markers}
              if len(values) != 1:
                  fail("Legs disagree", "%s differs between legs: %s" % (key, ", ".join(sorted(values))))

          # Readiness only: real overlap is asserted after the phases, by the
          # verify_parallel_overlap job, from the recorded build start/end timestamps.
          print("barrier passed: %d legs ready on runners %s; overlap is verified after the build"
                % (want, ", ".join(sorted(runners))))
          PY

      - name: Build deckhouse images
        id: build
        env:
          WERF_EXPERIMENTAL_IMPORT_BY_SOURCE_IMAGE_TAG: 1
          WERF_DOCKER_REGISTRY_DEBUG: 1
          WERF_TELEMETRY: "1"
          WERF_TELEMETRY_EXTRA_ATTRIBUTE_TEAM: "flantTeam=deckhouse/deckhouse"
          DECKHOUSE_DEV_REGISTRY_USER: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_USER }}
          DECKHOUSE_DEV_REGISTRY_PASSWORD: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_PASSWORD }}
          DECKHOUSE_DEV_REGISTRY_HOST: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_HOST }}
          DEV_REGISTRY_HOST: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_HOST }}
          SOURCE_REPO: "${{ steps.secrets.outputs.SOURCE_REPO_GIT }}"
          CLOUD_PROVIDERS_SOURCE_REPO: "${{ steps.secrets.outputs.CLOUD_PROVIDERS_SOURCE_REPO }}"
          OBSERVABILITY_SOURCE_REPO: "${{ steps.secrets.outputs.OBSERVABILITY_SOURCE_REPO }}"
          DECKHOUSE_PRIVATE_REPO: "${{ steps.secrets.outputs.DECKHOUSE_PRIVATE_REPO }}"
          VAULT_ADDR: "https://seguro.flant.com"
          WERF_SIGN_KEY: "hashivault://dh-dev-v01"
          TRANSIT_SECRET_ENGINE_PATH: "dev-int-signer"
          WERF_VAULT_AUTH_ROLE: "dh-signer-dev_dh-signer-dev"
          INTERMEDIARY_CERT_PATH: "dev-int-pki/issuer/default/pem"
          SIGNING_CERT_PATH: "dev-int-pki/cert/56:61:03:74:72:94:e1:e7:7b:d9:ac:44:f1:4c:57:aa:2b:b2:8d:9d"
          REGISTRY_USER: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_PASSWORD }}
          WERF_SIGN_ELF_FILES: "0"
          WERF_SIGN_MANIFEST: "1"
          WERF_ANNOTATE_LAYERS_WITH_DM_VERITY_ROOT_HASH: "1"
          WERF_VAULT_AUTH_PATH: "github"
          WERF_ACTIONS_AUDIENCE: "github-access-aud"
          WERF_OLCEDAR_VAULT_AUTH_ROLE: "dh-engine-signer"
          WERF_OLCEDAR_SYSEXT_SIGN_ENABLED: ${{ contains(fromJSON('["deckhouse/deckhouse", "deckhouse/deckhouse-test-1", "deckhouse/deckhouse-test-2"]'), github.repository) }}
          STRICT: ${{ inputs.strict }}
        run: |
          if [[ -z "${DECKHOUSE_DEV_REGISTRY_HOST}" || -z "${REGISTRY_PATH}" ]]; then
            echo "::error title=Registry not configured::DECKHOUSE_DEV_REGISTRY_HOST and REGISTRY_PATH must both be set"
            exit 1
          fi
          DEV_REGISTRY_PATH="${DECKHOUSE_DEV_REGISTRY_HOST}/${REGISTRY_PATH}"
          export REGISTRY_PATH="${DEV_REGISTRY_PATH}"
          export WERF_REPO="${DEV_REGISTRY_PATH}"
          export WERF_META_REPO="${WERF_REPO}/meta"
          echo "Stage storage repository path: ${REGISTRY_PATH}"

          sign_minimal_version="v2.71.0-dk"
          sign_current_version="$(werf version)"
          sign_supported=true
          if [[ $sign_minimal_version =~ v([0-9]+)\.([0-9]+)\.([0-9]+)-dk ]]; then
            sign_minimal_major=${BASH_REMATCH[1]}
            sign_minimal_minor=${BASH_REMATCH[2]}
          fi
          if [[ $sign_current_version =~ v([0-9]+)\.([0-9]+)\.([0-9]+)-dk ]]; then
            sign_current_major=${BASH_REMATCH[1]}
            sign_current_minor=${BASH_REMATCH[2]}
          else
            sign_supported=false
          fi
          if (( sign_current_major < sign_minimal_major )); then
            sign_supported=false
          elif (( sign_current_major == sign_minimal_major && sign_current_minor < sign_minimal_minor )); then
            sign_supported=false
          fi

          WERF_VAULT_AUTH_JWT=$(jq -r .value <<< "$(curl -qfsH "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-access-aud")")
          export WERF_VAULT_AUTH_JWT
          if [[ -z "${WERF_VAULT_AUTH_JWT}" || "${WERF_VAULT_AUTH_JWT}" == "null" ]]; then
            echo "::error::Actions token empty"
            exit 1
          fi
          echo "::add-mask::${WERF_VAULT_AUTH_JWT}"
          VAULT_TOKEN="$(curl -sfX POST "${VAULT_ADDR}/v1/auth/${WERF_VAULT_AUTH_PATH}/login" -d '{"role":"'"${WERF_VAULT_AUTH_ROLE}"'","jwt":"'"${WERF_VAULT_AUTH_JWT}"'"}' | jq -r '.auth.client_token')"
          export VAULT_TOKEN
          if [[ -z "${VAULT_TOKEN}" || "${VAULT_TOKEN}" == "null" ]]; then
            echo "::error::Vault token empty"
            exit 1
          fi
          echo "::add-mask::${VAULT_TOKEN}"

          if $sign_supported; then
            echo "Using WERF_SIGN_MANIFEST=$WERF_SIGN_MANIFEST"
            WERF_SIGN_INTERMEDIATES=$(curl -sf "${VAULT_ADDR}/v1/${INTERMEDIARY_CERT_PATH}" | base64 -w0)
            WERF_SIGN_CERT=$(curl -sf --header "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/${SIGNING_CERT_PATH}" | jq -r '.data.certificate' | base64 -w0)
            export WERF_SIGN_INTERMEDIATES WERF_SIGN_CERT
          else
            export WERF_SIGN_MANIFEST="0"
            echo "Fallback to WERF_SIGN_MANIFEST=$WERF_SIGN_MANIFEST"
          fi

          type werf
          ci_env_file="$(werf ci-env github --verbose --as-file)"
          # shellcheck source=/dev/null
          source "$ci_env_file"

          # ci-env must not redirect the build away from the working repository.
          export WERF_REPO="${DEV_REGISTRY_PATH}"
          export WERF_META_REPO="${WERF_REPO}/meta"
          echo "WERF_REPO=${WERF_REPO}"
          echo "WERF_META_REPO=${WERF_META_REPO:-<unset>}"

          strict_args=()
          if [[ "${STRICT}" == "true" ]]; then
            strict_args+=(--check-built-images)
          fi
          echo "werf build extra args: ${strict_args[*]:-<none>}"

          build_log="$RUNNER_TEMP/werf-build-${PHASE}.log"
          echo "WERF_BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          set +e
          set -o pipefail
          werf build \
            --parallel=true --parallel-tasks-limit=5 \
            --save-build-report=true \
            --build-report-path images_tags_werf.json \
            --build-report-operations=true \
            "${strict_args[@]}" \
            --log-debug 2>&1 | tee "$build_log"
          build_status=$?
          set -e
          echo "WERF_BUILD_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          if [[ -f images_tags_werf.json ]]; then
            # The unfiltered report stays on the runner for the strict check; only the filtered
            # copy, without repository and image names, is uploaded.
            cp images_tags_werf.json "$RUNNER_TEMP/report-raw-${PHASE}.json"
            grep -Ev '(DockerRepo|DockerImageName)' images_tags_werf.json > images_tags_werf_filtered.json
            mv images_tags_werf_filtered.json images_tags_werf.json
          fi

          exit $build_status

      # Reuse gate. Runs for the warm phase and for the strict phase: both must show that no
      # image and no reported stage was rebuilt and that nothing was built or discarded. The
      # strict phase additionally has to prove it published nothing: a registry row is only
      # tolerated when it is one of the known read operations, so an unrecognised registry
      # write — repository create/delete, image tag/delete/copy — cannot pass as unknown.
      # Normal warm metadata publication is not a strict-phase concern and stays allowed there.
      - name: Require full reuse
        if: ${{ (inputs.strict || inputs.expect_full_reuse) && steps.build.outcome == 'success' }}
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/report-raw-${PHASE}.json" <<'PY'
          import json, os, re, sys

          phase = os.environ["PHASE"]
          strict = os.environ.get("STRICT") == "true"
          failures = []


          def bad(message):
              failures.append(message)


          def die(title, message):
              print("::error title=%s::%s phase: %s" % (title, phase, message))
              sys.exit(1)


          try:
              with open(sys.argv[1]) as handle:
                  report = json.load(handle)
          except (OSError, ValueError) as error:
              die("Unusable build report", "cannot read the build report: %s" % error)
          if not isinstance(report, dict):
              die("Unusable build report", "the build report is not an object")


          def is_count(value):
              # bool is an int in Python; a true/false counter is a malformed report.
              return isinstance(value, int) and not isinstance(value, bool) and value >= 0


          def check_stage(stage, where):
              if not isinstance(stage, dict):
                  bad("%s is not an object" % where)
                  return
              if stage.get("Rebuilt") is not False:
                  bad("%s has Rebuilt=%s, expected false"
                      % (where, json.dumps(stage.get("Rebuilt"))))


          def check_image(name, image, where):
              if not isinstance(image, dict):
                  bad("%s image %s is not an object" % (where, name))
                  return
              if image.get("Rebuilt") is not False:
                  bad("%s image %s has Rebuilt=%s, expected false"
                      % (where, name, json.dumps(image.get("Rebuilt"))))
              stages = image.get("Stages")
              if stages is None:
                  # Stages is omitempty: absent only when the whole image anchor was reused.
                  if image.get("StagesSkipped") is not True:
                      bad("%s image %s reports no Stages and no StagesSkipped=true, so there "
                          "is no evidence its stages were reused" % (where, name))
                  return
              if not isinstance(stages, list):
                  bad("%s image %s has a non-list Stages" % (where, name))
                  return
              for index, stage in enumerate(stages):
                  stage_name = stage.get("Name") if isinstance(stage, dict) else None
                  check_stage(stage, "%s image %s stage %s"
                              % (where, name, stage_name or "#%d" % index))


          def check_images(images, where, required):
              if images is None:
                  if required:
                      bad("%s is missing: the report carries no evidence of reuse" % where)
                  return
              if not isinstance(images, dict):
                  bad("%s is not an object" % where)
                  return
              if required and not images:
                  bad("%s is empty: an empty report is not evidence of reuse" % where)
                  return
              for name, image in sorted(images.items()):
                  check_image(name, image, where)


          check_images(report.get("Images"), "Images", True)
          by_platform = report.get("ImagesByPlatform", {})
          if not isinstance(by_platform, dict):
              bad("ImagesByPlatform is not an object")
          else:
              for outer, inner in sorted(by_platform.items()):
                  check_images(inner, "ImagesByPlatform[%s]" % outer, False)

          # Stage and registry event counters: plain name -> count maps, both phases.
          work_events = re.compile(r"(^|[^a-z])(built|discarded|rebuilt)([^a-z]|$)")
          for section in ("StageCache", "RegistryCache", "Recovery"):
              counters = report.get(section)
              if counters is None:
                  continue
              if not isinstance(counters, dict):
                  bad("%s is not an object" % section)
                  continue
              for name, count in sorted(counters.items()):
                  if not is_count(count):
                      bad("%s counter '%s' is %s, expected a non-negative integer"
                          % (section, name, json.dumps(count)))
                  elif work_events.search(name) and count:
                      bad("%s counter '%s' is %d, expected 0" % (section, name, count))

          # CacheOperations is nested by caching layer; only its shape is checked. Cache misses
          # are not failures: a reused stage may still miss a lookup cache.
          cache_operations = report.get("CacheOperations")
          if cache_operations is not None:
              if not isinstance(cache_operations, dict):
                  bad("CacheOperations is not an object")
              else:
                  for operation, layers in sorted(cache_operations.items()):
                      if not isinstance(layers, dict):
                          bad("CacheOperations['%s'] is not an object of layers" % operation)
                          continue
                      for layer, record in sorted(layers.items()):
                          if not isinstance(record, dict):
                              bad("CacheOperations['%s']['%s'] is not an object"
                                  % (operation, layer))
                              continue
                          for field in ("Lookups", "Hit", "Miss", "Bypass", "Shared"):
                              if field in record and not is_count(record[field]):
                                  bad("CacheOperations['%s']['%s'].%s is %s, expected a "
                                      "non-negative integer"
                                      % (operation, layer, field, json.dumps(record[field])))

          # Registry operations that only read. Anything else under a registry backend counts as
          # a mutation for the strict phase, recognised or not: repository create/delete and
          # image tag/delete/copy cannot slip through as an unknown name.
          registry_reads = ("registry: tags list", "registry: image get", "registry: image try get")
          # Local work that publishes nothing but still means the phase built something. Local
          # inspect, pull and tag are not listed: they are neither builds nor publications, and
          # preparing a helper container is not a rebuilt stage.
          write_ops = re.compile(
              r"^(docker: |buildah: )?(image (build|push|prune|remove)|image save/load"
              r"|container (run|commit)|stage build)$")

          operations = report.get("Operations")
          if operations is None:
              if strict:
                  bad("Operations evidence is missing although the build ran with "
                      "--build-report-operations")
          elif not isinstance(operations, dict):
              bad("Operations is not an object")
          else:
              if strict and not operations:
                  bad("Operations evidence is empty although the build ran with "
                      "--build-report-operations")
              for name, record in sorted(operations.items()):
                  if not isinstance(record, dict):
                      bad("operation '%s' is not an object" % name)
                      continue
                  count = record.get("Count")
                  if not is_count(count):
                      bad("operation '%s' has Count=%s, expected a non-negative integer"
                          % (name, json.dumps(count)))
                      continue
                  if not strict or not count:
                      continue
                  if name.startswith("registry: ") and name not in registry_reads:
                      bad("registry mutation '%s' ran %d time(s)" % (name, count))
                  elif write_ops.match(name):
                      bad("write operation '%s' ran %d time(s)" % (name, count))

          print(json.dumps({
              "Operations": report.get("Operations"),
              "CacheOperations": report.get("CacheOperations"),
              "StageCache": report.get("StageCache"),
              "RegistryCache": report.get("RegistryCache"),
              "Recovery": report.get("Recovery"),
          }, indent=2, sort_keys=True))

          if failures:
              for failure in failures:
                  print("::error title=%s phase did work::%s" % (phase, failure))
              sys.exit(1)
          if strict:
              print("%s phase: every image and stage reused, nothing built or discarded, "
                    "no registry mutation" % phase)
          else:
              print("%s phase: every image and stage reused, nothing built or discarded" % phase)
          PY

      # Read-only, bounded, and limited to this build's own container names. No prune, no rm,
      # no journal or docker-events access is assumed.
      - name: Post-failure container diagnostics
        if: failure()
        continue-on-error: true
        run: |
          echo "--- werf containers (name / status / image) ---"
          timeout 15 docker ps -a \
            --filter name=werf.build. --filter name=werf.stapel. --filter name=import-server- \
            --format '{{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "--- docker system df (stdout+stderr) ---"
          timeout 15 docker system df 2>&1 || true

      # Only werf's fixed-format terminal summary lines, matched by a strict allowlist built
      # from the real pkg/opstats output, so the numbers can be read without downloading the
      # multi-gigabyte debug log. The raw log stays on the runner and is never uploaded.
      # Keep in sync with /tmp/werf-operations-parser-update.py.
      - name: Extract operations summary
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          build_log="$RUNNER_TEMP/werf-build-${PHASE}.log"
          [[ -f "$build_log" ]] || exit 0
          region="$RUNNER_TEMP/summary-region-${PHASE}.txt"
          # Keep only the final summary block: everything from the last Operations header to the
          # end of the log. Earlier debug noise mentioning "Operations" must not dilute it.
          LC_ALL=C sed $'s/\033\\[[0-9;]*m//g' "$build_log" \
            | LC_ALL=C awk '/^([0-9][^ ]*[ ])?((┌)[ ])?Operations([ ]summary)?$/ { buf = "" } { buf = buf $0 "\n" } END { printf "%s", buf }' \
            > "$region"

          # Operation names werf can print: the backend-prefixed families plus the fixed
          # unprefixed labels of pkg/opstats. Deliberately not a wildcard — an arbitrary line
          # must not qualify as an operation row merely by ending in numbers.
          op='(docker|buildah|registry|git|sync): [a-z][a-z/ -]*[a-z]|image (pull|push|save/load)|stage build|local image inspect|stapel container (prepare|lock wait)|stage lock wait \(parallel tasks\)|context add files|config render|giterminism init'
          # Stage and registry event names, for the dash rows of the historical format.
          ev='built|discarded|found in (local|repo) stages storage|copied from secondary storage|registry tags (cache hit|shared result)|broken stage detections|conveyor restarts'
          secs='[0-9]+\.[0-9]+s'
          pfx='([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2}) )?((┌|└|│) )?'

          allow="^${pfx}("
          allow="${allow}Operations|Cache summary|Operations summary|Stage cache summary|Registry cache summary"
          allow="${allow}|operation +count +sum +union +avg +max"
          allow="${allow}|(${op}) +[0-9]+( +${secs}){4}( +×[0-9]+\.[0-9]+ \(sum/union\))?"
          allow="${allow}|sum: durations added; parallel calls counted separately"
          allow="${allow}|union: time with ≥1 active call; overlapping intervals counted once"
          allow="${allow}|operation +cache +lookups +hit +miss +bypass +shared +hit%"
          allow="${allow}|(${op}) +(memory|disk)( +[0-9]+){5} +([0-9]+%|—)"
          allow="${allow}|lookups = hit \+ miss \+ bypass"
          allow="${allow}|hit% = hit / \(hit \+ miss\); bypass excluded"
          allow="${allow}|shared: calls joining an in-flight request; included in miss or bypass"
          allow="${allow}|Stages: [0-9]+ reused, [0-9]+ built, [0-9]+ discarded"
          allow="${allow}|discarded: built locally but another published stage was reused; included in reused"
          allow="${allow}|Recovery: [0-9]+ broken stage detections, [0-9]+ conveyor restarts"
          allow="${allow}|- (${op}) +[0-9]+ op +total +${secs} +wall +${secs} +avg +${secs} +max +${secs}( +×[0-9]+\.[0-9]+)?"
          allow="${allow}|- (${ev}) +[0-9]+ (stage\(s\)|request\(s\))"
          allow="${allow}|total: [0-9]+ (stage\(s\)|request\(s\))"
          allow="${allow}|command time: ${secs} \(wall must not exceed it; total may\)"
          allow="${allow}|Running time [0-9]+\.[0-9]+ seconds"
          allow="${allow})$"

          LC_ALL=C grep -E "$allow" "$region" > operations-summary.txt
          if [[ ! -s operations-summary.txt ]] && LC_ALL=C grep -q 'Operations' "$build_log"; then
            echo "::error::Operations summary was logged but extraction produced no lines"
            exit 1
          fi

          # A non-empty file is not proof of a complete extraction: every summary shape present
          # in the raw block has to come through in the same number of lines.
          status=0
          anchors=(
            'operation +count +sum +union +avg +max'
            'operation +cache +lookups +hit +miss +bypass +shared +hit%'
            'sum: durations added'
            'union: time with'
            'lookups = hit'
            'hit% = hit /'
            'shared: calls joining'
            'discarded: built locally'
            'Stages: [0-9]+ reused'
            'Recovery: [0-9]+ broken stage detections'
            'command time: [0-9]'
            'total: [0-9]+ (stage|request)\(s\)'
            'Running time [0-9]+\.[0-9]+ seconds'
            '[a-z] +[0-9]+( +[0-9]+\.[0-9]+s){4}'
            '[a-z] +(memory|disk)( +[0-9]+){5}'
            '- [a-z][a-z: /-]+ +[0-9]+ op +total'
            '- [a-z][a-z: /-]+ +[0-9]+ (stage|request)\(s\)'
          )
          for anchor in "${anchors[@]}"; do
            logged="$(LC_ALL=C grep -cE -- "$anchor" "$region" || true)"
            kept="$(LC_ALL=C grep -cE -- "$anchor" operations-summary.txt || true)"
            if [[ "$logged" -ne "$kept" ]]; then
              echo "::error::${logged} summary line(s) matching '${anchor}' were logged but only ${kept} survived the allowlist"
              status=1
            fi
          done
          wc -l operations-summary.txt
          exit "$status"

      - name: Collect benchmark metadata
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/benchmark-metadata-${PHASE}.txt"
          {
            echo "phase=${PHASE}"
            echo "strict=${{ inputs.strict }}"
            echo "barrier_group=${{ inputs.barrier_group }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "deckhouse_ref=${DECKHOUSE_REF}"
            echo "cache_version=${{ steps.cache_version.outputs.value }}"
            echo "registry_path=${REGISTRY_PATH}"
            echo "candidate_delivery_kit_sha=${CANDIDATE_DELIVERY_KIT_SHA}"
            echo "werf_sha256=${EXPECT_WERF_SHA256}"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "nproc=$(nproc)"
            echo "started_at=${BENCH_STARTED_AT:-unknown}"
            echo "build_started_at=${WERF_BUILD_STARTED_AT:-unknown}"
            echo "build_finished_at=${WERF_BUILD_FINISHED_AT:-unknown}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build_outcome=${{ steps.build.outcome }}"
            echo "--- werf binary ---"
            cat "$RUNNER_TEMP/werf-bench-bin-${PHASE}/werf.metadata" || true
            echo "--- free -h ---"
            timeout 15 free -h || true
            echo "--- docker version ---"
            timeout 15 docker version --format '{{.Server.Version}}' || true
            echo "--- df -h ---"
            timeout 15 df -h || true
            echo "--- docker system df ---"
            timeout 15 docker system df || true
          } > "$out"
          cp "$out" "./benchmark-metadata.txt"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.phase }}
          path: |
            images_tags_werf.json
            benchmark-metadata.txt
            operations-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup workdir
        if: always()
        run: |
          rm -f images_tags_werf.json benchmark-metadata.txt operations-summary.txt \
            "$RUNNER_TEMP/werf-build-${PHASE}.log" "$RUNNER_TEMP/report-raw-${PHASE}.json" \
            "$RUNNER_TEMP/summary-region-${PHASE}.txt"
