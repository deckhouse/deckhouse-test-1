# Hand-written, NOT generated by .github/render-workflows.sh.
#
# Single instrumented full FE build of the delivery-kit cache-only stage lookup candidate.
# It builds the frozen Deckhouse tree (DECKHOUSE_REF) with the candidate werf binary against
# the populated working dev registry (REGISTRY_PATH), the same stage and meta storage the
# original successful PR 779 run used. Most stages are expected to be cache hits: that is the
# intended diagnostic, not a cold A/B comparison. Normal stage and meta pushes happen; nothing
# is published to a canonical repository, no tags, releases, mirroring or module publishing.

name: Cache-only stage lookup instrumented build
on:
  push:
    branches:
      - 'bench/cache-only-20261001'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  # <template: werf_envs> — copied from .github/ci_includes/werf_envs.yml at DECKHOUSE_REF.
  WERF_ENV: "FE"
  DOCKER_BUILDKIT: "1"
  WERF_FINAL_IMAGES_ONLY: true
  WERF_LOG_TERMINAL_WIDTH: "200"
  WERF_LOG_TIME: true
  WERF_GIT_WORK_TREE_POOL_LIMIT: "10"
  GOPROXY: "${{vars.GOPROXY}}"
  # </template: werf_envs>

  # Frozen Deckhouse tree this build uses (PR 779 head, the commit of run 36746715500).
  DECKHOUSE_REF: "38d430337def921e89c3234ca103051a5818d05a"
  # Kept only as a negative guard: the candidate pin must not silently fall back to it.
  BASELINE_DELIVERY_KIT_SHA: "bdf44df89ec5f13a79bbc096e84293f9797d71be"
  CANDIDATE_DELIVERY_KIT_SHA: "b106b14fe21ace558f44fc4351c4e109044d4537"

jobs:

  build_binaries:
    name: Build werf (${{ matrix.arm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        arm: [candidate]
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: "1"
      GOMAXPROCS: "2"
      GOFLAGS: "-p=2"
      GOPROXY: "https://proxy.golang.org,direct"
    steps:
      - name: Resolve delivery-kit commit for this arm
        id: arm
        run: |
          set -euo pipefail
          if [[ "${{ matrix.arm }}" != "candidate" ]]; then
            echo "::error title=Unexpected arm::only the candidate arm is built, got '${{ matrix.arm }}'"
            exit 1
          fi
          sha="${CANDIDATE_DELIVERY_KIT_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Missing candidate pin::CANDIDATE_DELIVERY_KIT_SHA must be a full commit sha, got '${sha}'"
            exit 1
          fi
          if [[ "$sha" == "${BASELINE_DELIVERY_KIT_SHA}" ]]; then
            echo "::error title=Candidate equals baseline::the candidate pin must point at the instrumented commit"
            exit 1
          fi
          echo "Arm '${{ matrix.arm }}' builds delivery-kit ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout delivery-kit sources
        uses: actions/checkout@v3.5.2
        with:
          repository: deckhouse/delivery-kit
          ref: ${{ steps.arm.outputs.sha }}
          fetch-depth: 0
          path: delivery-kit

      - name: Verify checked out commit
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "${{ steps.arm.outputs.sha }}" ]]; then
            echo "::error title=Wrong commit::HEAD is ${actual}, expected ${{ steps.arm.outputs.sha }}"
            exit 1
          fi
          echo "HEAD = ${actual}"

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          cache: false
          go-version-file: delivery-kit/go.mod

      # libbtrfs-dev mirrors scripts/werf-builder/Dockerfile; the dev build is cgo+static and
      # links against it. task is installed from the version go.mod already pins.
      - name: Install build prerequisites
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          sudo apt-get -y update
          sudo apt-get -y install libbtrfs-dev
          task_version="$(awk '$1 == "github.com/go-task/task/v3" && $2 ~ /^v[0-9]/ { print $2; exit }' go.mod)"
          echo "Installing task ${task_version}"
          go install "github.com/go-task/task/v3/cmd/task@${task_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build werf
        working-directory: delivery-kit
        run: task --yes build version=v3.6.2-dk.1-cache-benchmark

      - name: Record build metadata
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          sha256sum -b bin/werf | sed 's| \*bin/werf| *werf|' > bin/werf.sha256
          {
            echo "arm=${{ matrix.arm }}"
            echo "delivery_kit_sha=${{ steps.arm.outputs.sha }}"
            echo "go_version=$(go version)"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256=$(cut -d' ' -f1 bin/werf.sha256)"
          } > bin/werf.metadata
          echo "--- go version -m ---" >> bin/werf.metadata
          go version -m bin/werf >> bin/werf.metadata
          cat bin/werf.sha256
          ./bin/werf version

      - name: Package werf binary
        working-directory: delivery-kit
        run: tar -cf "$RUNNER_TEMP/werf-${{ matrix.arm }}.tar" -C bin werf werf.sha256 werf.metadata

      - name: Upload werf binary
        uses: actions/upload-artifact@v4.4.0
        with:
          name: werf-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arm }}
          path: ${{ runner.temp }}/werf-${{ matrix.arm }}.tar
          if-no-files-found: error
          retention-days: 14

  build_fe:
    name: Build FE (${{ matrix.arm }})
    needs: build_binaries
    runs-on: [self-hosted, large]
    timeout-minutes: 720
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [candidate]
    env:
      # The populated working dev-registry repository of the original successful run. WERF_REPO
      # and WERF_META_REPO are derived from it below, so stage and meta storage are exactly the
      # ones that run used and most stages are expected to be cache hits.
      REGISTRY_PATH: "sys/deckhouse-oss"
      WERF_BUILDAH_MODE: "docker"
      WERF_DISABLE_AUTO_HOST_CLEANUP: "1"
      CI_COMMIT_TAG: ""
      CI_COMMIT_BRANCH: "migrate-to-werf-v3"
      CI_COMMIT_REF_NAME: "migrate-to-werf-v3"
      CI_COMMIT_REF_SLUG: "pr779"
    steps:
      - name: Isolate docker config
        run: |
          mkdir -p "$RUNNER_TEMP/.docker-${{ matrix.arm }}"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker-${{ matrix.arm }}" >> $GITHUB_ENV

      # WERF_HOME is deliberately left at the runner default: werf's host locks live under it,
      # and an isolated home hides this build's locks from every other werf process on the host.

      - name: Docker health gate
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "BENCH_STARTED_AT=${started_at}" >> $GITHUB_ENV
          echo "runner=${RUNNER_NAME:-unknown} arm=${{ matrix.arm }} started=${started_at}"
          timeout 15 docker info --format '{{.ServerVersion}} {{.Driver}} {{.DockerRootDir}} ncpu={{.NCPU}} mem={{.MemTotal}}'
          if timeout 15 docker system df; then
            echo "Docker storage accounting completed"
          else
            status=$?
            if [[ "$status" -ne 124 ]]; then
              exit "$status"
            fi
            echo "::warning::Docker storage accounting exceeded 15s; daemon info succeeded, storage integrity remains unverified"
          fi

      - name: Host resource telemetry
        continue-on-error: true
        run: |
          echo "nproc=$(nproc)"
          timeout 15 free -h || true
          timeout 15 df -h || true
          timeout 15 docker version --format '{{.Server.Version}}' || true

      - name: Split repository name
        id: split
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ $REPO == "deckhouse/deckhouse" ]; then
            echo "name=deckhouse" >> $GITHUB_OUTPUT
          else
            echo "name=deckhouse-test" >> $GITHUB_OUTPUT
          fi

      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v2
        with:
          url: https://seguro.flant.com
          path: github
          role: "${{ steps.split.outputs.name }}"
          method: jwt
          jwtGithubAudience: github-access-aud
          secrets: |
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/registry_host DECKHOUSE_DEV_REGISTRY_HOST | DECKHOUSE_DEV_REGISTRY_HOST ;
            projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/dev-registry/writetoken login | DECKHOUSE_DEV_REGISTRY_USER ;
            projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/dev-registry/writetoken password | DECKHOUSE_DEV_REGISTRY_PASSWORD ;
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret SOURCE_REPO_GIT | SOURCE_REPO_GIT ;
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret CLOUD_PROVIDERS_SOURCE_REPO | CLOUD_PROVIDERS_SOURCE_REPO ;
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret OBSERVABILITY_SOURCE_REPO | OBSERVABILITY_SOURCE_REPO ;
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret DECKHOUSE_PRIVATE_REPO | DECKHOUSE_PRIVATE_REPO ;
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/fox_pull_secret SOURCE_REPO_SSH_KEY | SOURCE_REPO_SSH_KEY ;
            projects/data/24cb1d7c-717a-4f92-8547-26f632916a7a/Svace_CI SVACE_ANALYZE_SSH_PRIVATE_KEY | SVACE_ANALYZE_SSH_PRIVATE_KEY ;
            projects/data/24cb1d7c-717a-4f92-8547-26f632916a7a/Svace_CI SVACE_ANALYZE_HOST | SVACE_ANALYZE_HOST ;

      - name: Checkout frozen Deckhouse sources
        uses: actions/checkout@v3.5.2
        with:
          fetch-depth: 0
          ref: ${{ env.DECKHOUSE_REF }}

      - name: Verify checked out commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "${DECKHOUSE_REF}" ]]; then
            echo "::error title=Wrong commit::HEAD is ${actual}, expected ${DECKHOUSE_REF}"
            exit 1
          fi
          echo "HEAD = ${actual}"

      - name: Check dev registry credentials
        id: check_dev_registry
        env:
          HOST: ${{steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_HOST}}
        run: |
          if [[ -n $HOST ]]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Login to dev registry
        uses: docker/login-action@v2.1.0
        if: ${{ steps.check_dev_registry.outputs.has_credentials == 'true' }}
        with:
          registry: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_HOST }}
          username: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_USER }}
          password: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_PASSWORD }}
          logout: false

      - name: Download benchmark werf binary
        uses: actions/download-artifact@v4.1.8
        with:
          name: werf-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arm }}
          path: ${{ runner.temp }}/werf-artifact-${{ matrix.arm }}

      # The release-installer step of the source workflow is intentionally absent: this is the only
      # werf on PATH, so every later invocation — including `werf ci-env` — uses this arm's binary.
      - name: Install benchmark werf binary
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/werf-bench-bin-${{ matrix.arm }}"
          rm -rf "$bin_dir"
          mkdir -p "$bin_dir"
          tar -xf "$RUNNER_TEMP/werf-artifact-${{ matrix.arm }}/werf-${{ matrix.arm }}.tar" -C "$bin_dir"
          ( cd "$bin_dir" && sha256sum --check werf.sha256 )
          chmod +x "$bin_dir/werf"
          cat "$bin_dir/werf.metadata"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify benchmark werf binary is in use
        run: |
          set -euo pipefail
          resolved="$(command -v werf)"
          expected="$RUNNER_TEMP/werf-bench-bin-${{ matrix.arm }}/werf"
          if [[ "$resolved" != "$expected" ]]; then
            echo "::error title=Wrong werf::PATH resolves werf to ${resolved}, expected ${expected}"
            exit 1
          fi
          sha256sum "$resolved"
          werf version

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ steps.secrets.outputs.SOURCE_REPO_SSH_KEY }}
            ${{ steps.secrets.outputs.SVACE_ANALYZE_SSH_PRIVATE_KEY }}

      - name: Add ssh_known_hosts
        run: |
          HOST=$(grep -oP '(?<=@)[^/:]+' <<< ${{ steps.secrets.outputs.SOURCE_REPO_GIT }})
          echo "::add-mask::$HOST"
          IPS=$(timeout 15 nslookup "$HOST" | awk '/^Address: / { print $2 }')
          for IP in $IPS; do
            echo "::add-mask::$IP"
          done
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          HOST_KEYS=$(timeout 15 ssh-keyscan -T 5 -H "$HOST" 2>/dev/null)
          while IFS= read -r KEY_LINE; do
            CONSTANT_PART=$(awk '{print $2, $3}' <<< "$KEY_LINE")
            if ! grep -q "$CONSTANT_PART" ~/.ssh/known_hosts; then
              echo "$KEY_LINE" >> ~/.ssh/known_hosts
            fi
          done <<< "$HOST_KEYS"

      - name: Add svace analyze server to ssh_known_hosts
        continue-on-error: true
        run: |
          host=${{ steps.secrets.outputs.SVACE_ANALYZE_HOST }}
          host_ip=$(timeout 15 nslookup "$host" | awk '/^Address: / { print $2 }')
          echo "::add-mask::$host_ip"
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          HOST_KEYS=$(timeout 15 ssh-keyscan -T 5 -H "$host" 2>/dev/null)
          while IFS= read -r KEY_LINE; do
              CONSTANT_PART=$(awk '{print $2, $3}' <<< "$KEY_LINE")
              if grep -q "$CONSTANT_PART" ~/.ssh/known_hosts; then
                  ssh-keygen -R $host
                  ssh-keygen -R $host_ip
              fi
              echo "$KEY_LINE" >> ~/.ssh/known_hosts
          done <<< "$HOST_KEYS"

      - name: Build deckhouse images
        id: build
        env:
          WERF_EXPERIMENTAL_IMPORT_BY_SOURCE_IMAGE_TAG: 1
          WERF_DOCKER_REGISTRY_DEBUG: 1
          WERF_TELEMETRY: "1"
          WERF_TELEMETRY_EXTRA_ATTRIBUTE_TEAM: "flantTeam=deckhouse/deckhouse"
          DECKHOUSE_DEV_REGISTRY_USER: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_USER }}
          DECKHOUSE_DEV_REGISTRY_PASSWORD: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_PASSWORD }}
          DECKHOUSE_DEV_REGISTRY_HOST: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_HOST }}
          DEV_REGISTRY_HOST: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_HOST }}
          SOURCE_REPO: "${{ steps.secrets.outputs.SOURCE_REPO_GIT }}"
          CLOUD_PROVIDERS_SOURCE_REPO: "${{ steps.secrets.outputs.CLOUD_PROVIDERS_SOURCE_REPO }}"
          OBSERVABILITY_SOURCE_REPO: "${{ steps.secrets.outputs.OBSERVABILITY_SOURCE_REPO }}"
          DECKHOUSE_PRIVATE_REPO: "${{ steps.secrets.outputs.DECKHOUSE_PRIVATE_REPO }}"
          VAULT_ADDR: "https://seguro.flant.com"
          WERF_SIGN_KEY: "hashivault://dh-dev-v01"
          TRANSIT_SECRET_ENGINE_PATH: "dev-int-signer"
          WERF_VAULT_AUTH_ROLE: "dh-signer-dev_dh-signer-dev"
          INTERMEDIARY_CERT_PATH: "dev-int-pki/issuer/default/pem"
          SIGNING_CERT_PATH: "dev-int-pki/cert/56:61:03:74:72:94:e1:e7:7b:d9:ac:44:f1:4c:57:aa:2b:b2:8d:9d"
          REGISTRY_USER: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_PASSWORD }}
          WERF_SIGN_ELF_FILES: "0"
          WERF_SIGN_MANIFEST: "1"
          WERF_ANNOTATE_LAYERS_WITH_DM_VERITY_ROOT_HASH: "1"
          WERF_VAULT_AUTH_PATH: "github"
          WERF_ACTIONS_AUDIENCE: "github-access-aud"
          WERF_OLCEDAR_VAULT_AUTH_ROLE: "dh-engine-signer"
          WERF_OLCEDAR_SYSEXT_SIGN_ENABLED: ${{ contains(fromJSON('["deckhouse/deckhouse", "deckhouse/deckhouse-test-1", "deckhouse/deckhouse-test-2"]'), github.repository) }}
        run: |
          if [[ -z "${DECKHOUSE_DEV_REGISTRY_HOST}" || -z "${REGISTRY_PATH}" ]]; then
            echo "::error title=Registry not configured::DECKHOUSE_DEV_REGISTRY_HOST and REGISTRY_PATH must both be set"
            exit 1
          fi
          DEV_REGISTRY_PATH="${DECKHOUSE_DEV_REGISTRY_HOST}/${REGISTRY_PATH}"
          export REGISTRY_PATH="${DEV_REGISTRY_PATH}"
          export WERF_REPO="${DEV_REGISTRY_PATH}"
          export WERF_META_REPO="${WERF_REPO}/meta"
          echo "Stage storage repository path: ${REGISTRY_PATH}"

          sign_minimal_version="v2.71.0-dk"
          sign_current_version="$(werf version)"
          sign_supported=true
          if [[ $sign_minimal_version =~ v([0-9]+)\.([0-9]+)\.([0-9]+)-dk ]]; then
            sign_minimal_major=${BASH_REMATCH[1]}
            sign_minimal_minor=${BASH_REMATCH[2]}
          fi
          if [[ $sign_current_version =~ v([0-9]+)\.([0-9]+)\.([0-9]+)-dk ]]; then
            sign_current_major=${BASH_REMATCH[1]}
            sign_current_minor=${BASH_REMATCH[2]}
          else
            sign_supported=false
          fi
          if (( sign_current_major < sign_minimal_major )); then
            sign_supported=false
          elif (( sign_current_major == sign_minimal_major && sign_current_minor < sign_minimal_minor )); then
            sign_supported=false
          fi

          export WERF_VAULT_AUTH_JWT=$(jq -r .value <<< $(curl -qfsH "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github-access-aud" ))
          if [[ -z "${WERF_VAULT_AUTH_JWT}" || "${WERF_VAULT_AUTH_JWT}" == "null" ]]; then
            echo "::error::Actions token empty"
            exit 1
          fi
          echo "::add-mask::${WERF_VAULT_AUTH_JWT}"
          export VAULT_TOKEN="$(curl -sfX POST "${VAULT_ADDR}/v1/auth/${WERF_VAULT_AUTH_PATH}/login" -d '{"role":"'${WERF_VAULT_AUTH_ROLE}'","jwt":"'${WERF_VAULT_AUTH_JWT}'"}' | jq -r '.auth.client_token')"
          if [[ -z "${VAULT_TOKEN}" || "${VAULT_TOKEN}" == "null" ]]; then
            echo "::error::Vault token empty"
            exit 1
          fi
          echo "::add-mask::${VAULT_TOKEN}"

          if $sign_supported; then
            echo "Using WERF_SIGN_MANIFEST=$WERF_SIGN_MANIFEST"
            export WERF_SIGN_INTERMEDIATES=$(curl -sf "${VAULT_ADDR}/v1/${INTERMEDIARY_CERT_PATH}" | base64 -w0)
            export WERF_SIGN_CERT=$(curl -sf --header "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/${SIGNING_CERT_PATH}" | jq -r '.data.certificate' | base64 -w0)
          else
            export WERF_SIGN_MANIFEST="0"
            echo "Fallback to WERF_SIGN_MANIFEST=$WERF_SIGN_MANIFEST"
          fi

          type werf && source $(werf ci-env github --verbose --as-file)

          # ci-env must not redirect the build away from the working repository.
          export WERF_REPO="${DEV_REGISTRY_PATH}"
          export WERF_META_REPO="${WERF_REPO}/meta"
          echo "WERF_REPO=${WERF_REPO}"
          echo "WERF_META_REPO=${WERF_META_REPO:-<unset>}"

          build_log="$RUNNER_TEMP/werf-build-${{ matrix.arm }}.log"
          set +e
          set -o pipefail
          werf build \
            --parallel=true --parallel-tasks-limit=5 \
            --save-build-report=true \
            --build-report-path images_tags_werf.json \
            --build-report-operations=true \
            --log-debug 2>&1 | tee "$build_log"
          build_status=$?
          set -e

          if [[ -f images_tags_werf.json ]]; then
            egrep -v '(DockerRepo|DockerImageName)' images_tags_werf.json > images_tags_werf_filtered.json
            mv images_tags_werf_filtered.json images_tags_werf.json
          fi

          exit $build_status

      # Read-only, bounded, and limited to this build's own container names. No prune, no rm,
      # no journal or docker-events access is assumed.
      - name: Post-failure container diagnostics
        if: failure()
        continue-on-error: true
        run: |
          echo "--- werf containers (name / status / image) ---"
          timeout 15 docker ps -a \
            --filter name=werf.build. --filter name=werf.stapel. --filter name=import-server- \
            --format '{{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "--- docker system df (stdout+stderr) ---"
          timeout 15 docker system df 2>&1 || true

      # Only werf's fixed-format terminal summary lines, matched by a strict allowlist, so the
      # numbers can be read without downloading the multi-gigabyte debug log. The raw log stays
      # on the runner and is never uploaded.
      - name: Extract operations summary
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          build_log="$RUNNER_TEMP/werf-build-${{ matrix.arm }}.log"
          [[ -f "$build_log" ]] || exit 0
          LC_ALL=C sed $'s/\033\\[[0-9;]*m//g' "$build_log" \
            | LC_ALL=C sed -n '/Operations/,$p' \
            | LC_ALL=C grep -E '^([0-9][0-9TZ:.+-]{8,30} )?((┌|└|│) )?(- [A-Za-z][A-Za-z0-9 :()-]*[0-9][0-9A-Za-z .()×]*( \(sum/union\))?|(docker:|buildah:|registry:|git:|sync:)[ A-Za-z:()-]*[0-9][0-9 .s%—]*( +×[0-9.]+ \(sum/union\))?|operation +count +sum +union +avg +max|operation +lookups +hit +miss +bypass +shared +hit%|sum: durations added; parallel calls counted separately|union: time with ≥1 active call; overlapping intervals counted once|lookups = hit \+ miss \+ bypass|hit% = hit / \(hit \+ miss\); bypass excluded|shared: calls joining an in-flight request; included in miss or bypass|Stages: [0-9]+ reused, [0-9]+ built|total: [0-9]+ (stage\(s\)|request\(s\))|command time: [0-9.]+s \((wall must not exceed it; total may|union must not exceed it; sum may)\)|Operations( summary)?|(Stage cache|Registry cache|Cache) summary|Running time [0-9.]+ seconds)$' \
            > operations-summary.txt
          if [[ ! -s operations-summary.txt ]] && LC_ALL=C grep -q 'Operations' "$build_log"; then
            echo "::error::Operations summary was logged but extraction produced no lines"
            exit 1
          fi
          wc -l operations-summary.txt

      - name: Collect benchmark metadata
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/benchmark-metadata-${{ matrix.arm }}.txt"
          {
            echo "arm=${{ matrix.arm }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "deckhouse_ref=${DECKHOUSE_REF}"
            echo "registry_path=${REGISTRY_PATH}"
            echo "candidate_delivery_kit_sha=${CANDIDATE_DELIVERY_KIT_SHA}"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "nproc=$(nproc)"
            echo "started_at=${BENCH_STARTED_AT:-unknown}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build_outcome=${{ steps.build.outcome }}"
            echo "--- werf binary ---"
            cat "$RUNNER_TEMP/werf-bench-bin-${{ matrix.arm }}/werf.metadata" || true
            echo "--- free -h ---"
            timeout 15 free -h || true
            echo "--- docker version ---"
            timeout 15 docker version --format '{{.Server.Version}}' || true
            echo "--- df -h ---"
            timeout 15 df -h || true
            echo "--- docker system df ---"
            timeout 15 docker system df || true
          } > "$out"
          cp "$out" "./benchmark-metadata.txt"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arm }}
          path: |
            images_tags_werf.json
            benchmark-metadata.txt
            operations-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup workdir
        if: always()
        run: |
          rm -f images_tags_werf.json benchmark-metadata.txt operations-summary.txt "$RUNNER_TEMP/werf-build-${{ matrix.arm }}.log"
