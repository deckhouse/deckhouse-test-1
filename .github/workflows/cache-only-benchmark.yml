# Hand-written, NOT generated by .github/render-workflows.sh.
#
# Cache-only stage lookup benchmark, dispatched by hand with three immutable commits.
# One producer builds the candidate werf binary once; four phases then reuse that exact
# binary against the populated working dev registry:
#
#   1. cold-A      full build of deckhouse_cold_ref (new cacheVersion A, everything cold)
#   2. warm-A      same commit, same config, normal build; every image and stage must be reused
#   3. strict-A    same commit, same config, plus --check-built-images; must do no work and
#                  must not mutate the registry
#   4. parallel-B  two legs of deckhouse_parallel_ref (cacheVersion B) on two different
#                  runners, released from a shared readiness barrier; a final hosted job then
#                  proves from the recorded timestamps that the two builds really overlapped
#
# Nothing is published as a product: stages and build metadata ARE pushed to the working dev
# registry exactly as a normal build pushes them, but there is no release, no tag, no
# mirroring, no module publishing, no host cleanup, no prune and no registry deletion.

name: Cache benchmark (cold / warm / strict / parallel)
run-name: cache benchmark ${{ inputs.candidate_ref }}

on:
  workflow_dispatch:
    inputs:
      parallel_only:
        description: "Run only the two parallel builds and their verification."
        required: false
        type: boolean
        default: false
      candidate_ref:
        description: "delivery-kit commit to build the benchmark werf from (full 40-hex)"
        required: true
        type: string
      deckhouse_cold_ref:
        description: "Deckhouse commit with cacheVersion A, used by cold/warm/strict (full 40-hex)"
        required: true
        type: string
        # bench/final-cache-cold-20261003, build.cacheVersion full-cache-layers-20261003-a
        default: "952424b9aec11bf6dae289cb4b2b518f4f2b51da"
      deckhouse_parallel_ref:
        description: "Deckhouse commit with cacheVersion B, used by both parallel legs (full 40-hex)"
        required: true
        type: string
        # bench/final-cache-parallel-20261003, build.cacheVersion full-cache-layers-20261003-b
        default: "8317ec97aa73ec93798de8b01593f998312c56d8"
      cache_version_a:
        description: "Optional: build.cacheVersion expected in deckhouse_cold_ref"
        required: false
        type: string
        default: "full-cache-layers-20261003-a"
      cache_version_b:
        description: "Optional: build.cacheVersion expected in deckhouse_parallel_ref"
        required: false
        type: string
        default: "full-cache-layers-20261003-b"

concurrency:
  group: cache-benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:

  build_werf:
    name: Build werf (candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.publish.outputs.artifact }}
      sha256: ${{ steps.publish.outputs.sha256 }}
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: "1"
      GOMAXPROCS: "2"
      GOFLAGS: "-p=2"
      GOPROXY: "https://proxy.golang.org,direct"
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      DECKHOUSE_COLD_REF: ${{ inputs.deckhouse_cold_ref }}
      DECKHOUSE_PARALLEL_REF: ${{ inputs.deckhouse_parallel_ref }}
    steps:
      - name: Validate dispatch inputs
        run: |
          set -euo pipefail
          status=0
          for name in CANDIDATE_REF DECKHOUSE_COLD_REF DECKHOUSE_PARALLEL_REF; do
            value="${!name}"
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Bad input::${name} must be a full 40-hex commit sha, got '${value}'"
              status=1
            fi
          done
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          if [[ "${DECKHOUSE_COLD_REF}" == "${DECKHOUSE_PARALLEL_REF}" ]]; then
            echo "::error title=Same source commit::the cold and parallel commits must differ; they carry different cache versions"
            exit 1
          fi
          echo "candidate_ref=${CANDIDATE_REF}"
          echo "deckhouse_cold_ref=${DECKHOUSE_COLD_REF}"
          echo "deckhouse_parallel_ref=${DECKHOUSE_PARALLEL_REF}"

      # Each input must already exist as an immutable commit object in its repository. The token
      # is passed as a header only; nothing from the responses other than the resolved sha is printed.
      - name: Verify every commit exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          verify() {
            repo="$1"
            sha="$2"
            resolved="$(curl -sS --fail-with-body \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/commits/${sha}" | jq -r '.sha')"
            if [[ "$resolved" != "$sha" ]]; then
              echo "::error title=Unknown commit::${repo} did not resolve ${sha} (api returned '${resolved}')"
              exit 1
            fi
            echo "${repo} ${sha} exists"
          }
          verify "deckhouse/delivery-kit" "${CANDIDATE_REF}"
          verify "${GITHUB_REPOSITORY}" "${DECKHOUSE_COLD_REF}"
          verify "${GITHUB_REPOSITORY}" "${DECKHOUSE_PARALLEL_REF}"

      - name: Checkout delivery-kit sources
        uses: actions/checkout@v3.5.2
        with:
          repository: deckhouse/delivery-kit
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          path: delivery-kit

      - name: Verify checked out commit
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "${CANDIDATE_REF}" ]]; then
            echo "::error title=Wrong commit::HEAD is ${actual}, expected ${CANDIDATE_REF}"
            exit 1
          fi
          echo "HEAD = ${actual}"

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          cache: false
          go-version-file: delivery-kit/go.mod

      # libbtrfs-dev mirrors scripts/werf-builder/Dockerfile; the dev build is cgo+static and
      # links against it. task is installed from the version go.mod already pins.
      - name: Install build prerequisites
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          sudo apt-get -y update
          sudo apt-get -y install libbtrfs-dev
          task_version="$(awk '$1 == "github.com/go-task/task/v3" && $2 ~ /^v[0-9]/ { print $2; exit }' go.mod)"
          echo "Installing task ${task_version}"
          go install "github.com/go-task/task/v3/cmd/task@${task_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build werf
        working-directory: delivery-kit
        run: task --yes build version=v3.6.2-dk.1-cache-benchmark

      - name: Record build metadata
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          sha256sum -b bin/werf | sed 's| \*bin/werf| *werf|' > bin/werf.sha256
          {
            echo "arm=candidate"
            echo "delivery_kit_sha=${CANDIDATE_REF}"
            echo "go_version=$(go version)"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256=$(cut -d' ' -f1 bin/werf.sha256)"
          } > bin/werf.metadata
          echo "--- go version -m ---" >> bin/werf.metadata
          go version -m bin/werf >> bin/werf.metadata
          cat bin/werf.sha256
          ./bin/werf version

      # The consumers re-check both of these against the artifact they download, so a binary from
      # any other source or commit cannot reach a phase.
      - name: Verify the binary carries the requested revision
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          revision="$(go version -m bin/werf | awk '$1 == "build" && $2 ~ /^vcs.revision=/ { sub(/^vcs.revision=/, "", $2); print $2; exit }')"
          modified="$(go version -m bin/werf | awk '$1 == "build" && $2 ~ /^vcs.modified=/ { sub(/^vcs.modified=/, "", $2); print $2; exit }')"
          if [[ "$revision" != "${CANDIDATE_REF}" ]]; then
            echo "::error title=Wrong revision::binary vcs.revision is '${revision}', expected ${CANDIDATE_REF}"
            exit 1
          fi
          if [[ "$modified" != "false" ]]; then
            echo "::error title=Dirty build tree::binary vcs.modified is '${modified}', expected false"
            exit 1
          fi
          echo "vcs.revision=${revision} vcs.modified=${modified}"

      - name: Package werf binary
        working-directory: delivery-kit
        run: tar -cf "$RUNNER_TEMP/werf-candidate.tar" -C bin werf werf.sha256 werf.metadata

      - name: Publish binary identity
        id: publish
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          echo "artifact=werf-${{ github.run_id }}-${{ github.run_attempt }}-candidate" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 bin/werf.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload werf binary
        uses: actions/upload-artifact@v4.4.0
        with:
          name: werf-${{ github.run_id }}-${{ github.run_attempt }}-candidate
          path: ${{ runner.temp }}/werf-candidate.tar
          if-no-files-found: error
          retention-days: 14

  cold_a:
    if: ${{ !inputs.parallel_only }}
    name: Phase 1 cold-A
    needs: build_werf
    uses: ./.github/workflows/cache-benchmark-run.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit
    with:
      phase: cold-a
      deckhouse_ref: ${{ inputs.deckhouse_cold_ref }}
      candidate_ref: ${{ inputs.candidate_ref }}
      werf_artifact: ${{ needs.build_werf.outputs.artifact }}
      werf_sha256: ${{ needs.build_werf.outputs.sha256 }}
      expect_cache_version: ${{ inputs.cache_version_a }}

  warm_a:
    name: Phase 2 warm-A
    needs: [build_werf, cold_a]
    uses: ./.github/workflows/cache-benchmark-run.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit
    with:
      phase: warm-a
      deckhouse_ref: ${{ inputs.deckhouse_cold_ref }}
      candidate_ref: ${{ inputs.candidate_ref }}
      werf_artifact: ${{ needs.build_werf.outputs.artifact }}
      werf_sha256: ${{ needs.build_werf.outputs.sha256 }}
      expect_cache_version: ${{ inputs.cache_version_a }}
      expect_full_reuse: true

  strict_a:
    name: Phase 3 strict-A
    needs: [build_werf, warm_a]
    uses: ./.github/workflows/cache-benchmark-run.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit
    with:
      phase: strict-a
      deckhouse_ref: ${{ inputs.deckhouse_cold_ref }}
      candidate_ref: ${{ inputs.candidate_ref }}
      werf_artifact: ${{ needs.build_werf.outputs.artifact }}
      werf_sha256: ${{ needs.build_werf.outputs.sha256 }}
      expect_cache_version: ${{ inputs.cache_version_a }}
      strict: true

  parallel_b:
    if: ${{ !cancelled() && needs.build_werf.result == 'success' && (inputs.parallel_only || needs.strict_a.result == 'success') }}
    name: Phase 4 parallel-B ${{ matrix.leg }}
    needs: [build_werf, strict_a]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        leg: [one, two]
    uses: ./.github/workflows/cache-benchmark-run.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit
    with:
      phase: parallel-b-${{ matrix.leg }}
      deckhouse_ref: ${{ inputs.deckhouse_parallel_ref }}
      candidate_ref: ${{ inputs.candidate_ref }}
      werf_artifact: ${{ needs.build_werf.outputs.artifact }}
      werf_sha256: ${{ needs.build_werf.outputs.sha256 }}
      expect_cache_version: ${{ inputs.cache_version_b }}
      barrier_group: parallel-b
      barrier_legs: 2

  # The barrier only proves both legs were ready at the same time. Real overlap is asserted
  # here, after the fact, from the build timestamps the two legs recorded: both succeeded, on
  # different runners, with the same binary, candidate, source and cacheVersion, and the later
  # build started before the earlier one finished.
  verify_parallel_overlap:
    if: ${{ !cancelled() && needs.parallel_b.result == 'success' }}
    name: Verify parallel-B overlap
    needs: [build_werf, parallel_b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPECT_WERF_SHA256: ${{ needs.build_werf.outputs.sha256 }}
      EXPECT_CANDIDATE_REF: ${{ inputs.candidate_ref }}
      EXPECT_DECKHOUSE_REF: ${{ inputs.deckhouse_parallel_ref }}
    steps:
      - name: Download parallel-B leg one
        uses: actions/download-artifact@v4.1.8
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-parallel-b-one
          path: legs/one

      - name: Download parallel-B leg two
        uses: actions/download-artifact@v4.1.8
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}-parallel-b-two
          path: legs/two

      - name: Assert the two builds overlapped
        run: |
          set -euo pipefail
          python3 - legs/one/benchmark-metadata.txt legs/two/benchmark-metadata.txt <<'PY'
          import datetime, os, sys

          failures = []


          def fail(message):
              failures.append(message)


          def read(path):
              """Reads the leading key=value block; the appended '--- ... ---' sections repeat
              key names and are not part of the leg's own record."""
              values = {}
              try:
                  lines = open(path).read().splitlines()
              except OSError as error:
                  fail("cannot read %s: %s" % (path, error))
                  return values
              for line in lines:
                  if line.startswith("---"):
                      break
                  key, sep, value = line.partition("=")
                  if sep:
                      values.setdefault(key.strip(), value.strip())
              return values


          def moment(leg, values, key):
              raw = values.get(key, "")
              try:
                  return datetime.datetime.strptime(raw, "%Y-%m-%dT%H:%M:%SZ")
              except ValueError:
                  fail("%s has no usable %s (got '%s')" % (leg, key, raw))
                  return None


          legs = {}
          for path in sys.argv[1:]:
              values = read(path)
              legs[values.get("phase", path)] = values

          if len(legs) != 2:
              print("::error title=Missing leg::expected two distinct parallel-B legs, got %d"
                    % len(legs))
              sys.exit(1)

          for leg, values in sorted(legs.items()):
              if values.get("build_outcome") != "success":
                  fail("%s reports build_outcome '%s', expected success"
                       % (leg, values.get("build_outcome")))
              if values.get("barrier_group") != "parallel-b":
                  fail("%s reports barrier_group '%s', expected parallel-b"
                       % (leg, values.get("barrier_group")))
              if not values.get("runner") or values.get("runner") == "unknown":
                  fail("%s does not name the runner it ran on" % leg)

          expected = {
              "werf_sha256": os.environ["EXPECT_WERF_SHA256"],
              "candidate_delivery_kit_sha": os.environ["EXPECT_CANDIDATE_REF"],
              "deckhouse_ref": os.environ["EXPECT_DECKHOUSE_REF"],
          }
          for key, want in sorted(expected.items()):
              for leg, values in sorted(legs.items()):
                  if values.get(key) != want:
                      fail("%s reports %s '%s', expected '%s'" % (leg, key, values.get(key), want))

          for key in ("cache_version", "registry_path"):
              seen = {values.get(key) for values in legs.values()}
              if len(seen) != 1 or not all(seen):
                  fail("the legs disagree on %s: %s" % (key, ", ".join(sorted(map(str, seen)))))

          runners = {values.get("runner") for values in legs.values()}
          if len(runners) != 2:
              fail("both legs ran on runner %s, so nothing about parallel behaviour was tested"
                   % ", ".join(sorted(map(str, runners))))

          for key in ("host", "docker_daemon_id"):
              identities = {values.get(key) for values in legs.values()}
              if len(identities) != 2 or not all(identities) or "unknown" in identities:
                  fail("both legs must report distinct physical hosts and Docker daemons: " + key)

          starts, ends = [], []
          for leg, values in sorted(legs.items()):
              start = moment(leg, values, "build_started_at")
              end = moment(leg, values, "build_finished_at")
              if start is None or end is None:
                  continue
              if end <= start:
                  fail("%s finished at or before it started (%s .. %s)"
                       % (leg, values["build_started_at"], values["build_finished_at"]))
                  continue
              starts.append((start, leg))
              ends.append((end, leg))

          if len(starts) == 2 and len(ends) == 2:
              last_start, last_leg = max(starts)
              first_end, first_leg = min(ends)
              if last_start >= first_end:
                  fail("the builds did not overlap: %s started at %sZ, after %s had finished "
                       "at %sZ" % (last_leg, last_start.isoformat(), first_leg,
                                   first_end.isoformat()))
              else:
                  overlap = (first_end - last_start).total_seconds()
                  print("overlap: %.0fs between %s and %s" % (overlap, last_leg, first_leg))
          else:
              fail("both legs must record a valid build_started_at and build_finished_at")

          for leg, values in sorted(legs.items()):
              print("%s: runner=%s %s .. %s" % (leg, values.get("runner"),
                                                values.get("build_started_at"),
                                                values.get("build_finished_at")))

          if failures:
              for failure in failures:
                  print("::error title=Parallel phase did not overlap::%s" % failure)
              sys.exit(1)
          print("parallel-B: two successful builds, different runners, same binary and source, "
                "overlapping in time")
          PY
