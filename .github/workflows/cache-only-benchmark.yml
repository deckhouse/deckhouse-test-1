# Diagnostic-only topic version of the registered workflow. Never merge this over the benchmark.
name: Registry connectivity probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry_probe:
    name: Read-only registry HTTPS probe
    runs-on: [self-hosted, large]
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Import registry hostname only
        id: registry
        uses: hashicorp/vault-action@v2
        with:
          url: https://seguro.flant.com
          path: github
          role: deckhouse-test
          method: jwt
          jwtGithubAudience: github-access-aud
          secrets: |
            projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/registry_host DECKHOUSE_DEV_REGISTRY_HOST | DECKHOUSE_DEV_REGISTRY_HOST ;
      - name: Probe registry transport without credentials or writes
        env:
          REGISTRY_HOST: ${{ steps.registry.outputs.DECKHOUSE_DEV_REGISTRY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import os
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          # Same registry configuration and runner pool as cold-a. This proves only
          # TCP/TLS/registry API reachability, not authenticated tag-list permission.
          host = os.environ["REGISTRY_HOST"]
          target = urllib.parse.urlsplit("https://" + host)
          if not host or not target.hostname or target.username or target.password or target.path or target.query or target.fragment:
              sys.exit("Registry hostname configuration is invalid")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              NoRedirect(), urllib.request.HTTPSHandler(context=ssl.create_default_context())
          )
          print("runner=" + os.environ.get("RUNNER_NAME", "unknown"), flush=True)
          paths = ("/v2/", "/v2/sys/deckhouse-oss/tags/list?n=1")
          for sample in range(1, 4):
              for index, path in enumerate(paths, 1):
                  request = urllib.request.Request("https://" + host + path, method="GET")
                  try:
                      try:
                          response = opener.open(request, timeout=10)
                      except urllib.error.HTTPError as error:
                          response = error
                      with response:
                          status = response.code
                          version = response.headers.get("Docker-Distribution-Api-Version", "")
                      if status not in (200, 401) or version.lower() != "registry/2.0":
                          sys.exit("Registry probe rejected response: status=%s api_header_valid=%s" %
                                   (status, version.lower() == "registry/2.0"))
                  except (urllib.error.URLError, OSError) as error:
                      # Exceptions can contain private URLs; emit only their type.
                      sys.exit("Registry transport probe failed: " + type(error).__name__)
                  print("utc=%s sample=%d endpoint=%d status=%d tls_verified=true registry_api=true" %
                        (datetime.datetime.now(datetime.timezone.utc).isoformat(), sample, index, status), flush=True)
              if sample < 3:
                  time.sleep(10)
          print("PASS: three transport samples; authenticated access and build are not tested")
          PY
