# Hand-written, NOT generated by .github/render-workflows.sh.
#
# Cache-only stage lookup benchmark, dispatched by hand with three immutable commits.
# One producer builds the candidate werf binary once; four phases then reuse that exact
# binary against the populated working dev registry:
#
#   1. cold-A      full build of deckhouse_cold_ref (new cacheVersion A, everything cold)
#   2. warm-A      same commit, same config, normal build (everything should be reused)
#   3. strict-A    same commit, same config, plus --check-built-images; must do no work
#   4. parallel-B  two legs of deckhouse_parallel_ref (cacheVersion B) on two different
#                  runners, released from a shared barrier so the builds genuinely overlap
#
# Nothing is published to a canonical repository: no tags, no releases, no mirroring, no
# module publishing, no host cleanup, no prune and no registry deletion.

name: Cache benchmark (cold / warm / strict / parallel)
run-name: cache benchmark ${{ inputs.candidate_ref }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "delivery-kit commit to build the benchmark werf from (full 40-hex)"
        required: true
        type: string
      deckhouse_cold_ref:
        description: "Deckhouse commit with cacheVersion A, used by cold/warm/strict (full 40-hex)"
        required: true
        type: string
      deckhouse_parallel_ref:
        description: "Deckhouse commit with cacheVersion B, used by both parallel legs (full 40-hex)"
        required: true
        type: string
      cache_version_a:
        description: "Optional: build.cacheVersion expected in deckhouse_cold_ref"
        required: false
        type: string
        default: ""
      cache_version_b:
        description: "Optional: build.cacheVersion expected in deckhouse_parallel_ref"
        required: false
        type: string
        default: ""

concurrency:
  group: cache-benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:

  build_werf:
    name: Build werf (candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.publish.outputs.artifact }}
      sha256: ${{ steps.publish.outputs.sha256 }}
    env:
      DEBIAN_FRONTEND: noninteractive
      TASK_X_REMOTE_TASKFILES: "1"
      GOMAXPROCS: "2"
      GOFLAGS: "-p=2"
      GOPROXY: "https://proxy.golang.org,direct"
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      DECKHOUSE_COLD_REF: ${{ inputs.deckhouse_cold_ref }}
      DECKHOUSE_PARALLEL_REF: ${{ inputs.deckhouse_parallel_ref }}
    steps:
      - name: Validate dispatch inputs
        run: |
          set -euo pipefail
          status=0
          for name in CANDIDATE_REF DECKHOUSE_COLD_REF DECKHOUSE_PARALLEL_REF; do
            value="${!name}"
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Bad input::${name} must be a full 40-hex commit sha, got '${value}'"
              status=1
            fi
          done
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          if [[ "${DECKHOUSE_COLD_REF}" == "${DECKHOUSE_PARALLEL_REF}" ]]; then
            echo "::error title=Same source commit::the cold and parallel commits must differ; they carry different cache versions"
            exit 1
          fi
          echo "candidate_ref=${CANDIDATE_REF}"
          echo "deckhouse_cold_ref=${DECKHOUSE_COLD_REF}"
          echo "deckhouse_parallel_ref=${DECKHOUSE_PARALLEL_REF}"

      # Each input must already exist as an immutable commit object in its repository. The token
      # is passed as a header only; nothing from the responses other than the resolved sha is printed.
      - name: Verify every commit exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          verify() {
            repo="$1"
            sha="$2"
            resolved="$(curl -sS --fail-with-body \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/commits/${sha}" | jq -r '.sha')"
            if [[ "$resolved" != "$sha" ]]; then
              echo "::error title=Unknown commit::${repo} did not resolve ${sha} (api returned '${resolved}')"
              exit 1
            fi
            echo "${repo} ${sha} exists"
          }
          verify "deckhouse/delivery-kit" "${CANDIDATE_REF}"
          verify "${GITHUB_REPOSITORY}" "${DECKHOUSE_COLD_REF}"
          verify "${GITHUB_REPOSITORY}" "${DECKHOUSE_PARALLEL_REF}"

      - name: Checkout delivery-kit sources
        uses: actions/checkout@v3.5.2
        with:
          repository: deckhouse/delivery-kit
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          path: delivery-kit

      - name: Verify checked out commit
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "${CANDIDATE_REF}" ]]; then
            echo "::error title=Wrong commit::HEAD is ${actual}, expected ${CANDIDATE_REF}"
            exit 1
          fi
          echo "HEAD = ${actual}"

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          cache: false
          go-version-file: delivery-kit/go.mod

      # libbtrfs-dev mirrors scripts/werf-builder/Dockerfile; the dev build is cgo+static and
      # links against it. task is installed from the version go.mod already pins.
      - name: Install build prerequisites
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          sudo apt-get -y update
          sudo apt-get -y install libbtrfs-dev
          task_version="$(awk '$1 == "github.com/go-task/task/v3" && $2 ~ /^v[0-9]/ { print $2; exit }' go.mod)"
          echo "Installing task ${task_version}"
          go install "github.com/go-task/task/v3/cmd/task@${task_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build werf
        working-directory: delivery-kit
        run: task --yes build version=v3.6.2-dk.1-cache-benchmark

      - name: Record build metadata
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          sha256sum -b bin/werf | sed 's| \*bin/werf| *werf|' > bin/werf.sha256
          {
            echo "arm=candidate"
            echo "delivery_kit_sha=${CANDIDATE_REF}"
            echo "go_version=$(go version)"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256=$(cut -d' ' -f1 bin/werf.sha256)"
          } > bin/werf.metadata
          echo "--- go version -m ---" >> bin/werf.metadata
          go version -m bin/werf >> bin/werf.metadata
          cat bin/werf.sha256
          ./bin/werf version

      # The consumers re-check both of these against the artifact they download, so a binary from
      # any other source or commit cannot reach a phase.
      - name: Verify the binary carries the requested revision
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          revision="$(go version -m bin/werf | awk '$1 == "build" && $2 ~ /^vcs.revision=/ { sub(/^vcs.revision=/, "", $2); print $2; exit }')"
          modified="$(go version -m bin/werf | awk '$1 == "build" && $2 ~ /^vcs.modified=/ { sub(/^vcs.modified=/, "", $2); print $2; exit }')"
          if [[ "$revision" != "${CANDIDATE_REF}" ]]; then
            echo "::error title=Wrong revision::binary vcs.revision is '${revision}', expected ${CANDIDATE_REF}"
            exit 1
          fi
          if [[ "$modified" != "false" ]]; then
            echo "::error title=Dirty build tree::binary vcs.modified is '${modified}', expected false"
            exit 1
          fi
          echo "vcs.revision=${revision} vcs.modified=${modified}"

      - name: Package werf binary
        working-directory: delivery-kit
        run: tar -cf "$RUNNER_TEMP/werf-candidate.tar" -C bin werf werf.sha256 werf.metadata

      - name: Publish binary identity
        id: publish
        working-directory: delivery-kit
        run: |
          set -euo pipefail
          echo "artifact=werf-${{ github.run_id }}-${{ github.run_attempt }}-candidate" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 bin/werf.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload werf binary
        uses: actions/upload-artifact@v4.4.0
        with:
          name: werf-${{ github.run_id }}-${{ github.run_attempt }}-candidate
          path: ${{ runner.temp }}/werf-candidate.tar
          if-no-files-found: error
          retention-days: 14

  cold_a:
    name: Phase 1 cold-A
    needs: build_werf
    uses: ./.github/workflows/cache-benchmark-run.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit
    with:
      phase: cold-a
      deckhouse_ref: ${{ inputs.deckhouse_cold_ref }}
      candidate_ref: ${{ inputs.candidate_ref }}
      werf_artifact: ${{ needs.build_werf.outputs.artifact }}
      werf_sha256: ${{ needs.build_werf.outputs.sha256 }}
      expect_cache_version: ${{ inputs.cache_version_a }}

  warm_a:
    name: Phase 2 warm-A
    needs: [build_werf, cold_a]
    uses: ./.github/workflows/cache-benchmark-run.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit
    with:
      phase: warm-a
      deckhouse_ref: ${{ inputs.deckhouse_cold_ref }}
      candidate_ref: ${{ inputs.candidate_ref }}
      werf_artifact: ${{ needs.build_werf.outputs.artifact }}
      werf_sha256: ${{ needs.build_werf.outputs.sha256 }}
      expect_cache_version: ${{ inputs.cache_version_a }}

  strict_a:
    name: Phase 3 strict-A
    needs: [build_werf, warm_a]
    uses: ./.github/workflows/cache-benchmark-run.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit
    with:
      phase: strict-a
      deckhouse_ref: ${{ inputs.deckhouse_cold_ref }}
      candidate_ref: ${{ inputs.candidate_ref }}
      werf_artifact: ${{ needs.build_werf.outputs.artifact }}
      werf_sha256: ${{ needs.build_werf.outputs.sha256 }}
      expect_cache_version: ${{ inputs.cache_version_a }}
      strict: true

  parallel_b:
    name: Phase 4 parallel-B ${{ matrix.leg }}
    needs: [build_werf, strict_a]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        leg: [one, two]
    uses: ./.github/workflows/cache-benchmark-run.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets: inherit
    with:
      phase: parallel-b-${{ matrix.leg }}
      deckhouse_ref: ${{ inputs.deckhouse_parallel_ref }}
      candidate_ref: ${{ inputs.candidate_ref }}
      werf_artifact: ${{ needs.build_werf.outputs.artifact }}
      werf_sha256: ${{ needs.build_werf.outputs.sha256 }}
      expect_cache_version: ${{ inputs.cache_version_b }}
      barrier_group: parallel-b
      barrier_legs: 2
