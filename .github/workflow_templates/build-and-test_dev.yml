{!{- $pullRequestContext := coll.Dict "pullRequestRefField" "needs.pull_request_info.outputs.ref" -}!}
{!{- $ctx := coll.Merge $pullRequestContext . }!}

# on every push to dev branches
name: Build and test for dev branches
on:
  pull_request_target:
     types:
      - opened
      - synchronize
      - reopened
env:
{!{ tmpl.Exec "werf_envs" | strings.Indent 2 }!}

# Cancel in-progress jobs for the same PR (pull_request_target event) or for the same branch (push event).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
{!{ tmpl.Exec "pull_request_info_job" $ctx | strings.Indent 2 }!}
{!{ tmpl.Exec "git_info_job" $ctx | strings.Indent 2 }!}

  build_fe:
    name: Build FE
    needs:
      - git_info
      - pull_request_info
    env:
      WERF_ENV: "FE"
      SVACE_ENABLED: ${{ contains(github.event.pull_request.labels.*.name, 'analyze/svace') && true || false }}
{!{ tmpl.Exec "build_template" (slice $ctx "dev" "FE") | strings.Indent 4 }!}

  build_tests:
    if: ${{ needs.pull_request_info.outputs.changes_not_markdown == 'true' }}
    name: Build tests image
    needs:
      - git_info
      - pull_request_info
{!{ tmpl.Exec "build_tests_template" (slice $ctx "dev") | strings.Indent 4 }!}

  go_generate:
    name: Go Generate
    needs:
      - git_info
      - pull_request_info
{!{ tmpl.Exec "go_generate_template" (slice $ctx) | strings.Indent 4 }!}

{!{ range $werfEnv := slice "CE" "EE" "BE" "SE" "SE-plus" "CSE" }!}
  build_{!{$werfEnv}!}:
    name: Build {!{$werfEnv}!}
    if: ${{ needs.pull_request_info.outputs.build_{!{$werfEnv}!} == 'true' }}
    needs:
      - git_info
      - pull_request_info
      - build_fe
    env:
      WERF_ENV: "{!{$werfEnv}!}"
{!{ tmpl.Exec "build_template" (slice $ctx "dev" $werfEnv) | strings.Indent 4 }!}
{!{ end }!}

  analyze_deckhouse:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'analyze/svace') }}
    name: Deckhouse static analysis
    runs-on: [self-hosted, regular]
    needs:
      - build_fe
    steps:
{!{- $secrets := slice -}!}
{!{- $secrets = append ( slice "projects/data/24cb1d7c-717a-4f92-8547-26f632916a7a/Svace_CI" "SVACE_ANALYZE_HOST" "SVACE_ANALYZE_HOST" ) $secrets -}!}
{!{- $secrets = append ( slice "projects/data/24cb1d7c-717a-4f92-8547-26f632916a7a/Svace_CI" "SVACE_ANALYZE_SSH_USER" "SVACE_ANALYZE_SSH_USER" ) $secrets -}!}
{!{- $secrets = append ( slice "projects/data/24cb1d7c-717a-4f92-8547-26f632916a7a/Svace_CI" "SVACER_URL" "SVACER_URL" ) $secrets -}!}
{!{- $secrets = append ( slice "projects/data/24cb1d7c-717a-4f92-8547-26f632916a7a/Svace_CI" "SVACER_IMPORT_USER" "SVACER_IMPORT_USER" ) $secrets -}!}
{!{- $secrets = append ( slice "projects/data/24cb1d7c-717a-4f92-8547-26f632916a7a/Svace_CI" "SVACER_IMPORT_PASSWORD" "SVACER_IMPORT_PASSWORD" ) $secrets -}!}
{!{- $secrets = append ( slice "projects/data/24cb1d7c-717a-4f92-8547-26f632916a7a/Svace_CI" "SVACE_ANALYZE_SSH_PRIVATE_KEY" "SVACE_ANALYZE_SSH_PRIVATE_KEY" ) $secrets -}!}
{!{ tmpl.Exec "import_secrets" $secrets | strings.Indent 6 }!}
      - uses: deckhouse/modules-actions/svace_analyze@v4
        with:
          project_group: "DKP"
          ci_commit_ref_name: ${{ github.event.pull_request.head.ref }}
          ci_commit_hash: ${{ github.event.pull_request.head.sha }}
          svace_analyze_host: "${{ steps.secrets.outputs.SVACE_ANALYZE_HOST }}"
          svace_analyze_ssh_user: "${{ steps.secrets.outputs.SVACE_ANALYZE_SSH_USER }}"
          svacer_url: "${{ steps.secrets.outputs.SVACER_URL }}"
          svacer_import_user: "${{ steps.secrets.outputs.SVACER_IMPORT_USER }}"
          svacer_import_password: "${{ steps.secrets.outputs.SVACER_IMPORT_PASSWORD }}"
          svace_analyze_ssh_private_key: "${{ steps.secrets.outputs.SVACE_ANALYZE_SSH_PRIVATE_KEY }}"

  doc_web_build:
    name: Doc web build
    if: ${{ github.repository == 'deckhouse/deckhouse' }}
    # Wait for success build of modules.
    needs:
      - git_info
      - pull_request_info
{!{ tmpl.Exec "web_build_template" (slice $ctx "doc" "dev") | strings.Indent 4 }!}

  main_web_build:
    name: Main web build
    if: ${{ github.repository == 'deckhouse/deckhouse' }}
    # Wait for success build of modules.
    needs:
      - git_info
      - pull_request_info
{!{ tmpl.Exec "web_build_template" (slice $ctx "main" "dev") | strings.Indent 4 }!}

  tests:
    if: ${{ needs.pull_request_info.outputs.changes_not_markdown == 'true' }}
    name: Tests
    needs:
      - git_info
      - pull_request_info
{!{ tmpl.Exec "tests_before_build_template" (slice $ctx "unit") | strings.Indent 4 }!}

  tests_node_controller:
    if: ${{ needs.pull_request_info.outputs.changes_node_controller == 'true' }}
    name: Tests node-controller
    needs:
      - git_info
      - pull_request_info
{!{ tmpl.Exec "tests_node_controller_envtest_template" (slice $ctx) | strings.Indent 4 }!}

  tests_python_webhooks:
    if: ${{ needs.pull_request_info.outputs.changes_not_markdown == 'true' }}
    name: Tests python webhooks
    needs:
      - git_info
      - pull_request_info
{!{ tmpl.Exec "tests_webhooks_template" (slice $ctx) | strings.Indent 4 }!}

  tests_dmt_lint:
    name: Tests DMT lint
    needs:
    - git_info
    - pull_request_info
{!{ tmpl.Exec "tests_dmt_lint" (slice $ctx) | strings.Indent 4 }!}

  dhctl_tests:
    if: ${{ needs.pull_request_info.outputs.changes_not_markdown == 'true' }}
    name: Dhctl Tests
    needs:
      - git_info
      - pull_request_info
      - build_tests
{!{ tmpl.Exec "tests_template" (slice $ctx "dhctl" "build_tests") | strings.Indent 4 }!}

  golint:
    if: ${{ needs.pull_request_info.outputs.changes_not_markdown == 'true' }}
    name: Go Lint Warning
    needs:
      - git_info
      - pull_request_info
      - build_tests
    env:
      DIFF_BASE: ${{ github.event.pull_request.base.sha }}
{!{ tmpl.Exec "tests_template" (slice $ctx "golint_diff" "build_tests") | strings.Indent 4 }!}

  openapi_test_cases:
    if: ${{ needs.pull_request_info.outputs.changes_not_markdown == 'true' }}
    name: OpenAPI Test Cases
    needs:
      - git_info
      - pull_request_info
      - build_tests
{!{ tmpl.Exec "tests_template" (slice $ctx "openapi_test_cases" "build_tests") | strings.Indent 4 }!}

  validators:
    if: ${{ needs.pull_request_info.outputs.changes_not_markdown == 'true' }}
    name: Validators
    needs:
      - git_info
      - pull_request_info
      - build_tests
{!{ tmpl.Exec "tests_template" (slice $ctx "validators" "build_tests") | strings.Indent 4 }!}

  set_e2e_requirement_status:
    # if previous jobs were failed we do not need set status, because checks will be failed
    if: ${{ !failure() && needs.pull_request_info.outputs.changes_not_markdown == 'true' }}
    name: Set 'waiting for e2e' commit status
    needs:
      - git_info
      - pull_request_info
      - build_fe
{!{ range $werfEnv := slice "CE" "EE" "BE" "SE" "SE-plus" "CSE" }!}
      - build_{!{$werfEnv}!}{!{ end }!}
      - validators
      - openapi_test_cases
      - golint
      - go_generate
      - dhctl_tests
      - tests
    runs-on: "self-slim"
    steps:
{!{ tmpl.Exec "checkout_step" . | strings.Indent 6 }!}
      - name: Set commit status after e2e run
        id: set_e2e_requirement_status
        uses: {!{ index (ds "actions") "actions/github-script" }!}
        env:
          STATUS_TARGET_COMMIT: ${{needs.git_info.outputs.github_sha}}
          PR_LABELS: ${{ needs.pull_request_info.outputs.labels }}
        with:
          github-token: ${{secrets.BOATSWAIN_GITHUB_TOKEN}}
          script: |
            const e2eStatus = require('./.github/scripts/js/e2e-commit-status');

            await e2eStatus.setInitialStatus({github, context, core});

  changed_images:
    name: Compute changed images
    runs-on: [self-hosted, regular]
    needs:
      - build_fe
    # Runs in main repo and test mirrors (deckhouse/deckhouse-*). All required
    # secrets (dev-registry creds) are the same ones Build FE already uses, so
    # any repo where Build FE works can run this job too.
    if: startsWith(github.repository, 'deckhouse/deckhouse')
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      changed_count:    ${{ steps.diff.outputs.changed_count }}
      matrix:           ${{ steps.diff.outputs.matrix }}
      changed_compact:  ${{ steps.diff.outputs.changed_compact }}
    steps:
      {!{ tmpl.Exec "checkout_full_step" $ctx | strings.Indent 6 }!}

      - name: Set PR tag
        id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REPO_SUFFIX=${GITHUB_REPOSITORY#deckhouse/deckhouse-}
          if [[ ${REPO_SUFFIX} == ${GITHUB_REPOSITORY} ]] ; then
            TAG="pr${PR_NUMBER}"
          else
            TAG="pr${PR_NUMBER}-${REPO_SUFFIX}"
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      {!{- /*
           No LOOP_SERVICE_NOTIFICATIONS secret imported here on purpose: this job is
           a pure plumbing step (computes the changed-image diff for downstream
           scanners) and not a security scanner. Its failures are technical and visible
           via the PR's Checks tab + the downstream `security/*` labels — we do not
           page Loop for them. See the "no fail report" comment after the steps below.
           */ -}!}
      {!{- $secrets := slice -}!}
      {!{- $secrets = append ( slice "projects/data/6db2f1ee-9b6f-4f4f-8381-2fb43060478a/github/registry_host" "DECKHOUSE_DEV_REGISTRY_HOST" "DECKHOUSE_DEV_REGISTRY_HOST" ) $secrets -}!}
      {!{- $secrets = append ( slice "projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/dev-registry/writetoken" "login" "DECKHOUSE_DEV_REGISTRY_USER" ) $secrets -}!}
      {!{- $secrets = append ( slice "projects/data/101ceaca-97cd-462f-aed5-070d9b9de175/dev-registry/writetoken" "password" "DECKHOUSE_DEV_REGISTRY_PASSWORD" ) $secrets -}!}
      {!{ tmpl.Exec "import_secrets" $secrets | strings.Indent 6 }!}

      - name: Download build_report_FE from current run
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ secrets.BOATSWAIN_GITHUB_TOKEN }}
          run_id: ${{ github.run_id }}
          name: build_report_FE
          path: ./build_report
          if_no_artifact_found: fail

      - name: Login to dev registry
        uses: {!{ index (ds "actions") "docker/login-action" }!}
        with:
          registry: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_HOST }}
          username: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_USER }}
          password: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_PASSWORD }}
          logout: false

      - name: Extract images_digests.json from dev:${{ steps.tag.outputs.TAG }}
        env:
          DEV_REGISTRY: ${{ steps.secrets.outputs.DECKHOUSE_DEV_REGISTRY_HOST }}
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          set -euo pipefail
          regctl image get-file "${DEV_REGISTRY}/sys/deckhouse-oss:${TAG}" \
            /deckhouse/modules/images_digests.json > images_digests.json
          modules=$(jq 'keys | length' images_digests.json)
          images=$(jq '[.[] | to_entries[]] | length' images_digests.json)
          echo "images_digests.json: ${modules} modules, ${images} module images."

      - name: Compute changed images
        id: diff
        env:
          BUILD_REPORT_PATH:   ./build_report/images_tags_werf.json
          IMAGES_DIGESTS_PATH: ./images_digests.json
          OUTPUT_CHANGED:      ./changed_images.json
        run: |
          python3 .github/scripts/python/changed_images.py

      - name: Upload diff artifacts
        if: ${{ always() && steps.diff.outcome != 'skipped' }}
        uses: {!{ index (ds "actions") "actions/upload-artifact" }!}
        with:
          name: changed-images-pr${{ github.event.pull_request.number }}
          path: |
            changed_images.json
          retention-days: 14
    # NOTE: no `send_fail_report` here. Loop notifications on this workflow
    # are reserved for actual scanner findings (rootless / antivirus) and
    # for the gitleaks workflow. `changed_images` is plumbing — its
    # failures surface in Actions UI and indirectly via downstream scan jobs
    # that will skip and turn the `security/*` PR labels red. Adding a Loop
    # ping here would only create noise.

  # ============================================================================
  # CVE — Trivy scan on PR images.
  # TEMPORARILY DISABLED:
  # Re-enable by set the `if: ${{ needs.changed_images.outputs.changed_count != '0' }}`
  # guard once the underlying script is fixed. While disabled, the aggregator
  # below explicitly allows `cve: skipped`, so it does not block PR merges.
  # ============================================================================
  test_cve_report_main:
    name: Trivy scan dev images
    if: ${{ false }}
    # External/fork PRs gated by 'status/ok-to-test' via pull_request_info (setFailed → this job is skipped).
    needs:
      - pull_request_info
      - changed_images
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, large]
    env:
      WORKDIR: "cve-scan"
    steps:
      {!{ tmpl.Exec "checkout_full_step"           $ctx | strings.Indent 6 }!}
      {!{ tmpl.Exec "link_bin_step"                     | strings.Indent 6 }!}
      {!{ tmpl.Exec "cve_scan_type_pr"                  | strings.Indent 6 }!}
      {!{ tmpl.Exec "cve_scan_deckhouse_images"    $ctx | strings.Indent 6 }!}
      {!{ tmpl.Exec "cve_tests_upload_reports_artifacts"| strings.Indent 6 }!}
      {!{ tmpl.Exec "unlink_bin_step"                   | strings.Indent 6 }!}
    # NOTE: no `send_fail_report` here. PR-time CVE notifications are
    # intentionally silent — Loop pings on this workflow are reserved for
    # rootless / antivirus findings (and gitleaks lives in security-scan-src).
    # CVE-found vs technical-fail aren't distinguishable from the current
    # cve_scan.sh exit code, so a blanket failure() ping would be noisy.
    # Weekly CVE (`cve-weekly`) keeps its own `send_fail_report` independent
    # of this template — that behaviour is unchanged.
    # The shared `cve_scan_deckhouse_images` step still imports
    # LOOP_SERVICE_NOTIFICATIONS because that secret block is reused by
    # cve-weekly; leaving it as-is here is intentional and harmless.

  {!{ tmpl.Exec "set_security_scan_requirement_status" slice | strings.Indent 2 }!}

  # ============================================================================
  # Rootless — default-user validation on PR images.
  # ============================================================================
  security_scan_images:
    name: Security scan images
    runs-on: [self-hosted, large]
    needs:
      - pull_request_info
      - changed_images
    {!{ tmpl.Exec "security_scan_template" (slice $ctx "pr" "with_fail_report") | strings.Indent 4 }!}

  {!{ tmpl.Exec "set_security_rootless_requirement_status" $ctx | strings.Indent 2 }!}

  # ============================================================================
  # Antivirus — Dr.Web and Kaspersky scans on PR images.
  # ============================================================================
  get-tags:
    name: Get PR tag for scanning
    runs-on: self-slim
    needs:
      - pull_request_info
    # No secrets needed, just composes the PR tag — runs in main and test mirrors.
    if: startsWith(github.repository, 'deckhouse/deckhouse')
    outputs:
      tags: ${{ steps.set-pr-tag.outputs.tags }}
    steps:
      - name: Set PR tag
        id: set-pr-tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REPO_SUFFIX=${GITHUB_REPOSITORY#deckhouse/deckhouse-}
          if [[ ${REPO_SUFFIX} == ${GITHUB_REPOSITORY} ]] ; then
            TAG="pr${PR_NUMBER}"
          else
            TAG="pr${PR_NUMBER}-${REPO_SUFFIX}"
          fi
          echo "PR tag to scan: $TAG"
          echo "tags=$(printf '%s' "$TAG" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> $GITHUB_OUTPUT

  {!{ tmpl.Exec "drweb_scan_job" $ctx | strings.Indent 2 }!}

  {!{ tmpl.Exec "kaspersky_scan_job" $ctx | strings.Indent 2 }!}

  {!{ tmpl.Exec "set_security_antivirus_requirement_status" . | strings.Indent 2 }!}

  {!{ tmpl.Exec "antivirus_notify_failure_job" . | strings.Indent 2 }!}

  # ============================================================================
  # Aggregator — single required check for branch protection.
  # Fails if any image scan did not finish with success
  # (covers blocker failure, scan failure, and skipped due to upstream issues).
  # Because this workflow is invoked via `uses:` from the build workflow, this
  # job appears on the PR's Checks tab natively — no extra commit-status
  # plumbing is required for it to be require-able by branch protection.
  # ============================================================================
  security_scan_images_required:
    name: Security scan images required
    runs-on: self-slim
    if: ${{ always() && needs.pull_request_info.result == 'success' }}
    needs:
      - pull_request_info
      - changed_images
      - test_cve_report_main
      - security_scan_images
      - drweb-scan
      - kaspersky-scan
    steps:
      - name: Aggregate scan results
        run: |
          declare -A results=(
            [changed_images]="${{ needs.changed_images.result }}"
            [cve]="${{ needs.test_cve_report_main.result }}"
            [rootless]="${{ needs.security_scan_images.result }}"
            [drweb]="${{ needs.drweb-scan.result }}"
            [kaspersky]="${{ needs.kaspersky-scan.result }}"
          )
          # Antivirus jobs intentionally skip in test repositories
          # (self-hosted antivirus runners are only in the main repo). All
          # other image scans (changed_images, rootless) are expected to run
          # in both main and test repos.
          IS_MAIN_REPO=false
          if [[ "${{ github.repository }}" == "deckhouse/deckhouse" ]]; then
            IS_MAIN_REPO=true
          fi

          failed=0
          for name in "${!results[@]}"; do
            r="${results[$name]}"
            if [[ "$r" == "success" ]]; then
              echo "✅ $name: $r"
              continue
            fi
            # CVE SCAN is intentionally DISABLED for PR mode.
            if [[ "$name" == "cve" && "$r" == "skipped" ]]; then
              echo "ℹ️  $name: $r (temporarily disabled)"
              continue
            fi
            if [[ "$IS_MAIN_REPO" == "false" && ( "$name" == "drweb" || "$name" == "kaspersky" ) && "$r" == "skipped" ]]; then
              echo "ℹ️  $name: $r (allowed in test repository)"
              continue
            fi
            echo "::error::Scan '$name' result: $r"
            failed=1
          done
          exit $failed
