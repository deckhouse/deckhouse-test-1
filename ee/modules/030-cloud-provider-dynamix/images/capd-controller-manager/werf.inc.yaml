{{- $version := "v0.5.0" }}
{{- $version_common := "v0.5.0" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
imageSpec:
  config:
    entrypoint: ["/capd-controller-manager"]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /capd-controller-manager
  to: /capd-controller-manager
  before: setup
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
fromCacheVersion: "2025-02-14.1"
git:
- url: {{ .CLOUD_PROVIDERS_SOURCE_REPO }}/dynamix/capd-controller-manager.git
  tag: {{ $version }}
  to: /src
  stageDependencies:
    install: ['**/*']
- url: {{ .CLOUD_PROVIDERS_SOURCE_REPO }}/dynamix/dynamix-common.git
  tag: {{ $version_common }}
  to: /src/dynamix-common
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [coreutils, sed]
shell:
  install:
  - cd /src
  - rm -rf .git vendor
  - sed -i -e 's# ../../dynamix-common# /src/dynamix-common#g' go.mod
  - cd /src/dynamix-common
  - rm -rf .git vendor
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
fromCacheVersion: "2025-02-14.2"
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /src
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -o /capd-controller-manager cmd/main.go
  - chown 64535:64535 /capd-controller-manager
  - chmod 0700 /capd-controller-manager
