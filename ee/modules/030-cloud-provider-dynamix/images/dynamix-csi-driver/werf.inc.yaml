{{- $version := "v0.4.0" }}
{{- $version_common := "v0.5.0" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /dynamix-csi-driver
  to: /dynamix-csi-driver
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: install
  includePaths:
  - '**/*'
imageSpec:
  config:
    entrypoint: ["/dynamix-csi-driver"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
fromCacheVersion: "2025-02-14.1"
git:
- url: {{ .CLOUD_PROVIDERS_SOURCE_REPO }}/dynamix/dynamix-csi-driver.git
  tag: {{ $version }}
  to: /src
  stageDependencies:
    install: ['**/*']
- url: {{ .CLOUD_PROVIDERS_SOURCE_REPO }}/dynamix/dynamix-common.git
  tag: {{ $version_common }}
  to: /src/dynamix-common
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [coreutils, sed]
shell:
  install:
  - cd /src
  - rm -rf vendor
  - sed -i -e 's# ../../dynamix-common# /src/dynamix-common#g' go.mod
  - cd /src/dynamix-common
  - rm -rf vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /src
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version={{ $version }}" -o /dynamix-csi-driver cmd/dynamix-csi-driver/main.go
  - chown 64535:64535 /dynamix-csi-driver
  - chmod 0755 /dynamix-csi-driver
---
{{- $csiBinaries := "/bin/chmod /bin/mount /bin/mkdir /bin/rmdir /bin/umount /bin/findmnt /sbin/badblocks /sbin/blockdev /sbin/blk* /sbin/btrfs* /sbin/dumpe2fs /sbin/e2* /sbin/findfs /sbin/fsck* /sbin/fsfreeze /sbin/fstrim /sbin/mke2fs /sbin/mkfs* /sbin/resize2fs /sbin/xfs_repair /usr/sbin/nvme /usr/sbin/parted /usr/sbin/xfs*" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /modules/000-common/images/relocate/binary_replace.sh
  to: /binary_replace.sh
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd, gnu-glibc, util-linux, e2fsprogs, xfsprogs, parted, btrfs-progs, nvme-cli, udev]
shell:
  install:
  - ln -sf /usr/bin/gawk /usr/bin/awk
  - bash /binary_replace.sh -i "{{ $csiBinaries }} /usr/bin/lsblk /usr/lib/libresolv.so.2 /usr/lib/udev/scsi_id" -o /relocate
