{{- $version := include "get_oss_version_by_id" (list "terraform-provider-decort" $) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: scratch
git:
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi
  to: /candi
  excludePaths:
  - '**/terraform_versions.yml'
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi/terraform_versions.yml
  to: /terraform-manager/terraform_versions.yml
import:
  - from: terraform-provider-decort
    add: /terraform-provider-decort
    to: /terraform-manager/terraform-provider-decort
    before: setup
{{ include "image_spec_for_infrastructure_manager" . }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ .SOURCE_REPO }}/BASIS/terraform-provider-decort.git
  tag: {{ $version }}
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
packages:
- type: os-pm
  spec: [git]
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
---
image: terraform-provider-decort
final: false
from: {{ index $.Images "builder/distroless" }}
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils, binutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
    - cd /src
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -extldflags \"-static\" -X main.version={{ $version }} -X main.commit=00000000" -o terraform-provider-decort ./cmd/decort/
    - mv /src/terraform-provider-decort /terraform-provider-decort
    - strip /terraform-provider-decort
    - chmod -R 755 /terraform-provider-decort
    - chown 64535:64535 /terraform-provider-decort
