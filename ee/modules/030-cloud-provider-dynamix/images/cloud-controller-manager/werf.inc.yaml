{{- $version := "v0.4.0" }}
{{- $version_common := "v0.5.0" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /dynamix-cloud-controller-manager
  to: /dynamix-cloud-controller-manager
  before: setup
imageSpec:
  config:
    entrypoint: ["/dynamix-cloud-controller-manager"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ .CLOUD_PROVIDERS_SOURCE_REPO }}/dynamix/cloud-controller-manager.git
  tag: {{ $version }}
  to: /src
  stageDependencies:
    install: ['**/*']
- url: {{ .CLOUD_PROVIDERS_SOURCE_REPO }}/dynamix/dynamix-common.git
  tag: {{ $version_common }}
  to: /src/dynamix-common
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [coreutils, sed]
shell:
  install:
  - cd /src
  - rm -rf .git vendor
  - sed -i -e 's# ../../dynamix-common# /src/dynamix-common#g' go.mod
  - cd /src/dynamix-common
  - rm -rf .git vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
    - cd /src
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w " -o /dynamix-cloud-controller-manager cmd/dynamix-cloud-controller-manager/main.go
    - chown 64535:64535 /dynamix-cloud-controller-manager
    - chmod 0755 /dynamix-cloud-controller-manager
