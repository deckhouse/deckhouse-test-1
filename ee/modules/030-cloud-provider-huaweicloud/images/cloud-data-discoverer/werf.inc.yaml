{{- $version := "v0.7.4" }}
{{- $version_common := "v0.8.2" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: common/distroless
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /discoverer
  to: /discoverer
  before: setup
imageSpec:
  config:
    entrypoint: ["/discoverer"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: common/src-artifact
git:
- url: {{ $.CLOUD_PROVIDERS_SOURCE_REPO }}/huaweicloud/cloud-data-discoverer.git
  tag: {{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- url: {{ $.CLOUD_PROVIDERS_SOURCE_REPO }}/huaweicloud/huaweicloud-common.git
  tag: {{ $version_common }}
  add: /
  to: /src/huaweicloud-common
  stageDependencies:
    install: ['**/*']
- add: /go_lib/cloud-data
  to: /deckhouse/go_lib/cloud-data
  excludePaths:
  - "**/*.md"
  - "**/*.yaml"
  stageDependencies:
    install:
    - go.mod
    - go.sum
    - "**/*.go"
- add: /pkg/log
  to: /deckhouse/pkg/log
  excludePaths:
  - "**/*.md"
  - "**/*.yaml"
  stageDependencies:
    install:
    - go.mod
    - go.sum
    - "**/*.go"
shell:
  install:
  - mv /deckhouse/go_lib /src
  - mv /deckhouse/pkg /src
  - cd /src
  - rm -rf vendor
  - sed -i -e 's# ../huaweicloud-common# /src/huaweicloud-common#g' go.mod
  - sed -i -e 's# /deckhouse/go_lib/cloud-data# /src/go_lib/cloud-data#g' go.mod
  - sed -i -e 's# /deckhouse/pkg/log# /src/pkg/log#g' go.mod
  - cd /src/huaweicloud-common
  - rm -rf vendor
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/golang" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  setup:
  - cd /src
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /discoverer
  - chown 64535:64535 /discoverer
  - chmod 0755 /discoverer
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName )) }}
