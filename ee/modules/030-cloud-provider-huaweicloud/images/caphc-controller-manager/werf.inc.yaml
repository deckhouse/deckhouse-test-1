{{- $version := "v0.6.5" }}
{{- $version_common := "v0.8.2" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: common/distroless
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /caphc-controller-manager
  to: /caphc-controller-manager
  before: setup
imageSpec:
  config:
    entrypoint: ["/caphc-controller-manager"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
git:
- url: {{ $.CLOUD_PROVIDERS_SOURCE_REPO }}/huaweicloud/caphc-controller-manager.git
  tag: {{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- url: {{ $.CLOUD_PROVIDERS_SOURCE_REPO }}/huaweicloud/huaweicloud-common.git
  tag: {{ $version_common }}
  add: /
  to: /src/huaweicloud-common
  stageDependencies:
    install: ['**/*']
final: false
from: common/src-artifact
shell:
  install:
  - cd /src/huaweicloud-common
  - cd /src
  - sed -i -e 's# ../huaweicloud-common# /src/huaweicloud-common#g' go.mod
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/golang" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  setup:
  - cd /src
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -o /caphc-controller-manager cmd/main.go
  - chown 64535:64535 /caphc-controller-manager
  - chmod 0700 /caphc-controller-manager
---
{{- include "vex mitigation" (list $ (printf "%s/%s" $.ModuleName $.ImageName )) }}
