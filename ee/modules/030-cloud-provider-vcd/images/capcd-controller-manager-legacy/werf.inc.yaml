{{- $version := include "get_oss_version_by_id_and_condition" (list "capi-vcd" (dict "mode" "legacy") $) }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /cluster-api-provider-cloud-director
  to: /cluster-api-provider-cloud-director
  before: setup
imageSpec:
  config:
    entrypoint: ["/cluster-api-provider-cloud-director"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}

import:
- from: {{$.ModuleName}}/cloud-controller-manager-legacy-src-artifact
  add: /src
  to: /src/ccm
  after: install
git:
- url: {{ .SOURCE_REPO }}/vmware/cluster-api-provider-cloud-director
  tag: {{ $version }}
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
      - '**/*'
packages:
- type: os-pm
  spec: [git, coreutils]
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - echo "replace github.com/vmware/cloud-provider-for-cloud-director => /src/ccm" >> go.mod
  - rm -rf .git vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  setup:
  - cd /src
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOFLAGS="-mod=mod" go build -ldflags "-s -w -X github.com/vmware/cluster-api-provider-cloud-director/release.Version={{ $version }}" -o /cluster-api-provider-cloud-director
  - chown 64535:64535 /cluster-api-provider-cloud-director
  - chmod 0755 /cluster-api-provider-cloud-director
