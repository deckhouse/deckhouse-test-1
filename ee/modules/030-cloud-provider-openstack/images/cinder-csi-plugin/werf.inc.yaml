{{- $version_map := include "get_oss_version_map_by_id_and_condition_key" (list "csi-openstack" "k8s" $) | fromYaml }}
{{- range $key, $value := $version_map }}
  {{- $k8s_version := toString $key }}
  {{- $image_version := toString $key | replace "." "-" }}
  {{- $version := toString $value }}
  {{- if $version }}
    {{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
    {{- $patch := false }}
    {{- range $path, $_ := $.Files.Glob (printf "%s/patches/%s/*.patch" $patches $k8s_version) }}
      {{- $patch = true }}
    {{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /src/cinder-csi-plugin
  to: /usr/bin/cinder-csi-plugin
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: install
  includePaths:
  - '**/*'
imageSpec:
  config:
    entrypoint: ["/bin/cinder-csi-plugin"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/kubernetes/cloud-provider-openstack.git
  tag: {{ $version }}
  to: /src
{{- if $patch }}
  stageDependencies:
    install: ['**/*']
- add: {{ $patches }}/patches/{{ $k8s_version }}
  to: /patches
  stageDependencies:
    install:
      - '**/*'
packages:
- type: os-pm
  spec: [git]
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
{{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" $ }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
packages:
- type: os-pm
  spec: [golang, bash, git, make, coreutils, sed, grep, findutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /src
  - export GOPROXY=off
  - export VERSION={{ $version }}
  - make cinder-csi-plugin
---
{{- end }}
{{- end }}
---
{{- $csiBinaries := "/bin/chmod /bin/mount /bin/mkdir /bin/rmdir /bin/umount /bin/findmnt /bin/lsblk /sbin/badblocks /sbin/blockdev /sbin/blk* /sbin/btrfs* /sbin/dumpe2fs /sbin/e2* /sbin/findfs /sbin/fsck* /sbin/fsfreeze /sbin/fstrim /sbin/mke2fs /sbin/mkfs* /sbin/resize2fs /usr/sbin/parted /usr/sbin/xfs*" }}
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /modules/000-common/images/relocate/binary_replace.sh
  to: /binary_replace.sh
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd, util-linux, e2fsprogs, xfsprogs, parted, btrfs-progs]
shell:
  install:
  - ln -sf /usr/bin/gawk /usr/bin/awk
  - bash /binary_replace.sh -i "{{ $csiBinaries }}" -o /relocate
