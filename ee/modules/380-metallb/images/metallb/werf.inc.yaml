---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- url: {{ .SOURCE_REPO }}/metallb/metallb.git
  tag: v{{ include "get_oss_version_by_id" (list "metallb" $ ) }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/380-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
packages:
- type: os-pm
  spec: [git, coreutils]
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose --allow-empty
  - rm -rf e2etest website
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /src
  - export GO_VERSION=${GOLANG_VERSION}
  - export GOPROXY=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd controller
  - go build -ldflags="-s -w" -o /controller
  - chown 64535:64535 /controller
  - chmod 0700 /controller
  - cd ../speaker
  - go build -ldflags="-s -w" -o /speaker
  - chown 64535:64535 /speaker
  - chmod 0755 /speaker
---
image: {{ .ModuleName }}/{{ .ImageName }}-controller
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /controller
  to: /controller
  before: setup
imageSpec:
  config:
    entrypoint: ["/controller"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-speaker
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /speaker
  to: /speaker
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/speaker"]
