---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [dnsmasq, coreutils, ldd, gawk]
shell:
  install:
  - mkdir -p /out/usr/bin /out/usr/lib
  - cp -L "$(command -v dnsmasq)" /out/usr/bin/dnsmasq
  - |
    for library in $(ldd "$(command -v dnsmasq)" | gawk '/=> \/|^\s*\// { for (field = 1; field <= NF; field++) if ($field ~ /^\//) print $field }'); do
      cp -L "${library}" /out/usr/lib/
    done
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-wheel-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ $.ImageName }}/src/requirements.txt
  to: /requirements.txt
  stageDependencies:
    packages:
    - '**/*'
packages:
- type: os-pm
  spec: [python==3.12.12, gnu-glibc, python-wheel]
- type: python-pip
  workdir: /
  env:
    PIP_FIND_LINKS: file:///wheels
    PIP_NO_INDEX: "1"
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
git:
- add: /{{ $.ModulePath }}modules/450-{{ $.ModuleName }}/images/{{ $.ImageName }}/src/prepare-config.py
  to: /prepare-config.py
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /out
  to: /
  before: install
- from: {{ $.ModuleName }}/{{ $.ImageName }}-wheel-artifact
  add: /
  to: /
  before: install
  includePaths:
  - usr/bin/python3*
  - usr/lib/python3*
  - usr/lib/lib*.so*
  - usr/lib/ld-linux-x86-64.so.2
  excludePaths:
  - usr/lib/python*/site-packages/pip-25.3*
  - usr/lib/python*/test
{{- include "image mount points" $ }}
