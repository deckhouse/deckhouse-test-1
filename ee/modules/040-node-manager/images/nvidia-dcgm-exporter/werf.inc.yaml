{{ $version := "4.2.3-4.1.3" }}
{{- if ne $.Env "CSE" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
- url: {{ .SOURCE_REPO }}/NVIDIA/dcgm-exporter.git
  tag: {{ $version }}
  add: /
  to: /src
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - rm -rf vendor
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, gnu-gcc, binutils, gnu-glibc-devel, make, git, bash, coreutils, sed]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /src
  - export GOPROXY=off GOSUMDB=off CGO_ENABLED=1 GOOS=linux GOARCH=amd64 GOFLAGS=-mod=readonly
  - make PREFIX=/ binary
  - cp cmd/dcgm-exporter/dcgm-exporter /
  - cp docker/dcgm-exporter-entrypoint.sh /dcgm-exporter-entrypoint.sh
  - sed -i "s/env bash/bash/" /dcgm-exporter-entrypoint.sh
  - sed -E -i "s#DCGM_EXPORTER=.+#DCGM_EXPORTER=/usr/bin/dcgm-exporter#" /dcgm-exporter-entrypoint.sh
  - chmod 700 /dcgm-exporter /dcgm-exporter-entrypoint.sh
---
image: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
from: common/relocate-artifact
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, grep, libcap, gnu-glibc]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
  add: /
  to: /usr/bin
  includePaths:
  - dcgm-exporter
  - dcgm-exporter-entrypoint.sh
  before: install
shell:
  install:
  - for tool in getcap setcap ldconfig; do command -v "$tool" >/dev/null || exit 1; done
  - /binary_replace.sh -i "/usr/bin/dcgm-exporter /usr/bin/bash /usr/bin/grep /usr/bin/sleep $(command -v getcap) $(command -v setcap) $(command -v ldconfig)" -o /relocate
  - cp /usr/bin/dcgm-exporter-entrypoint.sh /relocate/usr/bin/
  - ln -s bash /relocate/usr/bin/sh
  - mkdir -p /relocate/etc/ld.so.conf.d
  - echo "include /etc/ld.so.conf.d/*.conf" > /relocate/etc/ld.so.conf
  - printf '/usr/lib\n/usr/lib/x86_64-linux-gnu\n/usr/lib64\n' > /relocate/etc/ld.so.conf.d/nvidia-dcgm.conf
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/nvidia-dcgm-build-artifact
  add: /out/
  to: /
  includePaths:
  - usr/*
  - lib
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/etc/*
  to: /etc/dcgm-exporter
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
  add: /relocate
  to: /
  before: setup
{{- end }}
