{{- $version := "1.17.8" }}
{{- if ne $.Env "CSE" }}
---
image: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
git:
- url: {{ $.SOURCE_REPO }}/NVIDIA/nvidia-container-toolkit.git
  tag: v{{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
from: common/src-artifact
final: false
shell:
  install:
  - cd /src
  - rm -rf hack tests deployments
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
final: false
from: {{ .ModuleName }}/builder-cuda
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GOPATH=/go
  - export PATH=$GOPATH/bin:/usr/local/go/bin:$PATH
  - export GIT_COMMIT=$(cat /src/.GIT_HASH)
  - cd /src
  - export CLI_VERSION_PACKAGE=github.com/NVIDIA/nvidia-container-toolkit/internal/info
  - export GOPROXY=$(cat /run/secrets/GOPROXY) GOOS=linux GOARCH=amd64
  - make PREFIX=/usr/bin/ cmds
  - chmod 0700 /usr/bin/nvidia-ctk
{{- end }}
