{{- $version := "1.17.8" }}
{{- if ne $.Env "CSE" }}
---
image: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
- url: {{ .SOURCE_REPO }}/NVIDIA/nvidia-container-toolkit.git
  tag: v{{ $version }}
  add: /
  to: /src
shell:
  install:
  - cd /src
  - rm -rf tests deployments vendor
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, gnu-gcc, binutils, gnu-glibc-devel, make, git, bash, coreutils, sed, grep, gawk]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /src
  - export GOPROXY=off GOSUMDB=off CGO_ENABLED=1 GOOS=linux GOARCH=amd64 GOFLAGS=-mod=readonly
  - make GIT_COMMIT=v{{ $version }} PREFIX=/usr/bin/ cmds
  - chmod 0700 /usr/bin/nvidia-ctk
{{- end }}
