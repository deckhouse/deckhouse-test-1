{{ $version := "0.17.4" }}
{{- if ne $.Env "CSE" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
- url: {{ .SOURCE_REPO }}/NVIDIA/k8s-device-plugin.git
  tag: v{{ $version }}
  add: /
  to: /src/device-plugin
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src/device-plugin
  - git apply /patches/*.patch --verbose
  - rm -rf test vendor
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, gnu-gcc, binutils, gnu-glibc-devel, make, git, bash, coreutils, sed, grep, gawk]
- type: go-mod
  workdir: /src/device-plugin
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /src/device-plugin
  - export GOPROXY=off GOSUMDB=off CGO_ENABLED=1 GOOS=linux GOARCH=amd64 GOFLAGS=-mod=readonly
  - make GIT_COMMIT=v{{ $version }} PREFIX=/ cmds
  - chmod 0700 /config-manager /gpu-feature-discovery /nvidia-device-plugin
---
image: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
from: common/relocate-artifact
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
  add: /
  includePaths:
    - config-manager
    - gpu-feature-discovery
    - nvidia-device-plugin
  before: install
shell:
  install:
  - /binary_replace.sh -i "/config-manager /gpu-feature-discovery /nvidia-device-plugin" -o /relocate
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
  add: /relocate
  to: /
  before: setup
imageSpec:
  config:
    env: {
      "NVARCH": "x86_64",
      "NVIDIA_REQUIRE_CUDA": "cuda>=12.8 brand=unknown,driver>=535,driver<536 brand=grid,driver>=535,driver<536 brand=tesla,driver>=535,driver<536 brand=nvidia,driver>=535,driver<536 brand=quadro,driver>=535,driver<536 brand=quadrortx,driver>=535,driver<536 brand=nvidiartx,driver>=535,driver<536 brand=vapps,driver>=535,driver<536 brand=vpc,driver>=535,driver<536 brand=vcs,driver>=535,driver<536 brand=vws,driver>=535,driver<536 brand=cloudgaming,driver>=535,driver<536 brand=unknown,driver>=550,driver<551 brand=grid,driver>=550,driver<551 brand=tesla,driver>=550,driver<551 brand=nvidia,driver>=550,driver<551 brand=quadro,driver>=550,driver<551 brand=quadrortx,driver>=550,driver<551 brand=nvidiartx,driver>=550,driver<551 brand=vapps,driver>=550,driver<551 brand=vpc,driver>=550,driver<551 brand=vcs,driver>=550,driver<551 brand=vws,driver>=550,driver<551 brand=cloudgaming,driver>=550,driver<551 brand=unknown,driver>=560,driver<561 brand=grid,driver>=560,driver<561 brand=tesla,driver>=560,driver<561 brand=nvidia,driver>=560,driver<561 brand=quadro,driver>=560,driver<561 brand=quadrortx,driver>=560,driver<561 brand=nvidiartx,driver>=560,driver<561 brand=vapps,driver>=560,driver<561 brand=vpc,driver>=560,driver<561 brand=vcs,driver>=560,driver<561 brand=vws,driver>=560,driver<561 brand=cloudgaming,driver>=560,driver<561 brand=unknown,driver>=565,driver<566 brand=grid,driver>=565,driver<566 brand=tesla,driver>=565,driver<566 brand=nvidia,driver>=565,driver<566 brand=quadro,driver>=565,driver<566 brand=quadrortx,driver>=565,driver<566 brand=nvidiartx,driver>=565,driver<566 brand=vapps,driver>=565,driver<566 brand=vpc,driver>=565,driver<566 brand=vcs,driver>=565,driver<566 brand=vws,driver>=565,driver<566 brand=cloudgaming,driver>=565,driver<566 brand=unknown,driver>=570,driver<571 brand=grid,driver>=570,driver<571 brand=tesla,driver>=570,driver<571 brand=nvidia,driver>=570,driver<571 brand=quadro,driver>=570,driver<571 brand=quadrortx,driver>=570,driver<571 brand=nvidiartx,driver>=570,driver<571 brand=vapps,driver>=570,driver<571 brand=vpc,driver>=570,driver<571 brand=vcs,driver>=570,driver<571 brand=vws,driver>=570,driver<571 brand=cloudgaming,driver>=570,driver<571",
      "NV_CUDA_CUDART_VERSION": "12.8.1-1",
      "CUDA_VERSION":"12.8.0",
      "LD_LIBRARY_PATH":"/usr/local/cuda/lib64",
      "NVIDIA_VISIBLE_DEVICES":"all",
      "NVIDIA_DRIVER_CAPABILITIES": "compute,utility",
      "NVIDIA_DISABLE_REQUIRE":"true"
      }
{{- end }}
