{{- if ne $.Env "CSE" }}
{{- $mig_manager_version := "0.12.3" }}
{{- range $key, $value := .CandiVersionMap.k8s }}
  {{- $image_version := toString $key | replace "." "-" }}
  {{- $version := $key | toString }}
  {{- $patch := $value.patch | toString }}
  {{- $kubectl_version  := printf "%s.%s" $version $patch | replace "." "-" }}
---
image: {{ $.ModuleName }}/nvidia-mig-manager-{{ $image_version }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-runtime-artifact-{{ $image_version }}
  add: /relocate
  to: /
  before: setup
- from: common/kubernetes-artifact-{{ $kubectl_version }}
  add: /src/_output/bin/kubectl
  to: /usr/bin/kubectl
  before: setup
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-runtime-artifact-{{ $image_version }}
from: common/relocate-artifact
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, jq]
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-build-artifact-{{ $image_version }}
  add: /usr/bin
  includePaths:
  - nvidia-mig-parted
  - nvidia-mig-manager
  before: install
- from: {{ $.ModuleName }}/nvidia-container-toolkit-build-artifact
  add: /usr/bin/nvidia-ctk
  before: install
shell:
  install:
  - /binary_replace.sh -i "/usr/bin/nvidia-mig-parted /usr/bin/nvidia-mig-manager /usr/bin/nvidia-ctk /usr/bin/bash /usr/bin/jq /usr/bin/cat /usr/bin/chmod /usr/bin/chown /usr/bin/cp /usr/bin/cut /usr/bin/date /usr/bin/dirname /usr/bin/echo /usr/bin/env /usr/bin/head /usr/bin/id /usr/bin/ln /usr/bin/ls /usr/bin/mkdir /usr/bin/mktemp /usr/bin/mv /usr/bin/readlink /usr/bin/rm /usr/bin/sleep /usr/bin/sort /usr/bin/stat /usr/bin/tail /usr/bin/tee /usr/bin/timeout /usr/bin/touch /usr/bin/tr /usr/bin/true /usr/bin/uname /usr/bin/wc" -o /relocate
  - ln -s bash /relocate/usr/bin/sh
  - chroot_binary=$(command -v chroot)
  - /binary_replace.sh -i "$chroot_binary" -o /relocate
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
from: common/src-artifact
final: false
git:
- url: {{ $.SOURCE_REPO }}/NVIDIA/mig-parted.git
  tag: v{{ $mig_manager_version }}
  add: /
  to: /src/mig-parted
shell:
  install:
  - cd /src/mig-parted
  - rm -rf deployments vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-build-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
packages:
- type: os-pm
  spec: [golang, gnu-gcc, binutils, gnu-glibc-devel, make, git, bash, coreutils, sed, grep, gawk]
- type: go-mod
  workdir: /src/mig-parted
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /src/mig-parted
  - export GOPROXY=off GOSUMDB=off CGO_ENABLED=1 GOOS=linux GOARCH=amd64 GOFLAGS=-mod=readonly
  - make GIT_COMMIT=v{{ $mig_manager_version }} PREFIX=/usr/bin/ cmds
  - chmod 0700 /usr/bin/nvidia-mig-parted /usr/bin/nvidia-mig-manager
{{- end }}
{{- end }}
