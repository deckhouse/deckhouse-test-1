{{ $version := "0.17.3" }}
{{- if ne $.Env "CSE" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- url: {{ .SOURCE_REPO }}/kubernetes-sigs/node-feature-discovery.git
  tag: v{{ $version }}
  to: /src/node-feature-discovery
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
packages:
- type: os-pm
  spec: [git, coreutils]
shell:
  install:
  - cd /src/node-feature-discovery
  - git apply /patches/*.patch --verbose
  - rm -rf .git docs test
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src/node-feature-discovery
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /src/node-feature-discovery
{{- range tuple "nfd-master" "nfd-worker" "nfd-gc" }}
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -tags osusergo,netgo -ldflags "-s -w -extldflags=-static -X sigs.k8s.io/node-feature-discovery/pkg/version.version={{ $version }}" -o /{{ . }} ./cmd/{{ . }}
{{- end }}
  - chown 64535:64535 /nfd-master /nfd-worker /nfd-gc
  - chmod 0700 /nfd-master /nfd-worker /nfd-gc
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
  add: /
  includePaths:
  - nfd-master
  - nfd-worker
  - nfd-gc
  before: setup
{{- end }}
