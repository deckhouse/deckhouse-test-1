{{- if ne $.Env "CSE" }}
{{- $istioVersion := "1.27.9" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
    add: /src/ztunnel/bin/ztunnel
    to: /usr/local/bin/ztunnel
    owner: 1337
    group: 1337
    before: install
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-glibc-artifact
    add: /usr/lib/libc.so.6
    to: /usr/lib/libc.so.6
    before: install
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-glibc-artifact
    add: /usr/lib/libm.so.6
    to: /usr/lib/libm.so.6
    before: install
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-glibc-artifact
    add: /usr/lib/ld-linux-x86-64.so.2
    to: /usr/lib/ld-linux-x86-64.so.2
    before: install
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-glibc-artifact
    add: /usr/lib/libc.so
    to: /usr/lib/libc.so
    before: install
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-glibc-artifact
    add: /usr/lib/libgcc_s.so.1
    to: /usr/lib/libgcc_s.so.1
    before: install
imageSpec:
  config:
    env:  
      ISTIO_META_ISTIO_VERSION: {{ $istioVersion }}
    entrypoint: ["/usr/local/bin/ztunnel"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/ztunnel
  to: /src/ztunnel
  before: install
packages:
- type: os-pm
  spec: [rust, bash, git, coreutils, binutils, gnu-gcc, make, cmake, perl, pkgconf, openssl-devel, protoc, cyrus-sasl-devel, zlib-devel]
- type: rust-cargo
  workdir: /src/ztunnel
  env:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: url.{{ .SOURCE_REPO }}.insteadOf
    GIT_CONFIG_VALUE_0: https://github.com
shell:
  install:
  - cd /src/ztunnel
  - cargo build --offline --locked --release
  - strip /src/ztunnel/out/rust/release/ztunnel
  - mkdir -p /src/ztunnel/bin
  - mv /src/ztunnel/out/rust/release/ztunnel /src/ztunnel/bin/ztunnel
#=====================================================================================================
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- url: {{ .SOURCE_REPO }}/istio/ztunnel
  tag: {{ $istioVersion }}
  to: /src/ztunnel
{{- if ne .CargoProxy "false" }}
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [coreutils]
secrets:
- id: CARGO_PROXY
  value: {{ .CargoProxy }}
shell:
  install:
  - mkdir -p /src/ztunnel/.cargo
  - printf '\n[source.crates-io]\nreplace-with = "crates-io-mirror"\n[source.crates-io-mirror]\nregistry = "sparse+http://%s/index/"\n' "$(cat /run/secrets/CARGO_PROXY)" >> /src/ztunnel/.cargo/config.toml
{{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-glibc-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [gnu-glibc==2.43, gnu-gcc-lib==16.1.0]
---
{{- end }}
