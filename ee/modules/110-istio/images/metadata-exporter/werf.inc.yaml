---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
  add: /src/metadata-exporter
  to: /metadata-exporter
  owner: "64535"
  group: "64535"
  after: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
  add: /usr/bin/curl-static
  to: /usr/bin/curl
  owner: "64535"
  group: "64535"
  before: setup
imageSpec:
  config:
    entrypoint: ["/metadata-exporter"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, binutils, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  setup:
  - cd /src
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - go build -ldflags="-s -w" -o /src/metadata-exporter main.go exporter.go models.go metrics.go
  - chmod 0500 /src/metadata-exporter
  - chown -R 64535:64535 /src/metadata-exporter
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src
---
image: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [curl-static]
