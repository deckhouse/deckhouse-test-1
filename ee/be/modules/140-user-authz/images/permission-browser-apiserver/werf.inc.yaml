---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src
  excludePaths:
  - "**/*.md"
  - "**/*.yaml"
  - hack
# go.mod replaces github.com/deckhouse/deckhouse/go_lib/user-authz with a relative path that
# resolves to /go_lib/user-authz from /src.
- add: /go_lib/user-authz
  to: /go_lib/user-authz
  includePaths:
  - "**/*.go"
  - "**/go.mod"
  - "**/go.sum"
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /go_lib/user-authz
  to: /go_lib/user-authz
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, bash, git, coreutils, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - export GOPROXY=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - cd /src
  - |
    {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags '-s -w' -o permission-browser-apiserver .`) | indent 4 }}
  - chown 64535:64535 permission-browser-apiserver
  - chmod 0700 permission-browser-apiserver
---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /src/permission-browser-apiserver
  to: /permission-browser-apiserver
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/permission-browser-apiserver", "--tls-cipher-suites", "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA"]
---
