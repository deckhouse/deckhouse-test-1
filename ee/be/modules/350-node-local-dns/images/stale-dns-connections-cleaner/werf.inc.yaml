---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}
  to: /src
  excludePaths:
  - "**/*.md"
  - "**/*.yaml"
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-build-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  setup:
  - export GO_VERSION=${GOLANG_VERSION}
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd /src
  - go build -ldflags="-s -w" -o stale-dns-connections-cleaner .
  - chmod 0700 /src/stale-dns-connections-cleaner
---
image: {{ $.ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-build-artifact
  add: /src/stale-dns-connections-cleaner
  to: /stale-dns-connections-cleaner
  before: install
  owner: root
  group: root
imageSpec:
  config:
    entrypoint: ["/stale-dns-connections-cleaner"]
