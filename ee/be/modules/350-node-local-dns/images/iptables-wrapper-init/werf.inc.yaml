{{- $iptables_version := "1.8.9" }}
{{- $iptables_image_version := $iptables_version | replace "." "-" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
  add: /usr/bin
  to: /usr/bin
  includePaths:
  - bash
  - cp
  - rm
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
  add: /usr/lib
  to: /usr/lib
  before: setup
- from: common/iptables-wrapper
  add: /iptables-wrapper
  to: /iptables-wrapper
  before: setup
- from: registrypackages/iptables-artifact-{{ $iptables_image_version }}
  add: /
  to: /_sbin
  includePaths:
  - xtables-legacy-multi
  - xtables-nft-multi
  before: setup
- from: {{ .ModuleName }}/iptables-wrapper-init-binaries-artifact
  add: /relocate
  to: /relocate
  before: setup
{{- include "image mount points" . }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [coreutils]
shell:
  install:
    - mkdir -p /relocate/sbin
    - |
      for cmd in iptables iptables-save iptables-restore ip6tables ip6tables-save ip6tables-restore; do
        rm -f "/relocate/sbin/${cmd}"
        ln -s /sbin/iptables-wrapper "/relocate/sbin/${cmd}"
      done
    - |
      for mode in legacy nft; do
        for basecmd in iptables ip6tables; do
          for cmd in ${basecmd}-${mode} ${basecmd}-${mode}-save ${basecmd}-${mode}-restore; do
            ln -sf /sbin/xtables-${mode}-multi "/relocate/sbin/${cmd}"
          done
        done
      done
---
image: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils]
