{{- $version := "0.1" }}
{{- $image_version := $version | replace "." "-" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/scripts
  to: /src/scripts
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/src
  to: /src/d8-bcheck
---
image: {{ .ModuleName }}/{{ .ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - d8-bcheck
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: {"distro": "all", "version": "all", "d8-bcheck": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, build-base, coreutils, musl-devel, zstd-devel, libuv-devel, zlib-devel, openssl-devel, elfutils-devel]
- type: go-mod
  workdir: /src/d8-bcheck
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - ln -s /usr/lib/libuv.a /usr/lib/libuv_a.a
  - cd /src/d8-bcheck
  - export GOPROXY=off
  - CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o /d8-bcheck d8-bcheck.go
  - mv /src/scripts/* /
