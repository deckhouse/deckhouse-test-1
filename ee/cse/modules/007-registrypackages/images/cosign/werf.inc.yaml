{{- $version := "v2.6.5" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: scratch
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /
  to: /
  includePaths:
  - install
  - uninstall
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /usr/bin/cosign
  to: /cosign
  before: setup
imageSpec:
  config:
    labels: {"distro": "all", "version": "all", "cosign": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/scripts
  to: /
packages:
- type: os-pm
  spec: [cosign=={{ trimPrefix "v" $version }}]
---
