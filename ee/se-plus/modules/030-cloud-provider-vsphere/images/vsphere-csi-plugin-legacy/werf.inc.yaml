{{- $ccm_version := "v0.2.1" }}
{{- $csi_commit := "6189afc2522d83a96d3857110c61478710110347" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-csi-artifact
  add: /src/vsphere-csi
  to: /usr/bin/vsphere-csi
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: install
  includePaths:
  - '**/*'
imageSpec:
  config:
    entrypoint: ["/bin/vsphere-csi"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ .SOURCE_REPO }}/flant/vsphere-csi-driver.git
  commit: {{ $csi_commit }}
  to: /src
  stageDependencies:
    install: ['**/*']
- url: {{ .SOURCE_REPO }}/flant/cloud-provider-vsphere.git
  tag: {{ $ccm_version }}
  to: /src/ccm
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
      - '**/*'
packages:
- type: os-pm
  spec: [git, coreutils]
shell:
  install:
  - cd /src
  - git apply /patches/csi/*.patch --verbose
  - echo 'replace k8s.io/cloud-provider-vsphere => /src/ccm' >> go.mod
  - rm -rf vendor
  - cd /src/ccm
  - git apply /patches/ccm/*.patch --verbose
  - rm -rf vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-csi-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  setup:
  - cd /src
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o vsphere-csi cmd/vsphere-csi/main.go
---
{{- $csiBinaries := "/bin/chmod /bin/mount /bin/mkdir /bin/rmdir /bin/umount /bin/findmnt /bin/lsblk /sbin/badblocks /sbin/blockdev /sbin/blk* /sbin/btrfs* /sbin/dumpe2fs /sbin/e2* /sbin/findfs /sbin/fsck* /sbin/fsfreeze /sbin/fstrim /sbin/mke2fs /sbin/mkfs* /sbin/resize2fs /usr/sbin/parted /usr/sbin/xfs* /sbin/mount.nfs* /sbin/umount.nfs*" }}
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /modules/000-common/images/relocate/binary_replace.sh
  to: /binary_replace.sh
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd, util-linux, e2fsprogs, xfsprogs, btrfs-progs, nfs-utils, parted, nvme-cli, udev]
shell:
  install:
  - ln -sf /usr/bin/gawk /usr/bin/awk
  - bash /binary_replace.sh -i "{{ $csiBinaries }}" -o /relocate
