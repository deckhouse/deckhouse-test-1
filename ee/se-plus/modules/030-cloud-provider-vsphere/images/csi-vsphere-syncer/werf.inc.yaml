{{- $version_map := include "get_oss_version_map_by_id_and_condition_key" (list "csi-vsphere" "k8s" $) | fromYaml }}
{{- range $key, $value := $version_map }}
  {{- $image_version := toString $key | replace "." "-" }}
  {{- $version := toString $value }}
  {{- if $version }}
    {{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
    {{- $patch := false }}
    {{- range $path, $_ := $.Files.Glob (printf "%s/patches/%s/*.patch" $patches $version) }}
        {{- $patch = true }}
    {{- end }}
      {{- if ne $.Env "CSE" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /src/vsphere-syncer
  to: /bin/vsphere-syncer
  before: setup
imageSpec:
  config:
    entrypoint: ["/bin/vsphere-syncer"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- url: {{ $.SOURCE_REPO }}/kubernetes-sigs/vsphere-csi-driver.git
  tag: {{ $version }}
  to: /src
  stageDependencies:
    install: ['**/*']
    {{- if $patch }}
- add: {{ $patches }}/patches/{{ $version }}
  to: /patches
  stageDependencies:
    install:
    - '**/*'
    {{- end }}
packages:
- type: os-pm
  spec: [git, coreutils, sed]
shell:
  install:
  - cd /src
  {{- if $patch }}
  - git apply /patches/*.patch --verbose
  {{- end }}
  - sed -i '\#crypto/tls/fipsonly#d' pkg/syncer/admissionhandler/cnscsi_admissionhandler.go
  - rm -rf vendor
  - rm -rf .git
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
from: {{ index $.Images "builder/distroless" }}
final: false
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" $ }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - export GO_VERSION=${GOLANG_VERSION}
  - cd /src
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -a -ldflags="-w -s -extldflags=static -X sigs.k8s.io/vsphere-csi-driver/v3/pkg/syncer.Version={{ $version }}" -o vsphere-syncer ./cmd/syncer
---
    {{- end }}
  {{- end }}
{{- end }}
