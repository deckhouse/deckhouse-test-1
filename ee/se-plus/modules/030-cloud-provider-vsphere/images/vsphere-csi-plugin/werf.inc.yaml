{{- $gofsutil_version := "v0.2.0" }}
{{- $version_map := include "get_oss_version_map_by_id_and_condition_key" (list "csi-vsphere" "k8s" $) | fromYaml }}
{{- range $key, $value := $version_map }}
  {{- $image_version := toString $key | replace "." "-" }}
  {{- $version := toString $value }}
  {{- if $version }}
    {{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
    {{- $patch := false }}
    {{- range $path, $_ := $.Files.Glob (printf "%s/patches/%s/*.patch" $patches $version) }}
        {{- $patch = true }}
    {{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /src/vsphere-csi
  to: /usr/bin/vsphere-csi
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: install
  includePaths:
  - '**/*'
imageSpec:
  config:
    entrypoint: ["/bin/vsphere-csi"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- url: {{ $.SOURCE_REPO }}/kubernetes-sigs/vsphere-csi-driver.git
  tag: {{ $version }}
  to: /src
  stageDependencies:
    install: ['**/*']
- url: {{ $.SOURCE_REPO }}/gofsutil.git
  tag: {{ $gofsutil_version }}
  to: /src/gofsutil
  stageDependencies:
    install: ['**/*']
{{- if $patch }}
- add: {{ $patches }}/patches/{{ $version }}
  to: /patches
  stageDependencies:
    install:
      - '**/*'
{{- end }}
packages:
- type: os-pm
  spec: [golang, git, sed]
shell:
  install:
  - cd /src
  {{- if $patch}}
  - git apply /patches/*.patch --verbose
  {{- end}}
  - sed -i -e 's# ../gofsutil# /src/gofsutil#g' go.mod
  - cd /src/gofsutil
  - go mod init deckhouse/3p/gofsutil
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" $ }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  setup:
  - cd /src
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o vsphere-csi cmd/vsphere-csi/main.go
  {{- end }}
{{- end }}
---
{{- $csiBinaries := "/bin/chmod /bin/mount /bin/mkdir /bin/rmdir /bin/umount /bin/findmnt /bin/lsblk /sbin/badblocks /sbin/blockdev /sbin/blk* /sbin/btrfs* /sbin/dumpe2fs /sbin/e2* /sbin/findfs /sbin/fsck* /sbin/fsfreeze /sbin/fstrim /sbin/mke2fs /sbin/mkfs* /sbin/resize2fs /usr/sbin/parted /usr/sbin/xfs* /sbin/mount.nfs* /sbin/umount.nfs*" }}
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /modules/000-common/images/relocate/binary_replace.sh
  to: /binary_replace.sh
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd, util-linux, e2fsprogs, xfsprogs, btrfs-progs, nfs-utils, parted, nvme-cli, udev]
shell:
  install:
  - ln -sf /usr/bin/gawk /usr/bin/awk
  - bash /binary_replace.sh -i "{{ $csiBinaries }}" -o /relocate
