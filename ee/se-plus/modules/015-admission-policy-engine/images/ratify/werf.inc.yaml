{{ $ratifyVersion := include "get_oss_version_by_id" (list "ratify" $ ) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /ratify
  to: /ratify
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: [ "/ratify" ]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- url: {{ .SOURCE_REPO }}/ratify-project/ratify.git
  tag: v{{ $ratifyVersion }}
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/015-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
- add: /{{ $.ModulePath }}modules/015-{{ $.ModuleName }}/crds
  to: /module_crds
  stageDependencies:
    install:
    - '**/*'
  includePaths:
  - ratify/*.yaml    
packages:
- type: os-pm
  spec: [git, coreutils, diffutils]
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose --allow-empty
  - rm -rf .git
  # check if module crds/ratify are the same as ratify crds
  - | 
    echo "Checking if module crds/ratify are the same as ratify crds"
    diff -qr "/src/config/crd/bases" "/module_crds/ratify"   
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang==1.26.8, bash, git, coreutils, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - export GOPROXY=off
  - cd /src
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - |
    {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags="-s -w" -o /ratify cmd/ratify/main.go`) | indent 4 }}
  - chown 64535:64535 /ratify
  - chmod 0700 /ratify
---
