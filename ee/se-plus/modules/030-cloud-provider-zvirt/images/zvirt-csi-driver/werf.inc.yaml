{{- $version := include "get_oss_version_by_id" (list "csi-ovirt" $) }}
{{- $go_ovirt_version := "v0.0.1-flant" }}
{{- $go_ovirt_client_version := "v3.2.0-flant-1" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /ovirt-csi-driver
  to: /ovirt-csi-driver
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: install
  includePaths:
  - '**/*'
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/ovirt-csi-driver"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ .SOURCE_REPO }}/openshift/ovirt-csi-driver.git
  branch: {{ $version }}
  to: /src
  stageDependencies:
    install: ['**/*']
- url: {{ .CLOUD_PROVIDERS_SOURCE_REPO }}/ovirt/go-ovirt
  tag: {{ $go_ovirt_version }}
  to: /src/go-ovirt
  stageDependencies:
    install: ['**/*']
- url: {{ .SOURCE_REPO }}/flant/go-ovirt-client.git
  tag: {{ $go_ovirt_client_version }}
  to: /src/go-ovirt-client
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
packages:
- type: os-pm
  spec: [git, coreutils]
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - echo "replace github.com/ovirt/go-ovirt => /src/go-ovirt" >> go.mod
  - echo "replace github.com/ovirt/go-ovirt-client/v3 => /src/go-ovirt-client" >> go.mod
  - rm -rf vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  setup:
  - cd /src
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X version.Version={{ $version }}" -o /ovirt-csi-driver ./cmd/ovirt-csi-driver/ovirt-csi-driver.go
---
{{- $csiBinaries := "/bin/chmod /bin/mount /bin/mkdir /bin/rmdir /bin/umount /bin/findmnt /sbin/badblocks /sbin/blockdev /sbin/blk* /sbin/btrfs* /sbin/dumpe2fs /sbin/e2* /sbin/findfs /sbin/fsck* /sbin/fsfreeze /sbin/fstrim /sbin/mke2fs /sbin/mkfs* /sbin/resize2fs /sbin/xfs_repair /usr/sbin/nvme /usr/sbin/parted /usr/sbin/xfs*" }}
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /modules/000-common/images/relocate/binary_replace.sh
  to: /binary_replace.sh
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd, gnu-glibc, util-linux, e2fsprogs, xfsprogs, btrfs-progs, nfs-utils, parted, nvme-cli, udev]
shell:
  install:
  - ln -sf /usr/bin/gawk /usr/bin/awk
  - bash /binary_replace.sh -i "{{ $csiBinaries }} /usr/bin/lsblk /usr/lib/libresolv.so.2 /usr/lib/udev/scsi_id" -o /relocate
