{{- $version := "v0.0.1-flant" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: common/distroless
imageSpec:
  config:
    entrypoint: ["/capz-controller-manager"]
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /capz-controller-manager
  to: /capz-controller-manager
  before: setup
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: common/src-artifact
git:
- url: {{ $.CLOUD_PROVIDERS_SOURCE_REPO }}/ovirt/go-ovirt
  tag: {{ $version }}
  add: /
  to: /src/go-ovirt
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/src
  to:  /src
  stageDependencies:
    install:
      - go.mod
      - go.sum
      - "**/*.go"
shell:
  install:
  - cd /src
  - echo "replace github.com/ovirt/go-ovirt => /src/go-ovirt" >> go.mod
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/golang" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  setup:
  - cd /src
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -o /capz-controller-manager cmd/main.go
  - chown 64535:64535 /capz-controller-manager
  - chmod 0700 /capz-controller-manager
