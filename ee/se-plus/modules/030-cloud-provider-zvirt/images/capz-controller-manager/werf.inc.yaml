{{- $version := "v0.0.1-flant" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
imageSpec:
  config:
    entrypoint: ["/capz-controller-manager"]
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /capz-controller-manager
  to: /capz-controller-manager
  before: setup
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ .CLOUD_PROVIDERS_SOURCE_REPO }}/ovirt/go-ovirt
  tag: {{ $version }}
  to: /src/go-ovirt
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/src
  to:  /src
  stageDependencies:
    install:
      - go.mod
      - go.sum
      - "**/*.go"
shell:
  install:
  - cd /src
  - echo "replace github.com/ovirt/go-ovirt => /src/go-ovirt" >> go.mod
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  setup:
  - cd /src
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -o /capz-controller-manager cmd/main.go
  - chown 64535:64535 /capz-controller-manager
  - chmod 0700 /capz-controller-manager
