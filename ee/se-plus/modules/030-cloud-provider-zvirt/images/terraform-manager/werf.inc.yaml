{{- $version := include "get_oss_version_by_id" (list "terraform-provider-ovirt" $) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: scratch
git:
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi
  to: /candi
  excludePaths:
  - '**/terraform_versions.yml'
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi/terraform_versions.yml
  to: /terraform-manager/terraform_versions.yml
import:
  - from: terraform-provider-ovirt
    add: /terraform-provider-ovirt
    to: /terraform-manager/terraform-provider-ovirt
    before: setup
{{ include "image_spec_for_infrastructure_manager" . }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ .SOURCE_REPO }}/oVirt/terraform-provider-ovirt.git
  tag: v{{ $version }}
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
packages:
- type: os-pm
  spec: [git, coreutils]
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - rm -rf .git
---
image: terraform-provider-ovirt
final: false
from: {{ index $.Images "builder/distroless" }}
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, bash, git, make, coreutils, binutils, sed, grep, findutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - export GOPROXY=off
  - cd /src
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 make build LDFLAGS="-s -w -extldflags \"-static\" -X main.version={{ $version }} -X main.commit=00000000"
  - mv /src/terraform-provider-ovirt /terraform-provider-ovirt
  - strip /terraform-provider-ovirt
  - chmod -R 755 /terraform-provider-ovirt
  - chown 64535:64535 /terraform-provider-ovirt
