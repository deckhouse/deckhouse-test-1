{{- $version := "v0.0.1-flant" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /discoverer
  to: /discoverer
  before: setup
imageSpec:
  config:
    entrypoint: ["/discoverer"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ .CLOUD_PROVIDERS_SOURCE_REPO }}/ovirt/go-ovirt
  tag: {{ $version }}
  to: /src/go-ovirt
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/src
  to:  /src
  excludePaths:
    - "**/*.md"
    - "**/*.yaml"
  stageDependencies:
    install:
      - go.mod
      - go.sum
      - "**/*.go"
- add: {{ .gitPrefix }}/go_lib/cloud-data
  to: /src/go_lib/cloud-data
  excludePaths:
    - "**/*.md"
    - "**/*.yaml"
  stageDependencies:
    install:
      - go.mod
      - go.sum
      - "**/*.go"
- add: {{ .gitPrefix }}/pkg/log
  to: /src/pkg/log
  excludePaths:
    - "**/*.md"
    - "**/*.yaml"
  stageDependencies:
    install:
      - go.mod
      - go.sum
      - "**/*.go"
packages:
- type: os-pm
  spec: [sed]
shell:
  install:
  - cd /src
  - sed -i -e 's# /deckhouse/go_lib/cloud-data# /src/go_lib/cloud-data#g' go.mod
  - sed -i -e 's# /deckhouse/pkg/log# /src/pkg/log#g' go.mod
  - printf "\nreplace github.com/ovirt/go-ovirt => /src/go-ovirt\n" >> go.mod
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  setup:
  - cd /src
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /discoverer
  - chown 64535:64535 /discoverer
  - chmod 0755 /discoverer
