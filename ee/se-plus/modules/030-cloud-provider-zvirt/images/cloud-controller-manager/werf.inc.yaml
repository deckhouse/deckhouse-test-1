{{- $version := "v0.0.1-flant" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
    add: /zvirt-cloud-controller-manager
    to: /zvirt-cloud-controller-manager
    before: setup
imageSpec:
  config:
    entrypoint: ["/zvirt-cloud-controller-manager"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
  - url: {{ .CLOUD_PROVIDERS_SOURCE_REPO }}/ovirt/go-ovirt
    tag: {{ $version }}
    to: /src/go-ovirt
    stageDependencies:
      install: ['**/*']
  - add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/src
    to:  /src
    excludePaths:
      - "**/*.md"
      - "**/*.yaml"
    stageDependencies:
      install:
        - go.mod
        - go.sum
        - "**/*.go"
shell:
  install:
    - cd /src
    - echo "replace github.com/ovirt/go-ovirt => /src/go-ovirt" >> go.mod
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  setup:
    - cd /src
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w " -o /zvirt-cloud-controller-manager cmd/zvirt-cloud-controller-manager/main.go
    - chown 64535:64535 /zvirt-cloud-controller-manager
    - chmod 0755 /zvirt-cloud-controller-manager
---
