---
{{- $istioVersion := include "get_oss_version_by_id" (list "istio-1-25" $ ) }}
{{- $istioImageVersion := (printf "v%s" (replace "." "x" $istioVersion)) }} {{- /* 1.25.2 -> v1x25x2 */}}
---
# Based on https://github.com/istio/istio/blob/1.25.2/operator/docker/Dockerfile.operator
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
  add: /src/operator/out/operator
  to: /usr/local/bin/operator
  owner: 64535
  group: 64535
  after: setup
- from: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio/manifests
  to: /var/lib/istio/manifests
  after: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/operator/resources
  to: /var/lib/sail-operator/resources
  after: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    user: "64535:64535"
    workingDir: "/"
    entrypoint: ["/usr/local/bin/operator"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang==1.26.8, git, binutils, bash, coreutils, sed, grep, findutils]
- type: go-mod
  workdir: /src/operator
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/operator
  to: /src/operator
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src/operator/
  - echo {{ $istioVersion }} > version
  - export GOPROXY=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - export LDFLAGS='-extldflags -static -s -w'
  - common/scripts/gobuild.sh /src/operator/out/ /src/operator/cmd/main.go
  - strip /src/operator/out/main
  - mv /src/operator/out/main /src/operator/out/operator
  - chmod 0700 /src/operator/out/operator
  - chown 64535:64535 /src/operator/out/operator
#=====================================================================================================
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [git]
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
- url: git@{{ .DECKHOUSE_PRIVATE_REPO }}:deckhouse/network/sail-operator.git
  tag: tag-{{ $istioVersion }}
  add: /
  to: /src/operator
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src/operator && git apply --verbose /patches/001-istio-go-mod.patch
  - cd /src/operator && git apply --verbose /patches/002-istio-operato-cni_status_restrict.patch
  - cd /src/operator && git apply --verbose /patches/003-istio-init-readonly-rootfs.patch
---
