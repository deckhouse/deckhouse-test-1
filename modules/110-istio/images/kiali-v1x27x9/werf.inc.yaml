---
{{- $istioVersion := include "get_oss_version_by_id" (list "istio-1-27" $ ) }}
{{- $istioImageVersion := (printf "v%s" (replace "." "x" $istioVersion)) }} {{- /* 1.27.9 -> v1x27x9 */}}
{{- $kialiVersion := printf "v%s" (include "get_oss_version_by_id" (list "kiali-for-istio-1-27" $ )) }}
---
# Based on https://github.com/kiali/kiali/blob/v2.12.0/deploy/docker/Dockerfile-distroless
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-backend-build-artifact
  add: /src/kiali/out/kiali
  to: /opt/kiali/kiali
  owner: 64535
  group: 64535
  before: install
{{- include "image mount points" . }}
imageSpec:
  config:
    user: "64535:64535"
    workingDir: "/opt/kiali"
    entrypoint: ["/opt/kiali/kiali"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-backend-build-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang==1.26.8, git, binutils, coreutils]
- type: go-mod
  workdir: /src/kiali
  env:
    GOPROXY: "%secret:GOPROXY%"
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/kiali
  to: /src/kiali
  before: install
- from: {{ .ModuleName }}/common-{{ $istioImageVersion }}-kiali-frontend-build-artifact
  add: /src/kiali/frontend/build
  to: /src/kiali/frontend/build
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src/kiali/
  # build
  - export GOPROXY=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - echo {{ $kialiVersion }} > version
  - export LDFLAGS='-extldflags -static -s -w -X main.version=${kialiVersion}'
  - go build -o /src/kiali/out/kiali /src/kiali/
  - strip /src/kiali/out/kiali
  - chmod 0755 /src/kiali/out/kiali
---
