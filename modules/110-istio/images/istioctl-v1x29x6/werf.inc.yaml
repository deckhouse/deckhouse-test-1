{{- if ne $.Env "CSE" }}
---
{{- $istioVersion := include "get_oss_version_by_id" (list "istio-1-29" $ ) }}
{{- $istioImageVersion := (printf "v%s" (replace "." "x" $istioVersion)) }} {{- /* 1.29.6 -> v1x29x6 */}}
# Based on https://github.com/istio/istio/blob/1.29.6/istioctl/docker/Dockerfile.istioctl
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [git]
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
import:
- from: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio
  to: /src/istio
  before: install
shell:
  install:
  - cd /src/istio/
  - git apply --verbose /patches/001-deckhouse-default-istio-namespace.patch
  - git apply --verbose /patches/002-deckhouse-default-istio-revision.patch
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang==1.26.8, git, binutils, bash, coreutils, sed, grep, findutils]
- type: go-mod
  workdir: /src/istio
  env:
    GOPROXY: "%secret:GOPROXY%"
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/istio
  to: /src/istio
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src/istio/
  - echo {{ $istioVersion }} > version
  - export VERSION={{ $istioVersion }}
  - export BUILDINFO=$(mktemp)
  - |
    cat > "${BUILDINFO}" <<EOF
    istio.io/istio/pkg/version.buildVersion={{ $istioVersion }}
    istio.io/istio/pkg/version.buildGitRevision={{ $istioVersion }}
    istio.io/istio/pkg/version.buildStatus=Clean
    istio.io/istio/pkg/version.buildTag={{ $istioVersion }}
    istio.io/istio/pkg/version.buildHub=docker.io/istio
    istio.io/istio/pkg/version.buildOS=linux
    istio.io/istio/pkg/version.buildArch=amd64
    EOF
  - export GOPROXY=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - export LDFLAGS='-extldflags -static -s -w'
  - common/scripts/gobuild.sh /src/istio/out/ -tags=disable_pgv /src/istio/istioctl/cmd/istioctl/
  - strip /src/istio/out/istioctl
  - chmod 0700 /src/istio/out/istioctl
  - chown 1337:1337 /src/istio/out/istioctl
{{- end }}
