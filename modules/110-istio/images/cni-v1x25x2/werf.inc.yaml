---
{{- $istioVersion := include "get_oss_version_by_id" (list "istio-1-25" $ ) }}
{{- $istioImageVersion := (printf "v%s" (replace "." "x" $istioVersion)) }} {{- /* 1.25.2 -> v1x25x2 */}}
{{- $iptables_version := "1.8.9" }}
{{- $iptables_image_version := $iptables_version | replace "." "-" }}
---
# Based on https://github.com/istio/istio/blob/1.25.2/cni/deployments/kubernetes/Dockerfile.install-cni
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
  add: /src/istio/out/istio-cni
  to: /opt/cni/bin/istio-cni
  owner: 64535
  group: 64535
  after: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
  add: /src/istio/out/install-cni
  to: /usr/local/bin/install-cni
  owner: 64535
  group: 64535
  after: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: setup
- from: registrypackages/iptables-artifact-{{ $iptables_image_version }}
  add: /
  to: /usr/bin
  includePaths:
  - xtables-legacy-multi
  - xtables-nft-multi
  before: setup
- from: common/iptables-wrapper
  add: /iptables-wrapper
  to: /usr/bin/iptables-wrapper
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    user: "64535:64535"
    env: {"PATH": "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/cni/bin"}
    workingDir: "/opt/cni/bin"
    entrypoint: ["/usr/local/bin/install-cni"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang==1.26.8, git, binutils, bash, coreutils, sed, grep, findutils]
- type: go-mod
  workdir: /src/istio
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio
  to: /src/istio
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src/istio/
  - echo {{ $istioVersion }} > version
  - export VERSION={{ $istioVersion }}
  - export BUILDINFO=$(mktemp)
  - |
    cat > "${BUILDINFO}" <<EOF
    istio.io/istio/pkg/version.buildVersion={{ $istioVersion }}
    istio.io/istio/pkg/version.buildGitRevision={{ $istioVersion }}
    istio.io/istio/pkg/version.buildStatus=Clean
    istio.io/istio/pkg/version.buildTag={{ $istioVersion }}
    istio.io/istio/pkg/version.buildHub=docker.io/istio
    istio.io/istio/pkg/version.buildOS=linux
    istio.io/istio/pkg/version.buildArch=amd64
    EOF
  - export GOPROXY=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - export LDFLAGS='-extldflags -static -s -w'
  - common/scripts/gobuild.sh /src/istio/out/ -tags=agent,disable_pgv /src/istio/cni/cmd/install-cni/
  - common/scripts/gobuild.sh /src/istio/out/ -tags=agent,disable_pgv /src/istio/cni/cmd/istio-cni/
  - strip /src/istio/out/install-cni
  - strip /src/istio/out/istio-cni
  - chmod 0700 /src/istio/out/install-cni /src/istio/out/istio-cni
  - chown 64535:64535 /src/istio/out/istio-cni
---
image: {{ .ModuleName }}/{{ .ImageName }}-binaries-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [coreutils]
shell:
  install:
  - mkdir -p /relocate/usr/bin
  - |
    for cmd in iptables iptables-save iptables-restore ip6tables ip6tables-save ip6tables-restore; do
      ln -f -s /usr/bin/iptables-wrapper "/relocate/usr/bin/${cmd}"
    done
    # broken symlinks are not imported from the artifact
    touch /usr/bin/iptables-wrapper
  - |
    for mode in legacy nft; do
      for basecmd in iptables ip6tables; do
        for cmd in ${basecmd}-${mode} ${basecmd}-${mode}-save ${basecmd}-${mode}-restore; do
          ln -sf /usr/bin/xtables-${mode}-multi "/relocate/usr/bin/${cmd}"
        done
      done
    done
