{{- if ne $.Env "CSE" }}
---
{{- $istioVersion := include "get_oss_version_by_id" (list "istio-1-29" $ ) }}
{{- $istioImageVersion := (printf "v%s" (replace "." "x" $istioVersion)) }} {{- /* 1.29.6 -> v1x29x6 */}}
---
# Based on https://github.com/istio/istio/blob/1.29.6/pilot/docker/Dockerfile.pilot
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
  add: /src/istio/out/pilot-discovery
  to: /usr/local/bin/pilot-discovery
  owner: 64535
  group: 64535
  after: setup
- from: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio/tools/packaging/common/envoy_bootstrap.json
  to: /var/lib/istio/envoy/envoy_bootstrap_tmpl.json
  owner: 64535
  group: 64535
  after: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    user: "64535:64535"
    entrypoint: ["/usr/local/bin/pilot-discovery"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-build-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang==1.26.8, git, binutils, bash, coreutils, sed, grep, findutils]
- type: go-mod
  workdir: /src/istio
  env:
    GOPROXY: "%secret:GOPROXY%"
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/common-{{ $istioImageVersion }}-src-artifact
  add: /src/istio
  to: /src/istio
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  setup:
  - cd /src/istio/
  - echo {{ $istioVersion }} > version
  - export VERSION={{ $istioVersion }}
  - export BUILDINFO=$(mktemp)
  - |
    cat > "${BUILDINFO}" <<EOF
    istio.io/istio/pkg/version.buildVersion={{ $istioVersion }}
    istio.io/istio/pkg/version.buildGitRevision={{ $istioVersion }}
    istio.io/istio/pkg/version.buildStatus=Clean
    istio.io/istio/pkg/version.buildTag={{ $istioVersion }}
    istio.io/istio/pkg/version.buildHub=docker.io/istio
    istio.io/istio/pkg/version.buildOS=linux
    istio.io/istio/pkg/version.buildArch=amd64
    EOF
  - export GOPROXY=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - export LDFLAGS='-extldflags -static -s -w'
  - common/scripts/gobuild.sh /src/istio/out/ -tags=disable_pgv /src/istio/pilot/cmd/pilot-discovery/
  - strip /src/istio/out/pilot-discovery
  - chmod 0700 /src/istio/out/pilot-discovery
  - chown 64535:64535 /src/istio/out/pilot-discovery
---
{{- end }}
