{{- $version := include "get_oss_version_by_id" (list "terraform-provider-aws" $) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: scratch
git:
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi
  to: /candi
  excludePaths:
  - '**/terraform_versions.yml'
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi/terraform_versions.yml
  to: /terraform-manager/terraform_versions.yml
import:
- from: terraform-provider-aws
  add: /terraform-provider-aws
  to: /terraform-manager/terraform-provider-aws
  before: setup
{{ include "image_spec_for_infrastructure_manager" . }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [git, coreutils]
git:
- url: {{ .SOURCE_REPO }}/hashicorp/terraform-provider-aws.git
  tag: v{{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
---
image: terraform-provider-aws
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang, git, bash, coreutils, make, binutils, findutils, grep, sed]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GOPROXY=off
  - cd /src
  - make fmt
  - GO_VER=go CGO_ENABLED=0 GOOS=linux GOARCH=amd64 make build LDFLAGS="-s -w -extldflags \"-static\" -X github.com/hashicorp/terraform-provider-aws/version.ProviderVersion={{ $version }}"
  - mv "$(go env GOPATH)/bin/terraform-provider-aws" /terraform-provider-aws
  - strip /terraform-provider-aws
  - chmod -R 755 /terraform-provider-aws
  - chown 64535:64535 /terraform-provider-aws
---
