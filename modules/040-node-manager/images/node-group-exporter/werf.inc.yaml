---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/040-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ .ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  setup:
  - cd /src
  - GOPROXY=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o node-group-exporter ./cmd/main.go
  - chown 64535:64535 /src/node-group-exporter
  - chmod 0700 /src/node-group-exporter
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /src/node-group-exporter
  to: /node-group-exporter
  before: setup
imageSpec:
  config:
    entrypoint: ["/node-group-exporter"]
