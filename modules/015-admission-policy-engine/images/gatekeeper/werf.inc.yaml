{{ $gatekeeperVersion := include "get_oss_version_by_id" (list "gatekeeper" $ ) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /gatekeeper
  to: /usr/bin/gatekeeper
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    user: "64535:64535"
    entrypoint: [ "/bin/gatekeeper" ]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [git, coreutils, diffutils]
git:
- url: {{ .SOURCE_REPO }}/open-policy-agent/gatekeeper.git
  tag: v{{ $gatekeeperVersion }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/015-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
- add: /{{ $.ModulePath }}modules/015-{{ $.ModuleName }}/crds
  to: /module_crds
  includePaths:
  - gatekeeper/*.yaml
  stageDependencies:
    install:
    - '**/*'    
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose --allow-empty
  - rm -rf website
  # check if module crds/gatekeeper are the same as gatekeeper crds
  - | 
    echo "Checking if module crds/gatekeeper are the same as gatekeeper crds"
    diff -qr "/src/charts/gatekeeper/crds" "/module_crds/gatekeeper" 
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang==1.26.8, git, bash, coreutils, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - GOPROXY=off go mod vendor
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - |
    {{- include "image-build.build" (set $ "BuildCommand" `go build -mod vendor -ldflags="-s -w" -o /gatekeeper .`) | indent 6 }}
  - chown 64535:64535 /gatekeeper
  - chmod 0700 /gatekeeper
---
