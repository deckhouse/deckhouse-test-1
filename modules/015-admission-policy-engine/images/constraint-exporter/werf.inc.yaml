---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
  - from: common/distroless-artifact
    add: /relocate
    to: /
    before: install
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
    add: /constraint_exporter
    to: /constraint_exporter
    before: setup
imageSpec:
  config:
    user: "64535:64535"
    entrypoint: [ "/constraint_exporter" ]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/015-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang==1.26.8, git, bash, coreutils, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GOPROXY=off
  - cd /src
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - |
    {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags="-s -w" -o /constraint_exporter`) | indent 4 }}
  - chown 64535:64535 /constraint_exporter
  - chmod 0700 /constraint_exporter
