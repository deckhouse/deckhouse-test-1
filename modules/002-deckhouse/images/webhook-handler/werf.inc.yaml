---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: common/shell-operator
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
  add: /usr/bin/yq
  to: /usr/bin/yq
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
  add: /usr/bin/semver
  to: /usr/bin/semver
  before: install
- from: common/promtool-artifact
  add: /promtool
  to: /usr/local/bin/promtool
  before: setup
- from: {{ $.ModuleName }}/{{ .ImageName }}-label-converter-artifact
  add: /label-converter
  to: /usr/local/bin/label-converter
  before: setup
- from: {{ $.ModuleName }}/{{ .ImageName }}-webhook-operator-artifact
  add: /webhook-operator
  to: /
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-wheel-artifact
  add: /relocate
  to: /
  before: install
{{- include "image mount points" . }}
git:
- add: /{{ .ModulePath }}
  to: /available_hooks
  includePaths:
  - 'modules/*/webhooks/'
  - 'ee/modules/*/webhooks/'
  - 'ee/se/modules/*/webhooks'
# - 'ee/fe/modules/*/webhooks/'
  excludePaths:
    - '**/*_test*.py'
  stageDependencies:
    install:
      - '**/*'
- add: /{{ .ModulePath }}modules/002-deckhouse/images/webhook-handler/src/entrypoint.sh
  to: /entrypoint.sh
  stageDependencies:
    install:
      - '**/*'
- add: /{{ .ModulePath }}shell_lib/semver.sh
  to: /{{ .ModulePath }}frameworks/shell/semver.sh
  stageDependencies:
    install:
      - '**/*'
- add: /{{ .ModulePath }}python_lib
  to: /frameworks/python
  stageDependencies:
    install:
      - '**/*'
- add: /{{ .ModulePath }}modules/002-deckhouse/images/webhook-handler/operator/internal/controller/templates
  to: /internal/controller/templates
  stageDependencies:
    install:
      - '**/*'
shell:
  install:
  - set -e
imageSpec:
  config:
    env: {"PYTHONPATH": "/frameworks/python"}
    entrypoint: ["/entrypoint.sh"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-label-converter-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/src/label-converter
  to: /src
  includePaths:
  - '**/*.go'
  - '**/go.mod'
  - '**/go.sum'
---
image: {{ .ModuleName }}/{{ .ImageName }}-label-converter-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang==1.26.8, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-label-converter-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - export GOPROXY=off
    - cd /src
    - CGO_ENABLED=0 GOOS=linux go build -ldflags '-s -w -extldflags "-static"' -o /label-converter label_converter.go
    - chown 64535:64535 /label-converter
    - chmod 755 /label-converter
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-wheel-artifact
from: common-base-python-packages
final: false
packages:
- type: os-pm
  spec: [bash, findutils, gawk, ldd]
- type: python-pip
  workdir: /
  env:
    PIP_NO_INDEX: "1"
    PIP_FIND_LINKS: file:///wheels
git:
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src/requirements.txt
  to: /requirements.txt
  stageDependencies:
    packages:
    - '**/*'
- add: /modules/002-deckhouse/images/init/relocate.sh
  to: /relocate.sh
  stageDependencies:
    install: ['**/*']
import:
- from: common/wheel-artifact
  add: /wheels
  to: /wheels
  before: install
shell:
  install:
  - bash /relocate.sh /relocate /usr/bin/python3*
  - mkdir -p /relocate/usr/lib
  - cp -a /usr/lib/python3* /relocate/usr/lib/
  - find /usr/lib/python3* -name '*.so' -exec bash /relocate.sh /relocate {} +
---
image: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [yq, semver]
---
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-webhook-operator-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang==1.26.8, git, coreutils]
- type: go-mod
  workdir: /operator
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-webhook-operator-src-artifact
    add: /src
    to: /operator
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - cd /operator
    - export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
    - export GOPROXY=off
    - go build -o /webhook-operator ./cmd/main.go
    - chown 64535:64535 /webhook-operator
    - chmod 0700 /webhook-operator
---
image: {{ .ModuleName }}/{{ .ImageName }}-webhook-operator-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/operator
  to: /src
  includePaths:
  - '**/*.go'
  - '**/*.mod'
  - '**/*.sum'
