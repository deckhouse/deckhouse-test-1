---
image: {{ .ModuleName }}/{{ .ImageName }}-entrypoint-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/entrypoint
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GOPROXY=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd /src
  - go build -ldflags="-s -w" -o /entrypoint main.go
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang, git, bash, coreutils, make, linux-headers, binutils, gnu-gcc, grep, sed, findutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/flannel
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GO_VERSION=${GOLANG_VERSION}
  - export GOPROXY=off
  - cd /src
  - make dist/flanneld
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [git]
git:
- url: {{ .SOURCE_REPO }}/flannel-io/flannel.git
  tag: v{{ include "get_oss_version_by_id" (list "flannel" $ ) }}
  add: /
  to: /src/flannel
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/035-{{ .ModuleName }}/images/flanneld/entrypoint
  to: /src/entrypoint
  stageDependencies:
    install:
    - '**/*'
- add: /{{ .ModulePath }}modules/035-{{ .ModuleName }}/images/flanneld/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src/flannel
  - git apply /patches/*.patch --verbose
---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /src/dist/flanneld
  to: /opt/bin/flanneld
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-entrypoint-artifact
  add: /entrypoint
  to: /entrypoint
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/entrypoint"]
---
