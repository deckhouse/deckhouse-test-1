{{- define "alt archive repos" }}
{{- $date := "2026-02-07" }}
- sed -i -E "s|http://ftp.altlinux.org/pub/distributions/archive/p11/date/[0-9]{4}/[0-9]{2}/[0-9]{2}/|http://ftp.altlinux.org/pub/distributions/archive/p11/date/{{ $date | replace "-" "/" }}/|g" /etc/apt/sources.list.d/alt.list
{{- end }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, git, ssh-static]
shell:
  install:
  - mkdir -p /root/.ssh
  # ssh auth to 3p repos
  - echo "StrictHostKeyChecking accept-new" > ~/.ssh/config
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
final: false
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: setup
imageSpec:
  config:
    user: "64535:64535"
