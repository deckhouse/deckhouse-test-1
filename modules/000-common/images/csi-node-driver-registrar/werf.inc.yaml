# Based on https://github.com/kubernetes-csi/node-driver-registrar/blob/master/Dockerfile
{{- range $key, $value := .CandiVersionMap.k8s }}
  {{- $version := toString $key }}
  {{- if $value.csi.registrar }}
    {{- $src_version := toString $value.csi.registrar }}
    {{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
    {{- $patch := false }}
    {{- range $path, $_ := $.Files.Glob (printf "%s/*" $patches) }}
      {{- if contains $src_version $path }}
        {{- $patch = true }}
      {{- end }}
    {{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $version | replace "." "-" }}
from: {{ index $.Images "base/distroless" }}
vex: {{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/known_vulnerabilities.vex
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $version | replace "." "-" }}
  add: /csi-node-driver-registrar
  to: /csi-node-driver-registrar
  before: setup
{{- include "image mount points" $ }}
imageSpec:
  config:
    user: "64535:64535"
    entrypoint: ["/csi-node-driver-registrar"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $version | replace "." "-" }}
from: common/src-artifact
final: false
git:
- url: {{ $.SOURCE_REPO }}/kubernetes-csi/node-driver-registrar.git
  tag: {{ $src_version }}
  add: /
  to: /src
    {{- if $patch }}
- add: {{ $patches }}/patches/{{ $src_version }}
  to: /patches
  stageDependencies:
    install:
    - '**/*'
    {{- end }}
shell:
  install:
  - cd /src
  {{- if $patch }}
  - git apply /patches/*.patch --verbose
  {{- end }}
  - rm -rf vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $version | replace "." "-" }}
from: {{ index $.Images "builder/distroless" }}
final: false
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $version | replace "." "-" }}
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, make, bash, coreutils, grep, sed, findutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - export GO_VERSION=${GOLANG_VERSION} CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - cd /src
  - export GOPROXY=off
  - go mod vendor
  - make build REV={{ $src_version }}
  - cp bin/csi-node-driver-registrar /csi-node-driver-registrar
  - chown 64535:64535 /csi-node-driver-registrar
  - chmod 0755 /csi-node-driver-registrar
  {{- end }}
{{- end }}
