{{- $binaries := "/usr/bin/bash /usr/bin/chown /usr/bin/chmod /usr/bin/ls /usr/bin/cp /usr/bin/rm /usr/bin/mkdir /usr/bin/ncat /usr/bin/sleep /usr/bin/true" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /relocate
  to: /
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    user: "64535:64535"
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: common/relocate-artifact
final: false
packages:
- type: os-pm
  spec: [ncat]
shell:
  install:
  - /binary_replace.sh -i "{{ $binaries }}" -o /relocate
  - ln -s bash /relocate/usr/bin/sh
  - ln -s ncat /relocate/usr/bin/nc
