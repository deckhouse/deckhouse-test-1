---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
- url: {{ .SOURCE_REPO }}/redis/redis.git
  tag: 7.4.0
  add: /
  to: /src
shell:
  install:
  - rm -r /src/utils/req-res-validator/requirements.txt
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [gnu-gcc, binutils, gnu-glibc-devel, libgcc-static, make, bash, coreutils, grep, sed, findutils, gawk]
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  install:
  - cd /src
  # disable Redis protected mode [1] as it is unnecessary in context of Docker
  # (ports are not automatically exposed when running inside Docker, but rather explicitly by specifying -p / -P)
  # [1]: https://github.com/redis/redis/commit/edd4d555df57dc84265fdfb4ef59a4678832f6da
  - grep -E '^ *createBoolConfig[(]"protected-mode",.*, *1 *,.*[)],$' src/config.c
  - sed -ri 's!^( *createBoolConfig[(]"protected-mode",.*, *)1( *,.*[)],)$!\10\2!' src/config.c
  - grep -E '^ *createBoolConfig[(]"protected-mode",.*, *0 *,.*[)],$' src/config.c
  - make CFLAGS="-static" LDFLAGS="-static"
  - chown 64535:64535 /src/src/redis-server
  - chmod 0700 /src/src/redis-server
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: setup
- from: {{ $.ModuleName }}/{{ .ImageName }}-artifact
  add: /src/src/redis-server
  to: /redis-server
  before: setup
imageSpec:
  config:
    user: "64535:64535"
    entrypoint: ["/redis-server"]
