---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
final: false
import:
  - from: {{ .ModuleName }}/{{ .ImageName }}-artifact
    add: /relocate
    to: /
    before: setup
imageSpec:
  config:
    user: "64535:64535"
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [ca-certificates, tzdata, coreutils, bash, grep]
shell:
  install:
  - mkdir -p /relocate/etc /relocate/usr/share /relocate/tmp
  - chmod 1777 /relocate/tmp
  - cp -p /etc/passwd /etc/group /relocate/etc
  - if [ -f /etc/shadow ]; then cp -p /etc/shadow /relocate/etc; else touch /relocate/etc/shadow; chmod 0600 /relocate/etc/shadow; fi
  - cp -pr /usr/share/zoneinfo /relocate/usr/share
  - cp -pr /etc/ssl /relocate/etc
  - 'grep -q "^deckhouse:" /relocate/etc/passwd || echo "deckhouse:x:64535:64535:deckhouse:/:/sbin/nologin" >> /relocate/etc/passwd'
  - 'grep -q "^deckhouse:" /relocate/etc/group || echo "deckhouse:x:64535:" >> /relocate/etc/group'
  - 'grep -q "^deckhouse:" /relocate/etc/shadow || echo "deckhouse:!::0:::::" >> /relocate/etc/shadow'
  - 'grep -q "^deckhouse:[^:]*:64535:64535:" /relocate/etc/passwd'
  - 'grep -q "^deckhouse:[^:]*:64535:" /relocate/etc/group'
