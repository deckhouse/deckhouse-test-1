---
image: {{ .ModuleName }}/{{ .ImageName }}
from: scratch
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /crane
  to: /crane
  before: install
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- url: {{ .SOURCE_REPO }}/google/go-containerregistry.git
  tag: v0.20.3
  add: /
  to: /go-containerregistry
  stageDependencies:
    packages: [go.mod, go.sum]
    install: ['**/*']
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils, bash]
- type: go-mod
  workdir: /go-containerregistry
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /go-containerregistry/cmd/crane
  - export GOPROXY=off
  - CGO_ENABLED=0 GOOS=linux go build  -ldflags '-s -w -X github.com/google/go-containerregistry/cmd/crane/cmd.Version=v0.20.3' -o /crane
  - rm -rf /go-containerregistry
