{{- $iptables_version := "1.8.9" }}
{{- $iptables_image_version := $iptables_version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils]
import:
- from: registrypackages/iptables-artifact-{{ $iptables_image_version }}
  add: /
  to: /usr/bin
  includePaths:
  - xtables-legacy-multi
  - xtables-nft-multi
  before: install
shell:
  install:
  - cd /usr/bin
  - |
    for mode in legacy nft; do
      for base in iptables ip6tables; do
        for cmd in ${base}-${mode} ${base}-${mode}-save ${base}-${mode}-restore; do
          ln -sf xtables-${mode}-multi "${cmd}"
        done
      done
    done
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: common/relocate-artifact
git:
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src/istioctl
  to: /out/usr/bin/istioctl
  stageDependencies:
    install:
    - '**/*'
packages:
- type: os-pm
  spec: [curl, bash, jq, yq, sed, grep, gawk, procps, iproute2, findutils, coreutils, openssl, vim, less, ethtool, pwru, gnu-glibc-locale, util-linux, ncurses]
shell:
  install:
  - |
    for binary in /usr/bin/* /usr/sbin/*; do
      [ -f "${binary}" ] && [ -x "${binary}" ] || continue
      case "$(readlink -f "${binary}")" in */busybox|*/pm) continue ;; esac
      /binary_replace.sh -i "${binary}" -o /out
    done
  - mkdir -p /out/usr/lib /out/usr/share /out/etc
  - cp -a /usr/lib/. /out/usr/lib/
  - cp -a /usr/share/. /out/usr/share/
  - cp -a /etc/ssl /out/etc/
  - for directory in /etc/iproute2 /etc/vim; do if [ -d "${directory}" ]; then cp -a "${directory}" /out/etc/; fi; done
  - ln -sf bash /out/usr/bin/sh
  - chmod 0755 /out/usr/bin/istioctl
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
vex: {{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/known_vulnerabilities.vex
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /out
  to: /
  before: install
- from: istio/istioctl-v1x25x2-build-artifact
  add: /src/istio/out/istioctl
  to: /usr/bin/istioctl-1.25
  before: install
{{- if ne $.Env "CSE" }}
- from: istio/istioctl-v1x27x9-build-artifact
  add: /src/istio/out/istioctl
  to: /usr/bin/istioctl-1.27
  before: install
- from: istio/istioctl-v1x29x6-build-artifact
  add: /src/istio/out/istioctl
  to: /usr/bin/istioctl-1.29
  before: install
{{- end }}
- from: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /usr/bin
  to: /usr/bin
  includePaths:
  - xtables-legacy-multi
  - xtables-nft-multi
  - iptables-*
  - ip6tables-*
  before: install
imageSpec:
  config:
    env:
      "LANG": "C.UTF-8"
      "LANGUAGE": "C.UTF-8"
      "LC_ALL": "C.UTF-8"
      "CRYPTOGRAPHY_OPENSSL_NO_LEGACY": "true"
      "EDITOR": "/usr/bin/vim"
      "KUBE_EDITOR": "/usr/bin/vim"
      "PS1": '\\[\\033[01;30m\\][debug]\\[\\033[00m\\] \\[\\033[01;33m\\]\\u@\\h\\[\\033[01;34m\\] \\w \\$\\[\\033[00m\\] '
    workingDir: "/"
    user: "root:root"
    cmd: ["/bin/bash"]
