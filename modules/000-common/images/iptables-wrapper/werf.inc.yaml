---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
final: false
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /src/iptables-wrapper
  to: /iptables-wrapper
  before: setup
imageSpec:
  config:
    user: "64535:64535"
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
from: common/src-artifact
final: false
git:
- url: {{ .SOURCE_REPO }}/kubernetes-sigs/iptables-wrappers.git
  commit: 680003b3c6e93b471a59ecc9ae87a8f9054b82f3
  add: /
  to: /src
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, bash, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - cd /src
  - GOPROXY=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o iptables-wrapper main.go
  - chown 64535:64535 iptables-wrapper
  - chmod 0755 iptables-wrapper
