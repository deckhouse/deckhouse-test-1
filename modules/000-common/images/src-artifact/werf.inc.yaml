---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [git, coreutils, bash, patch, sed, findutils]
shell:
  install:
  - mkdir -p /src /root
  # turn the detached message off
  - git config --global advice.detachedHead false
