# #####################################################################
# Build gops binaries
# Based on https://github.com/cilium/cilium/blob/v1.17.4/images/runtime/Dockerfile (gops-cni-builder stage)
# and https://github.com/cilium/cilium/blob/v1.17.4/images/runtime/build-gops.sh
# #####################################################################
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [git, coreutils]
final: false
git:
- url: {{ .SOURCE_REPO }}/google/gops.git
  tag: v{{ include "get_oss_version_by_id" (list "gops" $ ) }}
  add: /
  to: /src/gops
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src/gops
  - ls /patches/*.patch >/dev/null 2>&1 && git apply --verbose --allow-empty /patches/*.patch
  - rm -rf /src/gops/.git
---
image: {{ .ModuleName }}/gops-artifact
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang, git, coreutils, bash, binutils, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src/gops
  env:
    GOPROXY: "%secret:GOPROXY%"
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GO_VERSION=${GOLANG_VERSION} GOPROXY=off
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd /src/gops
  - mkdir -p "/out/linux/amd64/bin"
  - |
    {{- $buildContext := deepCopy $ -}}
    {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
    {{- $_ := set $buildContext "BuildCommand" `go build -ldflags "-s -w" -o "/out/linux/amd64/bin/gops" github.com/google/gops` -}}
    {{- include "image-build.build" $buildContext | indent 4 }}
  - strip /out/linux/amd64/bin/gops
---
