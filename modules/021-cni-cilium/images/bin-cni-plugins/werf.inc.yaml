{{- $cniVersion := include "get_oss_version_by_id" (list "cni-plugins" $ )  -}}
---
# #####################################################################
# Build cni binaries
# Based on https://github.com/cilium/cilium/blob/v1.17.4/images/runtime/Dockerfile (gops-cni-builder stage)
# and https://github.com/cilium/cilium/blob/v1.17.4/images/runtime/download-cni.sh
# and https://github.com/cilium/cilium/blob/v1.17.4/images/runtime/cni-version.sh
# #####################################################################
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [git, coreutils]
final: false
git:
- url: {{ .SOURCE_REPO }}/containernetworking/plugins.git
  tag: v{{ $cniVersion }}
  add: /
  to: /src/plugins
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src/plugins
  - ls /patches/*.patch >/dev/null 2>&1 && git apply --verbose --allow-empty /patches/*.patch
  - rm -rf /src/plugins/.git
---
image: {{ .ModuleName }}/cni-plugins-artifact
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang, git, coreutils, bash, binutils, tar, findutils, sed, grep, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src/plugins
  env:
    GOPROXY: "%secret:GOPROXY%"
final: false
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - export GO_VERSION=${GOLANG_VERSION} GOPROXY=off
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
  - cd /src/plugins
  - go mod vendor && go mod verify
  - export FLAGS='-extldflags -static -X github.com/containernetworking/plugins/pkg/utils/buildversion.BuildVersion={{ $cniVersion }}'
  - |
    {{- $buildContext := deepCopy $ -}}
    {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
    {{- $_ := set $buildContext "BuildCommand" `./build_linux.sh -ldflags "${FLAGS}"` -}}
    {{- include "image-build.build" $buildContext | indent 4 }}
  - mkdir -p /out/linux/amd64/bin
  - cp -f /src/plugins/bin/* /out/linux/amd64/bin
  - strip /out/linux/amd64/bin/*
  - rm -rf /src/plugins/vendor
---
