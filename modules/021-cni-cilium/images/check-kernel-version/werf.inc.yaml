---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/check-kernel-version
  add: /check-kernel-version
  to: /check-kernel-version
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-relocate-artifact
  add: /relocate
  to: /
  before: setup
- from: common/pause
  add: /pause
  to: /pause
  before: install
imageSpec:
  config:
    entrypoint: [ "/check-kernel-version" ]
---
{{- $binaries := "/usr/bin/true" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-relocate-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd]
git:
- add: /modules/030-cloud-provider-aws/images/ebs-csi-plugin/relocate.sh
  to: /relocate.sh
  stageDependencies:
    setup: ['**/*']
shell:
 setup:
   - bash /relocate.sh /relocate {{ $binaries }}
