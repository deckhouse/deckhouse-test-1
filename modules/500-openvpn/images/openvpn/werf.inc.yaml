{{- $binaries := "/usr/sbin/conntrack /usr/bin/mknod" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
imageSpec:
  config:
    user: "64535:64535"
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /src/openvpn/src/openvpn/openvpn
  to: /usr/sbin/openvpn
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-entrypoint-artifact
  add: /src/entrypoint
  to: /entrypoint
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: setup
{{- include "image mount points" . }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/entrypoint
  to: /src/entrypoint
  includePaths:
  - '**/*.go'
  - '**/*.mod'
  - '**/*.sum'
- url: {{ .SOURCE_REPO }}/openssl/openssl.git
  tag: openssl-{{ include "get_oss_version_by_id" (list "openssl" $ ) }}
  add: /
  to: /src/openssl
- url: {{ .SOURCE_REPO }}/stevegrubb/libcap-ng.git
  tag: v{{ include "get_oss_version_by_id" (list "libcapng" $ ) }}
  add: /
  to: /src/libcap-ng
- url: {{ .SOURCE_REPO }}/OpenVPN/openvpn.git
  tag: v{{ include "get_oss_version_by_id" (list "openvpn" $ ) }}
  add: /
  to: /src/openvpn
---
image: {{ .ModuleName }}/{{ .ImageName }}-entrypoint-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang==1.26.8, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/entrypoint
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - export GOPROXY=off
  - go build -ldflags '-s -w' .
  - chown -R 64535:64535 /src
  - chmod 0755 /src/entrypoint
---
image: {{ .ModuleName }}/openssl-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [autoconf, automake, make, libtool, gnu-gcc, binutils, gnu-glibc-devel, linux-headers, perl, bash, coreutils, sed, grep, gawk]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/openssl
  to: /src
  before: install
shell:
  install:
  - cd /src/
  - ./Configure gcc -static -no-shared
  - make -j4
  - make install_sw DESTDIR=/openssl
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [autoconf, automake, make, libtool, gnu-gcc, binutils, gnu-glibc-devel, linux-headers, pkgconf, perl, bash, coreutils, sed, grep, gawk]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
- from: {{ .ModuleName }}/openssl-artifact
  add: /openssl
  to: /
  before: install
shell:
  install:
  - cd /src/libcap-ng
  - ./autogen.sh
  - ./configure --enable-static
  - make
  - make install
  - cd /src/openvpn
  - autoreconf -vi
  - ./configure --enable-static --disable-shared --disable-debug --disable-unit-tests --disable-lzo --disable-lz4 --disable-plugin-auth-pam --disable-plugin-down-root --disable-dco
  - make LIBS="-all-static -lcap-ng"
---
image: {{ .ModuleName }}/{{ .ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [conntrack-tools, coreutils, bash, gawk, ldd]
git:
- add: /modules/002-deckhouse/images/init/relocate.sh
  to: /relocate.sh
  stageDependencies:
    install: ['**/*']
shell:
  install:
  - bash /relocate.sh /relocate {{ $binaries }}
