---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /relocate
  to: /
  before: setup
imageSpec:
  config:
    user: "64535:64535"
    entrypoint: ["/usr/sbin/pmacctd"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ .SOURCE_REPO }}/pmacct/pmacct.git
  tag: 1.7.9
  add: /
  to: /src
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [gnu-gcc, binutils, gnu-glibc-devel, make, autoconf, automake, libtool, pkgconf, libpcap-pwru-devel, jansson-devel, bash, coreutils, sed, grep, gawk, ldd]
git:
- add: /modules/002-deckhouse/images/init/relocate.sh
  to: /relocate.sh
  stageDependencies:
    install: ['**/*']
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  install:
  - cd /src
  - ./autogen.sh
  - ./configure --prefix=/usr --enable-jansson
  - make
  - make install
  - bash /relocate.sh /relocate /usr/sbin/pmacctd
