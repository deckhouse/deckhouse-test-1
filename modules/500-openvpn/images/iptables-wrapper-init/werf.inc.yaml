{{- $iptables_version := "1.8.9" }}
{{- $iptables_image_version := $iptables_version | replace "." "-" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
imageSpec:
  config:
    user: "64535:64535"
fromCacheVersion: "2025-09-16"
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
  add: /relocate
  to: /
  before: setup
- from: common/iptables-wrapper
  add: /iptables-wrapper
  to: /iptables-wrapper
  before: setup
- from: registrypackages/iptables-artifact-{{ $iptables_image_version }}
  add: /
  to: /_sbin
  includePaths:
  - xtables-legacy-multi
  - xtables-nft-multi
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-relocate-artifact
  add: /relocate
  to: /relocate
  before: setup
{{- include "image mount points" . }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-relocate-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [coreutils]
shell:
  install:
  - mkdir -p /relocate/sbin
  - |
    for cmd in iptables iptables-save iptables-restore ip6tables ip6tables-save ip6tables-restore; do
      ln -f -s /sbin/iptables-wrapper "/relocate/sbin/${cmd}"
    done
    # broken symlinks are not imported from the artifact
    touch /iptables-wrapper
  - |
    for mode in legacy nft; do
      for basecmd in iptables ip6tables; do
        for cmd in ${basecmd}-${mode} ${basecmd}-${mode}-save ${basecmd}-${mode}-restore; do
          ln -sf /sbin/xtables-${mode}-multi "/relocate/sbin/${cmd}"
        done
      done
    done
---
image: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd]
git:
- add: /modules/002-deckhouse/images/init/relocate.sh
  to: /relocate.sh
  stageDependencies:
    install: ['**/*']
shell:
  install:
  - bash /relocate.sh /relocate /usr/bin/bash /usr/bin/cp /usr/bin/rm
