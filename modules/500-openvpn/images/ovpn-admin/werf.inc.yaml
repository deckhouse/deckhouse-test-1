{{- $gitCommit := "e5bf819db34227cc739963059d72582a73ea1613" }}
{{- $binaries := "/usr/bin/bash" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
git:
- add: /{{ .ModulePath }}/modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/templates
  to: /app/templates
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
{{- include "image mount points" . }}
- from: {{ .ModuleName }}/{{ .ImageName }}-backend-artifact
  add: /src/ovpn-admin
  to: /app/ovpn-admin
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/version
  to: /app/version
  before: setup
- from: {{ .ModuleName }}/openvpn-artifact
  add: /src/openvpn/src/openvpn/openvpn
  to: /usr/sbin/openvpn
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-frontend-artifact
  add: /src/frontend/static
  to: /app/frontend/static
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: setup
imageSpec:
  config:
    user: "64535:64535"
    workingDir: "/app"
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [git, coreutils]
git:
- url: {{ .SOURCE_REPO }}/palark/ovpn-admin.git
  commit: {{ $gitCommit }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  includePaths:
  - '**/*.patch'
  stageDependencies:
    install:
    - '**/*.patch'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - rm -rf .git
  - echo {{ $gitCommit }} > version
---
image: {{ .ModuleName }}/{{ .ImageName }}-backend-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang==1.26.8, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
  - export GOPROXY=off
  - go build -ldflags="-s -w" .
  - chown -R 64535:64535 /src
  - chmod 0755 /src/ovpn-admin
---
image: {{ .ModuleName }}/{{ .ImageName }}-frontend-artifact
final: false
from: {{ .Images.BASE_NODE_16_ALPINE }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  install:
  {{- include "node packages proxy" . | nindent 2 }}
  - cd /src/frontend
  - npm install
  - npm run build
---
image: {{ .ModuleName }}/{{ .ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd]
git:
- add: /modules/002-deckhouse/images/init/relocate.sh
  to: /relocate.sh
  stageDependencies:
    install: ['**/*']
import:
- from: {{ .ModuleName }}/openssl-artifact
  add: /openssl
  to: /openssl
  before: install
shell:
  install:
  - bash /relocate.sh /relocate {{ $binaries }}
  - cp /openssl/usr/local/bin/* /relocate/usr/bin/
