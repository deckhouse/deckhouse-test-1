---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /registry-packages-proxy
  before: setup 
{{- include "image mount points" . }}  
imageSpec:
  config:
    entrypoint: ["/registry-packages-proxy"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ .ModulePath }}modules/039-{{ .ModuleName }}/images/{{ .ImageName }}/src
  to: /src
  includePaths:
  - '**/*.go'
  - '**/*.mod'
  - '**/*.sum'
- add: /{{ .ModulePath }}go_lib/registry-packages-proxy
  to: /go_lib/registry-packages-proxy
  includePaths:
  - '**/*.go'
  - '**/*.mod'
  - '**/*.sum'
---
{{ $rppSignCheck := ternary "true" "false" (eq .Env "CSE") -}}
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang, git, coreutils, gnu-gcc]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /go_lib/registry-packages-proxy
  to: /go_lib/registry-packages-proxy
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  setup:
  - cd /src
  - export GOPROXY=off
  - go test ./... -v
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X registry-packages-proxy/internal/app.RppSignCheck={{ $rppSignCheck }}" -o /registry-packages-proxy cmd/registry-packages-proxy/*.go
  - chown 64535:64535 /registry-packages-proxy
  - chmod 0755 /registry-packages-proxy
mount:
{{ include "mount points for golang builds" . }}
