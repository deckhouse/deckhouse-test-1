{{- $dexVersion := include "get_oss_version_by_id" (list "dex" $ ) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
- from: {{ $.ModuleName }}/{{ $.ImageName }}-dex-artifact
  add: /src/dex
  to: /usr/local/bin/dex
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-dex-src-artifact
  add: /web
  to: /web
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    user: "64535:64535"
    entrypoint: ["/usr/local/bin/dex", "serve", "/etc/dex/config.docker.yaml"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-dex-src-artifact
from: {{ index $.Images "builder/distroless" }}
fromCacheVersion: "2025-02-18.01"
final: false
packages:
- type: os-pm
  spec: [git, coreutils, bash, diffutils, sed, grep, findutils, yq]
git:
  - url: {{ $.SOURCE_REPO }}/dexidp/dex.git
    to: /src
    tag: v{{ $dexVersion }}
    stageDependencies:
      install:
        - '**/*.go'
        - '**/go.mod'
        - '**/go.sum'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/crds/
    to: /module_crds
    stageDependencies:
      install:
        - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches/
    to: /patches
    stageDependencies:
      install:
        - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src/web
    to: /web
    stageDependencies:
      install:
        - '**/*'
shell:
  install:
    - cd /src
    - git apply /patches/*.patch --verbose
    # Check after patches are applied: our patches may legitimately update Dex
    # source CRDs (e.g. additionalPrinterColumns for OfflineSessions); the
    # snapshot in modules/.../crds/external must match the post-patch source.
    - bash /module_crds/pull_dex_crds.sh --check --dex-dir /src/scripts/manifests/crds
    - rm -rf examples
---
image: {{ .ModuleName }}/{{ .ImageName }}-dex-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang==1.26.8, git, bash, coreutils, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-dex-src-artifact
    add: /src
    to: /src
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - export GOPROXY=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64
    - export LDFLAGS='-s -w -extldflags=-static -X main.version={{ $dexVersion }}'
    - cd /src
    - |
      {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags "${LDFLAGS}" -tags netgo -o dex ./cmd/dex`) | indent 6 }}
    - chown 64535:64535 dex
    - chmod 0700 dex
---
{{- $_ := set . "FuzzEngine" "go" }}
{{- $_ := set . "FuzzSrcImage" (printf "%s/%s-dex-artifact" .ModuleName .ImageName) }}
{{- $_ := set . "FuzzPackages" "./server" }}
{{- include "fuzz image" . }}
---
