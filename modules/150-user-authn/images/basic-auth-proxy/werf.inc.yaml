{{- if ne $.Env "CSE" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
  - from: common/distroless-artifact
    add: /relocate
    to: /
    before: install
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-basic-auth-proxy-artifact
    add: /src/basic-auth-proxy
    to: /basic-auth-proxy
    before: setup
imageSpec:
  config:
    user: "64535:64535"
    entrypoint: [ "/basic-auth-proxy" ]
---
image: {{ .ModuleName }}/{{ .ImageName }}-basic-auth-proxy-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/app
  to: /src
  includePaths:
  - '**/*.go'
  - '**/go.mod'
  - '**/go.sum'
---
image: {{ .ModuleName }}/{{ .ImageName }}-basic-auth-proxy-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang==1.26.8, git, bash, coreutils, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-basic-auth-proxy-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - export GOPROXY=off
    - cd /src
    - export CGO_ENABLED=0 GOOS=linux
    - |
      {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags '-s -w' -o basic-auth-proxy ./cmd/main.go`) | indent 6 }}
    - chown 64535:64535 basic-auth-proxy
    - chmod 0700 basic-auth-proxy
{{- end }}
