{{- $cloud_utils_version := include "get_oss_version_by_id" (list "cloud-utils" $ )  -}}
{{- $growpart_version := include "get_oss_version_by_id" (list "util-linux-growpart" $ )  -}}
{{- $image_version := $cloud_utils_version | replace "." "-" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/util-linux/util-linux.git
  tag: v{{ $growpart_version }}
  add: /
  to: /src/util-linux
- url: {{ $.SOURCE_REPO }}/canonical/cloud-utils.git
  tag: {{ $cloud_utils_version }}
  add: /
  to: /src/cloud-utils
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - growpart
  - install
  - uninstall
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-fdisk-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - fdisk
  - sfdisk
  before: setup
imageSpec:
  config:
    labels: { "distro": "all", "version": "all", "growpart": "{{ $cloud_utils_version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-fdisk-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, make, gettext, autoconf, automake, libtool, flex, bison, clang, binutils, gnu-gcc-devel, gnu-glibc-devel, linux-headers, pkgconf, perl, python, sed, grep, gawk, findutils, diffutils, file]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
shell:
  setup:
  - cd /src/util-linux
  - export LDFLAGS="-Wl,-z,now -Wl,-z,relro -static -s"
  - export CFLAGS="-fPIC -pie -fstack-protector-all -O2 -D_FORTIFY_SOURCE=2 -static -s"
  # pm gettext ships no autopoint archive (/usr/share/gettext is empty); NLS is disabled, so stub autopoint
  # and the po/Makefile.in.in it would have generated
  - |
    mkdir -p /tmp/stubbin
    printf '#!/bin/sh\n[ "$1" = --version ] && echo "autopoint (GNU gettext-tools) stub"\nexit 0\n' > /tmp/stubbin/autopoint
    chmod +x /tmp/stubbin/autopoint
    printf 'datarootdir = @datarootdir@\nall install install-data install-exec uninstall check installcheck clean distclean mostlyclean maintainer-clean dist distdir:\n\t@true\n' > po/Makefile.in.in
    printf '#!/bin/sh\nexit 0\n' > config/config.rpath
  - export PATH=/tmp/stubbin:$PATH
  - ./autogen.sh && ./configure --enable-static --enable-static-programs=fdisk,sfdisk --disable-pylibmount --without-python --disable-liblastlog2
  - make fdisk.static sfdisk.static && strip ./fdisk.static && strip ./sfdisk.static
  - mv ./fdisk.static /fdisk && mv ./sfdisk.static /sfdisk
  - chmod +x /fdisk /sfdisk
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
shell:
  setup:
  - mv /src/cloud-utils/bin/growpart /growpart
  - mv /src/scripts/* /
  - chmod +x /growpart /install /uninstall
