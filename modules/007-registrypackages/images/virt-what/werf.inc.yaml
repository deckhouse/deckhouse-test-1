{{- $version := include "get_oss_version_by_id" (list "virt-what" $ )  -}}
{{- $image_version := $version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/virt-what.git
  tag: v{{ $version }}
  add: /
  to: /src/virt-what
- add: /{{ $.ModulePath }}/modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - virt-what
  - virt-what-cpuid-helper
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: {"distro": "all", "version": "all", "virt-what": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, make, autoconf, pkgconf, automake, gnu-gcc, gnu-glibc-devel, binutils, perl, m4, sed, grep, gawk, findutils, diffutils]
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
shell:
  setup:
  - cd /src/virt-what
  - autoreconf -fi
  - autoconf
  - LDFLAGS="-static" ./configure
  - make
  - strip ./virt-what-cpuid-helper
  - mv ./virt-what /virt-what && mv ./virt-what-cpuid-helper /virt-what-cpuid-helper
  - mv /src/scripts/* /
  - chmod +x /virt-what-cpuid-helper /virt-what  /install /uninstall
