{{- if ne $.Env "CSE" }}
{{- $version := include "get_oss_version_by_id" (list "amazon-ec2-utils" $ )  -}}
{{- $image_version := $version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/amazonlinux/amazon-ec2-utils.git
  tag: v{{ $version }}
  add: /
  to: /src/amazon-ec2-utils
- add: /{{ $.ModulePath }}/modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src/amazon-ec2-utils/ebsnvme-id
  to: /ebsnvme-id
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src/scripts
  to: /
  before: setup
imageSpec:
  config:
    labels: { "distro": "all", "version": "all", "growpart": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
{{- end }}
