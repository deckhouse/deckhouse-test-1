{{- $version := "1.6.5" }}
{{- $image_version := $version | replace "." "-" }}
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}"
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
  - type: os-pm
    spec: [bash, coreutils, git]
git:
  - url: {{ $.SOURCE_REPO }}/cloudflare/cfssl.git
    tag: v{{ $version }}
    add: /
    to: /src/cfssl
    stageDependencies:
      install: ['**/*']
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
    to: /src/scripts
    stageDependencies:
      install:
        - '**/*'
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
    to: /patches
    stageDependencies:
      install:
        - '**/*'
shell:
  install:
    - mkdir -m 1777 /src/tmp
    - chmod +x /src/scripts/*
    - cd /src/cfssl && git apply /patches/*.patch --verbose
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}"
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
  - type: os-pm
    spec: [bash, coreutils, golang, make, git]
  - type: go-mod
    workdir: /src/cfssl
    env:
      GOPROXY: "%secret:GOPROXY%"
import:
  - from: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}"
    add: /src/cfssl
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
  - id: GOPROXY
    value: "{{ $.GOPROXY }}"
shell:
  install:
    - export GOPROXY=off GOSUMDB=off
    - export GOOS=linux
    - export GOARCH=amd64
    - export CGO_ENABLED=0
    - cd /src/cfssl
    - go mod vendor
    - make
    - chmod +x ./bin/*
    - mv ./bin/* /
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}"
from: scratch
import:
  - from: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}"
    add: /src/scripts
    to: /
    includePaths:
    - install
    - uninstall
    before: setup
  - from: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}"
    add: /
    to: /
    includePaths:
    - cfssl
    - cfssl-bundle
    - cfssl-certinfo
    - cfssl-newkey
    - cfssl-scan
    - cfssljson
    before: setup
imageSpec:
  config:
    labels:
      distro: all
      version: all
      cfssl: {{ $version }}
      cfssl-bundle: {{ $version }}
      cfssl-certinfo: {{ $version }}
      cfssl-newkey: {{ $version }}
      cfssl-scan: {{ $version }}
      cfssljson: {{ $version }}
