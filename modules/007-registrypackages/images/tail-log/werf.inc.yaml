---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src/tail-log
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /
  to: /
  includePaths:
  - tail-log
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: {"distro": "all", "version": "all", "tail-log": "0.0.1" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, golang, git]
- type: go-mod
  workdir: /src/tail-log
  env:
    GOPROXY: "%secret:GOPROXY%"
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  setup:
  - cd /src/tail-log && GOPROXY=off GOSUMDB=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-w -s" -o /tail-log .
  - mv /src/scripts/* /
