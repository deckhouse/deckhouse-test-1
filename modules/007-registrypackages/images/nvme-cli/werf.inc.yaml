{{- $version := include "get_oss_version_by_id" (list "nvme-cli" $ )  -}}
{{- $image_version := $version | replace "." "-" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact-{{ $image_version }}
  add: /relocate
  to: /
  includePaths:
  - nvme
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: {"distro": "all", "version": "all", "nvme-cli": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/linux-nvme/nvme-cli.git
  tag: v{{ $version }}
  add: /
  to: /src/nvme-cli
- url: {{ $.SOURCE_REPO }}/linux-nvme/libnvme.git
  tag: v1.11.1
  add: /
  to: /src/nvme-cli/subprojects/libnvme
- add: /{{ .ModulePath }}/modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/scripts
  to: /src/scripts
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, gnu-gcc, gnu-glibc-devel, linux-headers, meson, ninja, python, pkgconf, git, sed, grep, gawk, binutils]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
shell:
  install:
  - cd /src/nvme-cli
  - |
    meson .build --buildtype=release --default-library=static -Dc_link_args="-static" --wrap-mode=nodownload \
      -Dlibnvme:tests=false -Dlibnvme:keyutils=disabled -Djson-c=disabled -Dlibnvme:json-c=disabled \
      -Dlibnvme:openssl=disabled -Dlibnvme:python=disabled -Ddocs=false
  - ninja -C .build
  - mkdir /relocate
  - cp .build/nvme /relocate
  - cp /src/scripts/* /relocate
