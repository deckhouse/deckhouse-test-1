{{- $containerd_v1_version := "1.7.35" }}
{{- $containerd_v2_version := "2.2.8" }}
{{- $runc_version := "1.3.6" }}
{{- $containerd_commits := dict "1.7.35" "0fab6e1c57c38c945dd004bd1d560d1b0915822f" "2.2.8" "941d3ed89ad60ad91cac377a16ecde23e2143083" }}
{{- $runc_commits := dict "1.3.6" "491b69bab9fa206b984fb26ba07d3110d62e671f" }}
{{- $containerd_versions := list $containerd_v2_version }}
{{- if ne $.Env "CSE" }}
  {{- $containerd_versions = list $containerd_v1_version $containerd_v2_version }}
{{- end }}
{{- $runc_versions := list $runc_version }}
{{- $containerd2runc := dict $containerd_v1_version $runc_version $containerd_v2_version $runc_version }}
{{- $containerd_integrity_patches_version := .IntegrityPatchesVersion | default "1" }} # may be redefine in CSE

# calculate additional build options for containerd
# skip for v1 and not CSE. Now we calculate namespaces for integrity check
# from /tools/build_includes/integrity-check-namespaces-{Env}.yaml file (e.g. integrity-check-namespaces-CSE.yaml)
# . is dict with keys:
#   rootContext - context of template. Should contain Files and Env (werf env) keys
#   isV2 - bool value that indicates that we render container v2 template
{{- define "render_containerd_build_options" }}
{{- $context := .rootContext -}}
{{- $is_v2 := .isV2 -}}

  {{- if and (eq $context.Env "CSE") $is_v2 -}}
    {{- $namespacesFile := printf "/tools/build_includes/integrity-check-namespaces-%s.yaml" $context.Env -}}
    {{- $namespacesSettings := ($context.Files.Get $namespacesFile | fromYaml) }}
    {{- if not (hasKey $namespacesSettings "namespaces_for_integrity") -}}
      {{- fail (printf "file %s has not key namespaces_for_integrity" $namespacesFile) -}}
    {{- end }}

    {{- $namespaces := get $namespacesSettings "namespaces_for_integrity" | join "," -}}
    {{- if $namespaces -}}
INTEGRITY_NAMESPACES="{{ $namespaces }}"
    {{- end }}
  {{- end }}
{{- end }}


{{- range $runc_version := $runc_versions }}
{{- $runc_commit := index $runc_commits $runc_version | required "Update the runc source commit for this version" }}
{{- $runcPatchesPath := printf "/%smodules/007-%s/images/%s/patches/runc/%s" $.ModulePath $.ModuleName $.ImageName $runc_version }}
{{- $runcHasPatch := false }}
{{- range $path, $_ := $.Files.Glob (printf "%s/*.patch" $runcPatchesPath) }}
  {{- $runcHasPatch = true }}
{{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-runc-src-artifact-{{ $runc_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, git]
git:
- url: {{ $.SOURCE_REPO }}/opencontainers/runc
  commit: {{ $runc_commit }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
{{- if $runcHasPatch }}
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches/runc
  to: /patches
  stageDependencies:
    install:
    - '**/*'
{{- end }}
shell:
  install:
  - cd /src
  {{- if $runcHasPatch }}
  - git apply /patches/{{ $runc_version }}/*.patch --verbose
  {{- end }}
  - printf '%s\n' '{{ $runc_commit }}' > COMMIT
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-runc-artifact-{{ $runc_version }}
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, golang, git, make, pkgconf, libseccomp-devel, gnu-gcc, gnu-glibc-devel, binutils, sed, grep, gawk, findutils, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-runc-src-artifact-{{ $runc_version }}
  add: /src
  to: /src
  before: install
mount:
  {{ include "mount points for golang builds" $ }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
shell:
  install:
  - mkdir -p /out /root
  - export GOPROXY=off GOSUMDB=off
  - cd /src
  - go mod vendor
  - git config --global user.email "builder@deckhouse.io"
  - |
  {{- $buildContext := deepCopy $ -}}
  {{- $parted_version := split "." $runc_version -}}
  {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
  {{- $_ := set $buildContext "BuildCommand" `make COMMIT="$(cat COMMIT)" EXTRA_LDFLAGS="-s -w" static` -}}
  {{- $_ := set $buildContext "ProjectName" (printf "%s/runc-%s.%s" $.ModuleName $parted_version._0 $parted_version._1) -}}
  {{- include "image-build.build" $buildContext | indent 6 }}
  - mv runc /out/runc
  - chown -R 64535:64535 /out
  - chmod 755 /out/runc
{{- end }}

{{- range $containerd_version := $containerd_versions }}
  {{- $containerd_commit := index $containerd_commits $containerd_version | required "Update the containerd source commit for this version" }}
  {{- $image_version := $containerd_version | replace "." "-" }}
  {{- $is_v2 := hasPrefix "2." $containerd_version }}
  {{- $major_version := index (splitList "-" $image_version) 0 }}
  {{- $runc_version := index $containerd2runc $containerd_version }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /out
  to: /
  includePaths:
  - containerd
  - .containerd_fallback
  - containerd-shim-runc-v1
  - containerd-shim-runc-v2
  - ctr
  - install
  - uninstall
  - containerd.service
  before: setup
{{- if and (eq $.Env "CSE") $is_v2 }}
- from: {{ $.ModuleName }}/{{ $.ImageName }}-pidumount-artifact
  add: /pidumount
  before: setup
{{- end }}
- from: {{ $.ModuleName }}/{{ $.ImageName }}-runc-artifact-{{ $runc_version }}
  add: /out/runc
  to: /runc
  before: setup
imageSpec:
  config:
    labels: { "distro": "all", "version": "all", "containerd": "{{ $containerd_version }}", "runc": "{{ $runc_version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, git]
git:
- url: {{ $.SOURCE_REPO }}/containerd/containerd.git
  commit: {{ $containerd_commit }}
  add: /
  to: /src/containerd
  stageDependencies:
    install: ['**/*']
{{- if and (eq $.Env "CSE") $is_v2 }}
- url: git@{{ $.DECKHOUSE_PRIVATE_REPO }}:deckhouse/kubernetes/platform/containerd-integrity-patches.git
  tag: v{{ $containerd_version }}-{{ $containerd_integrity_patches_version }}
  add: /
  to: /src/integrity-patches
  stageDependencies:
    install: ['**/*']
{{- end }}
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
  stageDependencies:
    install:
    - '**/*'
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches/containerd/{{ $containerd_version }}
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
{{- if and (eq $.Env "CSE") $is_v2 }}
  - echo "Attention! Use integrity patches!"
  - alias cp='cp'
  - cp /src/integrity-patches/patches/*.patch /patches
  - rm -rf /src/integrity-patches
{{- end }}
  - cd /src/containerd
  - printf '%s\n' 'v{{ $containerd_version }}' > VERSION
  - printf '%s\n' '{{ $containerd_commit }}' > REVISION
  - git apply /patches/*.patch --verbose
  - cd /src/scripts
  - cp install_v{{ $major_version }} install
  - rm -rf install_v1 install_v2
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, golang, git, make, pkgconf, libseccomp-devel, gnu-gcc, gnu-glibc-devel, binutils, sed, grep, gawk, findutils, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src/containerd
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" $ }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
shell:
  install:
  - mkdir -p /out /root
  - export GOPROXY=off GOSUMDB=off
  - cd /src/containerd
  - git config --global user.email "builder@deckhouse.io"
  - go mod vendor
  {{- if and (eq $.Env "CSE") $is_v2 }}
  - GOOS=linux GOARCH=amd64 make STATIC=1 INTEGRITY_IMAGE_SIGN_CHECK="false" INTEGRITY_DEV_MAPPER_CHECK="false" INTEGRITY_PERIODICAL_CHECK="false" INTEGRITY_STOP_CONTAINER_IF_FAIL="false" bin/containerd
  - mv bin/containerd /out/.containerd_fallback
  {{- end }}
  {{- $additionalBuildOptions := include "render_containerd_build_options" (dict "rootContext" $ "isV2" $is_v2 ) }}
  - echo "Using next additional build options:'{{ $additionalBuildOptions }}'"
  - |
  {{- $buildContext := deepCopy $ -}}
  {{- $parted_version := split "." $containerd_version -}}
  {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
  {{- $_ := set $buildContext "BuildCommand" (printf "make STATIC=1 VERSION=\"$(cat VERSION)\" REVISION=\"$(cat REVISION)\" %s all" $additionalBuildOptions) -}}
  {{- $_ := set $buildContext "ProjectName" (printf "%s/containerd-%s.%s" $.ModuleName $parted_version._0 $parted_version._1) -}}
  {{- include "image-build.build" $buildContext | indent 6 }}
  - mv bin/* /out
  - mv /src/scripts/* /out
  - chown -R 64535:64535 /out
  - chmod 755 /out/*

  {{- if and (eq $.Env "CSE") $is_v2 }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-pidumount-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/pidumount/src
  to: /src
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-pidumount-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, golang, git, gnu-gcc, gnu-glibc-devel, binutils, svace, ssh-static, rsync]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-pidumount-src-artifact
  add: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
shell:
  install:
  - export GOPROXY=off GOSUMDB=off
  - export GOOS=linux GOARCH=amd64 CGO_ENABLED=1
  - cd /src
  - |
    {{- $buildContext := deepCopy $ -}}
    {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
    {{- $_ := set $buildContext "BuildCommand" `go build -ldflags="-linkmode external -extldflags '-static'" -tags netgo -o /pidumount main.go` -}}
    {{- include "image-build.build" $buildContext | indent 4 }}
  - strip /pidumount
  - chmod 0700 /pidumount
  {{- end }}
{{- end }}

{{- if ne $.Env "CSE" }}
# containerd sysext (built for containerd v2 only)

{{- $image_version := $containerd_v2_version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-sysext-artifact-{{ $image_version }}
from: {{ index $.Images "builder/distroless" }}
final: false
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
  add: /
  to: /sysext/opt/deckhouse/bin
  includePaths:
  - containerd
  - containerd-shim-runc-v1
  - containerd-shim-runc-v2
  - ctr
  - runc
  before: install
{{- include "engine sysext sign imports" $ }}
git:
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/sysext
  to: /scripts
  includePaths:
  - extension-release.containerd
  - sysext-containerd.service
  stageDependencies:
    install:
    - extension-release.containerd
    - sysext-containerd.service
{{- include "engine sysext sign secrets" . }}
packages:
- type: os-pm
  spec: [bash, erofs-utils, coreutils, cryptsetup, systemd==260.4, openssl, curl, jq]
shell:
  install:
  - mkdir -p /out
  - mkdir -p /sysext/usr/lib/extension-release.d /sysext/usr/lib/systemd/system
  - cp -f /scripts/sysext-containerd.service /sysext/usr/lib/systemd/system/containerd.service
  - cp -f /scripts/extension-release.containerd /sysext/usr/lib/extension-release.d/
  - mkfs.erofs -L _sysext -U 00000000-0000-0000-0000-000000000000 -z lzma,9 /out/containerd.raw sysext/
  # Sidecar files, named the way systemd derives them — see engine-sysext.tmpl.
  - veritysetup format /out/containerd.raw /out/containerd.verity --root-hash-file=roothash.txt
  - tr -d ' \n' < roothash.txt > /out/containerd.roothash
  - veritysetup verify /out/containerd.raw /out/containerd.verity "$(cat /out/containerd.roothash)"
{{- include "engine sysext sign" "containerd" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-sysext-{{ $image_version }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-sysext-artifact-{{ $image_version }}
  add: /out
  to: /
  includePaths:
  - '**/*'
  before: setup
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "sysext_level": "1.0", "containerd": "{{ $containerd_v2_version }}", "runc": "{{ index $containerd2runc $containerd_v2_version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
{{- end }}
