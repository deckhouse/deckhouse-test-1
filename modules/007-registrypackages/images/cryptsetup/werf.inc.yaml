---
image: {{ .ModuleName }}/{{ .ImageName }}
from: scratch
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /
  to: /
  includePaths:
  - opt/deckhouse
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: {"distro": "all", "version": "all", "cryptsetup": "2.7.5" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, cryptsetup==2.7.5, patchelf, file, findutils, grep, gawk, ldd]
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/scripts
  to: /
  stageDependencies:
    setup:
    - '**/*'
shell:
  setup:
  - mkdir -p /opt/deckhouse/bin /opt/deckhouse/lib
  - |
    for binary in /usr/sbin/cryptsetup /usr/sbin/veritysetup /usr/sbin/integritysetup; do
      cp -L "$binary" /opt/deckhouse/bin/
      if file -L "$binary" | grep -q "ELF.*dynamically linked"; then
        interpreter=$(patchelf --print-interpreter "$binary")
        cp -L "$interpreter" /opt/deckhouse/lib/
        for library in $(ldd "$binary" | awk '/=> \/|^\s*\// { for (field=1; field<=NF; field++) if ($field ~ /^\//) print $field }'); do
          cp -L "$library" /opt/deckhouse/lib/
        done
        patchelf --set-interpreter "/opt/deckhouse/lib/$(basename "$interpreter")" "/opt/deckhouse/bin/$(basename "$binary")"
        patchelf --force-rpath --set-rpath /opt/deckhouse/lib "/opt/deckhouse/bin/$(basename "$binary")"
      fi
    done
  - chown -R 0:0 /opt/deckhouse
