{{/* Important! The iptables binaries from artifact are also used in other modules: kube-proxy, cni-simple-bridge, cni-cilium, cni-flannel, node-local-dns, ingress-nginx, openvpn, network-policy-engine and network-gateway. */}}
{{- $iptables_version := include "get_oss_version_by_id" (list "iptables" $ )  -}}
{{- $libmnl_version := include "get_oss_version_by_id" (list "libmnl" $ )  -}}
{{- $libnftnl_version := include "get_oss_version_by_id" (list "libnftnl" $ )  -}}
{{- $image_version := $iptables_version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/netfilter/libmnl
  tag: libmnl-{{ $libmnl_version }}
  add: /
  to: /src/libmnl
- url: {{ $.SOURCE_REPO }}/netfilter/libnftnl
  tag: libnftnl-{{ $libnftnl_version }}
  add: /
  to: /src/libnftnl
- url: {{ $.SOURCE_REPO }}/netfilter/iptables
  tag: v{{ $iptables_version }}
  add: /
  to: /src/iptables
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - xtables-legacy-multi
  - xtables-nft-multi
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: { "distro": "all", "version": "all", "iptables": "{{ $iptables_version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, make, gettext, autoconf, automake, libtool, clang, gnu-gcc, gnu-glibc-devel, linux-headers, pkgconf, bison, flex, binutils, perl, sed, grep, gawk, findutils, diffutils]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
shell:
  setup:
  - export PKG_CONFIG_PATH=/opt/deckhouse/bin/.libs/pkgconfig
  - cd /src/libmnl
  - ./autogen.sh
  - ./configure --enable-static --libdir=/opt/deckhouse/bin/.libs
  - make && make install
  - cd /src/libnftnl
  - ./autogen.sh
  - ./configure --enable-static --libdir=/opt/deckhouse/bin/.libs
  - make && make install
  - cd /src/iptables
  - ./autogen.sh
  - ./configure --enable-static --disable-shared --libdir=/opt/deckhouse/bin/.libs
  - make LDFLAGS='-all-static'
  - strip ./iptables/xtables-legacy-multi && strip ./iptables/xtables-nft-multi
  - mv ./iptables/xtables-legacy-multi /xtables-legacy-multi && mv ./iptables/xtables-nft-multi /xtables-nft-multi
  - mv /src/scripts/* /
  - chmod +x /xtables-legacy-multi /xtables-nft-multi /install /uninstall
