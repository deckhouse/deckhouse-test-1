{{- $version := include "get_oss_version_by_id" (list "curl" $ )  -}}
{{- $image_version := $version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/curl/curl.git
  tag: curl-{{ $version | replace "." "_"}}
  add: /
  to: /src/curl
- add: /{{ $.ModulePath }}/modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - d8-curl
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: { "distro": "all", "version": "all", "curl": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, make, autoconf, automake, clang, libtool, gettext, binutils, gnu-gcc, gnu-glibc-devel, openssl, openssl-devel, libssh2-devel, libgcrypt-devel, zlib-devel, pkgconf, perl, sed, grep, gawk, findutils, diffutils]
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: setup
git:
  - add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
    to: /
    stageDependencies:
      setup:
      - '**/*'
shell:
  setup:
  - export CC=clang
  - cd /src/curl
  - autoreconf -fi
  - LDFLAGS="-static" PKG_CONFIG="pkg-config --static" ./configure --disable-shared --enable-static --disable-ldap --enable-ipv6 --enable-unix-sockets --with-ssl --with-libssh2
  - make -j4 V=1 LDFLAGS="-static -all-static"
  - strip src/curl
  - mv src/curl /d8-curl
  - mv /src/scripts/* /
  - chmod +x /d8-curl /install /uninstall
