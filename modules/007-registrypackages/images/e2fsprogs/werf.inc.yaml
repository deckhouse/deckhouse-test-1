{{- $version := include "get_oss_version_by_id" (list "e2fsprogs" $ )  -}}
{{- $image_version := $version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/ext2/e2fsprogs.git
  tag: v{{ $version }}
  add: /
  to: /src/e2fsprogs
- add: /{{ .ModulePath }}/modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/scripts
  to: /src/scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /src/scripts
  to: /
  includePaths:
  - install
  - uninstall
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact-{{ $image_version }}
  add: /relocate/sbin
  to: /
  includePaths:
  - mke2fs
  - fsck
  - resize2fs
  before: setup
imageSpec:
  config:
    labels: { "distro": "all", "version": "all", "mke2fs": "{{ $version }}", "fsck": "{{ $version }}", "resize2fs": "{{ $version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, make, gettext, autoconf, automake, libtool, flex, bison, clang, binutils, gnu-gcc, gnu-glibc-devel, linux-headers, pkgconf, perl, sed, grep, gawk, findutils, diffutils, texinfo]
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
shell:
  setup:
  - mkdir /relocate
  - cd /src/e2fsprogs
  - CFLAGS='-static' LDFLAGS="-static" ./configure
  - make
  - make DESTDIR=/relocate install
  - make clean
