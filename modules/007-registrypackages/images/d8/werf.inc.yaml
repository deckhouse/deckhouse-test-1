---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/deckhouse/deckhouse-cli.git
  tag: {{ .CandiVersionMap.d8.d8CliVersion }}
  add: /
  to: /src/deckhouse-cli
- add: /{{ $.ModulePath }}/modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /
  to: /
  includePaths:
  - d8
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: { "distro": "all", "version": "all", "d8": "{{ .CandiVersionMap.d8.d8CliVersion }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, golang, git, ssh-static, make, coreutils, findutils, file, jq, pkgconf, gnu-gcc, gnu-glibc-devel, elfutils-devel, openssl-devel, libuv-devel, zstd-devel, btrfs-progs-devel, binutils, sed, grep, gawk]
- type: go-mod
  workdir: /src/deckhouse-cli
  env:
    GOPROXY: "%secret:GOPROXY%"
    GOPRIVATE: flant.internal
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "url.ssh://git@%secret:DECKHOUSE_PRIVATE_REPO%/.insteadOf"
    GIT_CONFIG_VALUE_0: https://flant.internal/
    GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/d8-known-hosts
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
- from: common/task-artifact
  add: /task
  to: /usr/local/bin/task
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
- id: DECKHOUSE_PRIVATE_REPO
  value: {{ .DECKHOUSE_PRIVATE_REPO }}
shell:
  install:
  # The d8 static build links libuv from /usr/local/lib/libuv.a; pm ships it under a
  # different name and path.
  - mkdir -p /usr/local/lib
  - ln -fs "$(find /usr/lib /usr/lib64 /usr/lib/x86_64-linux-gnu -name 'libuv*.a' 2>/dev/null | head -n1)" /usr/local/lib/libuv.a
  - export GOPROXY=off GOSUMDB=off
  - cd /src/deckhouse-cli
  - task build:dist:linux:amd64 version={{ .CandiVersionMap.d8.d8CliVersion }}
  - mv ./dist/{{ .CandiVersionMap.d8.d8CliVersion }}/linux-amd64/bin/d8 /d8
  - mv /src/scripts/* /
  - chmod +x /d8 /install /uninstall
---
