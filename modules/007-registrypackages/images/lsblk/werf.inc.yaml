{{- $lsblk_version := include "get_oss_version_by_id" (list "util-linux-lsblk" $ )  -}}
{{- $image_version := $lsblk_version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - lsblk
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: {"distro": "all", "version": "all", "lsblk": "{{ $lsblk_version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/util-linux/util-linux.git
  tag: v{{ $lsblk_version }}
  add: /
  to: /src/util-linux
- add: /{{ $.ModulePath }}/modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, make, automake, gettext, autoconf, libtool, flex, bison, clang, binutils, gnu-gcc-devel, gnu-glibc-devel, linux-headers, pkgconf, perl, python, sed, grep, gawk, findutils, diffutils, file, ldd]
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: setup
shell:
  setup:
  - cd /src/util-linux
  - export LDFLAGS="-Wl,-z,now -Wl,-z,relro -static -s"
  - export CFLAGS="-fPIC -pie -fstack-protector-all -O2 -D_FORTIFY_SOURCE=2 -static -s"
  # pm gettext ships no autopoint archive (/usr/share/gettext is empty); NLS is disabled, so stub autopoint
  # and the po/Makefile.in.in it would have generated
  - |
    mkdir -p /tmp/stubbin
    printf '#!/bin/sh\n[ "$1" = --version ] && echo "autopoint (GNU gettext-tools) stub"\nexit 0\n' > /tmp/stubbin/autopoint
    chmod +x /tmp/stubbin/autopoint
    printf 'datarootdir = @datarootdir@\nall install install-data install-exec uninstall check installcheck clean distclean mostlyclean maintainer-clean dist distdir:\n\t@true\n' > po/Makefile.in.in
    printf '#!/bin/sh\nexit 0\n' > config/config.rpath
  - export PATH=/tmp/stubbin:$PATH
  - ./autogen.sh
  - ./configure --enable-static --enable-static-programs=lsblk --disable-pylibmount --without-python --disable-liblastlog2
  - make LDFLAGS="--static" lsblk && strip ./lsblk
  - ldd ./lsblk || true
  - mv ./lsblk /lsblk
  - mv /src/scripts/* /
  - chmod +x /lsblk /install /uninstall
