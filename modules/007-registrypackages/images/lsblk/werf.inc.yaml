{{- $lsblk_version := include "get_oss_version_by_id" (list "util-linux-lsblk" $ )  -}}
{{- $image_version := $lsblk_version | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /
  to: /
  includePaths:
  - lsblk
  - install
  - uninstall
  before: setup
imageSpec:
  config:
    labels: {"distro": "all", "version": "all", "lsblk": "{{ $lsblk_version }}" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ $.SOURCE_REPO }}/util-linux/util-linux.git
  tag: v{{ $lsblk_version }}
  add: /
  to: /src/util-linux
- add: /{{ $.ModulePath }}/modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
  to: /src/scripts
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, make, automake, gettext, autoconf, libtool, flex, bison, clang, binutils, gnu-gcc, gnu-glibc-devel, linux-headers, pkgconf, perl, python, sed, grep, gawk, findutils, diffutils, file, ldd]
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: setup
shell:
  setup:
  - cd /src/util-linux
  - export LDFLAGS="-Wl,-z,now -Wl,-z,relro -static -s"
  - export CFLAGS="-fPIC -pie -fstack-protector-all -O2 -D_FORTIFY_SOURCE=2 -static -s"
  - ./autogen.sh
  - ./configure --enable-static --enable-static-programs=lsblk --disable-pylibmount --without-python --disable-liblastlog2
  - make LDFLAGS="--static" lsblk && strip ./lsblk
  - ldd ./lsblk || true
  - mv ./lsblk /lsblk
  - mv /src/scripts/* /
  - chmod +x /lsblk /install /uninstall
