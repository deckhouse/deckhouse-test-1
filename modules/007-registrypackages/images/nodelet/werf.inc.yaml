# nodelet, the Deckhouse Engine node agent, delivered as a signed system
# extension so it can be updated without rebuilding the OS image and rebooting
# the node.
#
# The OS image carries its own copy of this extension as a seed under
# /usr/share/nodelet, built in the engine repository; this image is the update
# the cluster delivers on top of it.
#
# The unit ships inside the image on purpose: the agent restarts only the units
# it discovers there (systemd-dissect --list, see extensions/sysext.go), so an
# image without one is merged and never takes effect.
{{- if ne $.Env "CSE" }}
  {{- /* Pinned by release tag: werf keys a shell-cloned source on the rendered
         instructions alone, so a moving branch would be built once and cached
         forever. Bump this line to pick up agent changes. */ -}}
  {{- $nodeletVersion := "v0.1.9" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: git@{{ $.DECKHOUSE_PRIVATE_REPO }}:deckhouse/container-base/nodelet.git
  tag: {{ $nodeletVersion }}
  add: /
  to: /src
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, golang, git]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
shell:
  install:
  # The version is stamped in because nothing else on a node says which agent it
  # runs: the binary is the same path whichever copy the overlay serves.
  - cd /src && GOPROXY=off GOSUMDB=off CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s -X main.version={{ $nodeletVersion }}" -o /nodelet ./cmd/nodelet
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-sysext-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /nodelet
  to: /sysext/usr/bin/nodelet
  before: install
# The signing tools come in as imports, so this list has to be open before the
# define appends its entries to it.
{{- include "engine sysext sign imports" $ }}
git:
- add: /{{ $.ModulePath }}modules/007-{{ $.ModuleName }}/images/{{ $.ImageName }}/sysext
  to: /scripts
  includePaths:
  - extension-release.nodelet
  - nodelet.service
  stageDependencies:
    install:
    - extension-release.nodelet
    - nodelet.service
{{- include "engine sysext sign secrets" . }}
packages:
- type: os-pm
  spec: [bash, erofs-utils, coreutils, cryptsetup, systemd==260.4, openssl, curl, jq]
shell:
  install:
  - mkdir -p /out
  - mkdir -p /sysext/usr/lib/extension-release.d /sysext/usr/lib/systemd/system
  - cp -f /scripts/nodelet.service /sysext/usr/lib/systemd/system/nodelet.service
  - cp -f /scripts/extension-release.nodelet /sysext/usr/lib/extension-release.d/
  - mkfs.erofs -L _sysext -U 00000000-0000-0000-0000-000000000000 -z lzma,9 /out/nodelet.raw sysext/
  # Sidecar files, named the way systemd derives them — see engine-sysext.tmpl.
  - veritysetup format /out/nodelet.raw /out/nodelet.verity --root-hash-file=roothash.txt
  - tr -d ' \n' < roothash.txt > /out/nodelet.roothash
  - veritysetup verify /out/nodelet.raw /out/nodelet.verity "$(cat /out/nodelet.roothash)"
{{- include "engine sysext sign" "nodelet" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-sysext
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: scratch
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-sysext-artifact
  add: /out
  to: /
  includePaths:
  - '**/*'
  before: setup
imageSpec:
  config:
    labels: { "distro": "deckhouse-engine", "sysext_level": "1.0", "version": "all" }
    clearUser: true
    clearWorkingDir: true
    clearCmd: true
    clearEntrypoint: true
    removeEnv: ["/.*/"]
---
{{- end }}
