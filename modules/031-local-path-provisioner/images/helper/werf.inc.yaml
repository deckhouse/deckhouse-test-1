---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-dir-manager
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - GOPROXY=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /manager main.go
  - chmod 0777 /manager
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-dir-manager
  add: /manager
  to: /manager
  after: install
{{- include "image mount points" . }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /{{ .ModulePath }}modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/src
  to: /src
  includePaths:
  - '**/*.go'
  - '**/*.mod'
