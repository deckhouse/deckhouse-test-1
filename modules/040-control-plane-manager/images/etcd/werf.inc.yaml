{{- $version := include "get_oss_version_by_id" (list "etcd" $ ) }}
{{- $version = printf "v%s" $version }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [git, coreutils]
git:
- url: {{ .SOURCE_REPO }}/etcd-io/etcd.git
  tag: {{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ .ModulePath }}/modules/{{ .ModulePriority }}-{{ .ModuleName }}/images/{{ .ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - rm -rf tools
---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/pause
  add: /pause
  to: /pause
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /
  to: /usr/bin
  includePaths:
  - etcd
  - etcdctl
  - etcdutl
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/usr/bin/etcd"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang, git, bash, coreutils, svace, ssh-static, rsync]
{{- range $module := list "server" "etcdctl" "etcdutl" }}
- type: go-mod
  workdir: /src/{{ $module }}
  env:
    GOPROXY: "%secret:GOPROXY%"
{{- end }}
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - cd /src/
    - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0 GOPROXY=off
    - cd server
    - |
      {{- $buildContext := deepCopy $ -}}
      {{- $_ := set $buildContext "SvaceBuildOptions" "--enable-ptrace-all" -}}
      {{- $_ := set $buildContext "BuildCommand" `go build -ldflags="-s -w" -o /etcd .` -}}
      {{- include "image-build.build" $buildContext | indent 6 }}
    - cd ..
    - cd etcdctl && go build -ldflags="-s -w" -o /etcdctl . && cd ..
    - cd etcdutl && go build -ldflags="-s -w" -o /etcdutl . && cd ..
