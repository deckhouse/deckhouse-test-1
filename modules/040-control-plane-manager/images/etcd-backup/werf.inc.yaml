---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
git:
- add: /{{ $.ModulePath }}/modules/040-{{ $.ModuleName }}/images/{{ $.ImageName }}/entrypoint.sh
  to: /entrypoint.sh
import:
{{- include "image mount points" . }}
- from: {{ .ModuleName }}/etcd-artifact
  add: /etcdctl
  to: /usr/bin/etcdctl
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-artifact
  add: /relocate
  to: /
  before: setup
imageSpec:
  config:
    entrypoint: ["/entrypoint.sh"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, gzip, tar, gawk, gnu-glibc, coreutils, ldd]
git:
- add: /modules/030-cloud-provider-aws/images/ebs-csi-plugin/relocate.sh
  to: /relocate.sh
  stageDependencies:
    install: ['**/*']
shell:
  install:
  - bash /relocate.sh /relocate /usr/bin/bash /usr/bin/gzip /usr/bin/tar /usr/bin/gawk /usr/bin/chmod /usr/bin/df /usr/bin/mv /usr/bin/tail
  - ln -sf bash /relocate/usr/bin/sh
  - ln -sf gawk /relocate/usr/bin/awk
