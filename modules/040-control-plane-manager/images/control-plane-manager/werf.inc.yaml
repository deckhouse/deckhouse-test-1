---
image: {{ $.ModuleName }}/{{ $.ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /control-plane-manager
  to: /control-plane-manager
  before: install
{{- include "image mount points" $ }}
imageSpec:
  config:
    entrypoint: ["/control-plane-manager"]
---
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang, git]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /go_lib/controlplane
  to: /go_lib/controlplane
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
    - cd /src/cmd/control-plane-manager
    {{ if eq $.Env "CSE"}}
    - export ETCD_SIGN_ENABLED="-X control-plane-manager/internal/constants.SignatureBuildEnabled=true"
    {{ else }}
    - export ETCD_SIGN_ENABLED="-X control-plane-manager/internal/constants.SignatureBuildEnabled=false"
    {{ end }}
    - GOPROXY=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build $BUILD_TAGS -ldflags="-s -w $ETCD_SIGN_ENABLED" -o /control-plane-manager .
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/040-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src
- add: /{{ $.ModulePath }}go_lib/controlplane
  to: /go_lib/controlplane
  includePaths:
  - '**/*.go'
  - '**/*.mod'
  - '**/*.sum'
