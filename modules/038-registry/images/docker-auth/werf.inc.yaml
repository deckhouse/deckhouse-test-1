{{- $version := "v1.14.0-deckhouse.10"}}
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
  - type: os-pm
    spec: [coreutils]
git:
  - url: {{ $.SOURCE_REPO }}/deckhouse/3p-docker_auth.git
    tag: {{ $version }}
    add: /
    to: /src/docker_auth
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
    to: /src/scripts
    stageDependencies:
      install:
        - '**/*'
shell:
  install:
    - mkdir -m 1777 /src/tmp
    - chmod +x /src/scripts/*
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
  - type: os-pm
    spec: [golang, git, bash, coreutils, make, grep, sed, findutils]
  - type: go-mod
    workdir: /src/docker_auth/auth_server
    env:
      GOPROXY: "%secret:GOPROXY%"
import:
  - from: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
    add: /src/docker_auth
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
  - id: GOPROXY
    value: "{{ $.GOPROXY }}"
shell:
  install:
    - export GOPROXY=off
    - export GOOS=linux
    - export GOARCH=amd64
    - export CGO_ENABLED=0
    - cd /src/docker_auth/auth_server
    - make build
    - chmod +x ./auth_server
    - mv ./auth_server /auth_server
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}"
from: {{ index $.Images "base/distroless" }}
import:
- from: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
  add: /src/scripts
  to: /
  includePaths:
  - install
  - uninstall
  before: setup
- from: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
  add: /src/tmp
  to: /tmp
  before: setup
- from: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
  add: /auth_server
  to: /auth_server
  before: setup
- from: common/pause
  add: /pause
  to: /pause
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/auth_server"]
