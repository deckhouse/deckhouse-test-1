{{ $appRelPath := printf "/%s/modules/038-%s/images/%s/app" $.ModulePath $.ModuleName $.ImageName }}
{{ $appAbsPath := printf "/deckhouse/modules/038-%s/images/%s/app" $.ModuleName $.ImageName }}
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
from: {{ index $.Images "builder/distroless" }}
final: false
git:
  - add: {{ $appRelPath }}
    to:  /src{{ $appAbsPath }}
  - add: /{{ $.ModulePath }}/go_lib/registry
    to: /src/deckhouse/go_lib/registry
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: {{ $appAbsPath }}
  env:
    GOPROXY: "%secret:GOPROXY%"
final: false
import:
  - from: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
    add: /src/deckhouse
    to: /deckhouse
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
  - id: GOPROXY
    value: "{{ $.GOPROXY }}"
shell:
  install:
    - export GOPROXY=off
    - cd {{ $appAbsPath }}
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test ./...
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /manager ./cmd/staticpod
    - chown 64535:64535 /manager
    - chmod 0755 /manager
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}"
from: {{ index $.Images "base/distroless" }}
import:
- from: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
  add: /manager
  to: /manager
  before: setup
- from: common/pause
  add: /pause
  to: /pause
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/manager"]
---
{{- $_ := set . "FuzzEngine" "go" }}
{{- $_ := set . "FuzzSrcAdd" $appAbsPath }}
{{- $_ := set . "FuzzPackages" "./internal/staticpod" }}
{{- include "fuzz image" . }}
