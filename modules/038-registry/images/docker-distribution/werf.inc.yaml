{{- $version := "v2.8.3-deckhouse.5"}}
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
  - type: os-pm
    spec: [coreutils]
git:
  - url: {{ $.SOURCE_REPO }}/deckhouse/3p-distribution.git
    tag: {{ $version }}
    add: /
    to: /src/distribution
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/scripts
    to: /src/scripts
    stageDependencies:
      install:
        - '**/*'
shell:
  install:
    - mkdir -m 1777 /src/tmp
    - chmod +x /src/scripts/*
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
  - type: os-pm
    spec: [golang, git, bash, coreutils, make, grep, findutils]
  - type: go-mod
    workdir: /src/distribution
    env:
      GOPROXY: "%secret:GOPROXY%"
import:
  - from: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
    add: /src/distribution
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
  - id: GOPROXY
    value: "{{ $.GOPROXY }}"
shell:
  install:
    - export GOPROXY=off
    - export GOOS=linux
    - export GOARCH=amd64
    - export CGO_ENABLED=0
    - cd /src/distribution
    - make build VERSION={{ $version }} REVISION={{ $version }}
    - make binaries VERSION={{ $version }} REVISION={{ $version }}
    - chmod +x ./bin/registry
    - mv ./bin/registry /registry
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}"
from: {{ index $.Images "base/distroless" }}
import:
- from: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
  add: /src/scripts
  to: /
  includePaths:
  - install
  - uninstall
  before: setup
- from: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
  add: /src/tmp
  to: /tmp
  before: setup
- from: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
  add: /registry
  to: /registry
  before: setup
- from: common/pause
  add: /pause
  to: /pause
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    entrypoint: ["/registry"]
    cmd: ["serve", "/config/config.yaml"]
