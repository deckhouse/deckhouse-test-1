{{- $version := "4.6.1" }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- add: /{{ $.ModulePath }}modules/470-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src/entrypoint
  includePaths:
  - '**/*.go'
  - '**/*.mod'
  - '**/*.sum'
- url: {{ .SOURCE_REPO }}/chrony/chrony
  tag: {{ $version }}
  add: /
  to: /src/chrony
---
image: {{ .ModuleName }}/build-chrony-static-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [automake, autoconf, libtool, build-base, bison, asciidoctor, libcap-devel, libucontext, linux-headers, make, coreutils, bash, sed, grep, gawk]
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/chrony
  to: /src
  before: install
shell:
  install:
  - cd /src
  - echo "{{ $version }}" > version.txt
  - CFLAGS="-static" LDFLAGS="-static" ./configure --prefix=/opt/chrony-static
  - make -j$(nproc)
  - make install
  - chown -R 64535:64535 /opt/chrony-static
  - chmod +x /opt/chrony-static/bin/chronyc
  - chmod +x /opt/chrony-static/sbin/chronyd
---
image: {{ .ModuleName }}/build-entrypoint-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang==1.26.8, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/entrypoint
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - GOPROXY=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags='-extldflags "-static" -s -w' -o /entrypoint main.go
  - chown -R 64535:64535 /entrypoint
  - chmod +x /entrypoint
---
image: {{ .ModuleName }}/{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: common/distroless-artifact
  add: /relocate
  to: /
  before: install
- from: {{ .ModuleName }}/build-chrony-static-artifact
  add: /opt/chrony-static
  before: setup
- from: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
  add: /usr/bin/tini
  to: /usr/bin/tini
  before: setup
- from: {{ .ModuleName }}/build-entrypoint-artifact
  add: /entrypoint
  to: /entrypoint
  before: setup
{{- include "image mount points" . }}
imageSpec:
  config:
    user: "64535:64535"
    entrypoint: ["/usr/bin/tini", "--"]
    cmd: ["/entrypoint"]
---
image: {{ .ModuleName }}/{{ .ImageName }}-runtime-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [tini]
