image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
git:
- add: /{{ $.ModulePath }}modules/800-{{ $.ModuleName }}/images/{{ $.ImageName }}/nginx.conf
  to: /opt/nginx-static/conf/nginx.conf
import:
  - from: common/nginx-static-artifact
    add: /opt/nginx-static
    to: /opt/nginx-static
    before: setup
  - from: {{ .ModuleName }}/{{ .ImageName }}-artifact
    add: /app
    to: /app
    before: setup
imageSpec:
  config:
    user: "64535:64535"
    entrypoint: [ "/opt/nginx-static/sbin/nginx", "-g", "daemon off;" ]
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [sed, coreutils]
git:
- add: /{{ $.ModulePath }}modules/800-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src/src
  stageDependencies:
    setup:
    - '**/*'
- add: /{{ $.ModulePath }}modules/800-{{ $.ModuleName }}/images/{{ $.ImageName }}/static
  to: /src/static
  stageDependencies:
    setup:
    - '**/*'
- url: {{ .SOURCE_REPO }}/deckhouse/deckhouse-cli.git
  tag: {{ .CandiVersionMap.d8.d8CliVersion }}
  add: /
  to: /src/deckhouse-cli
  stageDependencies:
    setup: ['**/*']
shell:
  setup:
  - cd /src/deckhouse-cli
  - echo {{ .CandiVersionMap.d8.d8CliVersion }} > VERSION
  - sed -i "s|sh:\ git describe --tags|sh:\ cat VERSION|" Taskfile.yml
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang==1.26.8, git, ssh-static, make, coreutils, findutils, file, jq, pkgconf, gnu-gcc, gnu-glibc-devel, elfutils-devel, openssl-devel, libuv-devel, zstd-devel, btrfs-progs-devel, bash, sed, grep, tar, gzip]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
    GOPRIVATE: flant.internal
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "url.ssh://git@%secret:DECKHOUSE_PRIVATE_REPO%/.insteadOf"
    GIT_CONFIG_VALUE_0: "https://flant.internal/"
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
import:
  - from: {{ .ModuleName }}/{{ .ImageName }}-frontend-artifact
    add: /app/dist
    to: /app
    before: install
  - from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
    add: /src/static
    to: /static
    before: install
  - from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
    add: /src/deckhouse-cli
    to: /src
    before: install
  - from: common/task-artifact
    add: /task
    to: /usr/local/bin/task
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
- id: DECKHOUSE_PRIVATE_REPO
  value: {{ .DECKHOUSE_PRIVATE_REPO }}
shell:
  install:
    # The d8 static build links libuv from /usr/local/lib/libuv.a; pm ships it under a
    # different name and path.
    - mkdir -p /usr/local/lib
    - ln -fs "$(find /usr/lib /usr/lib64 /usr/lib/x86_64-linux-gnu -name 'libuv*.a' 2>/dev/null | head -n1)" /usr/local/lib/libuv.a
    - export GOPROXY=off
    - cd /src
    - task build:dist:all
    - mkdir -p /app/files/d8-cli
    - mv dist/{{ .CandiVersionMap.d8.d8CliVersion }}/* /app/files/d8-cli
    - jq '[.[] | .version="{{ .CandiVersionMap.d8.d8CliVersion }}"]' /static/tools.json > /app/tools.json
    - mv /static/robots.txt /app
---
image: {{ .ModuleName }}/{{ .ImageName }}-frontend-artifact
final: false
from: {{ .Images.BASE_NODE_20_ALPINE }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src/src
  to: /app
  before: setup
mount:
- from: tmp_dir
  to: /app/node_modules
- from: tmp_dir
  to: /root/.npm/_cacache
- from: tmp_dir
  to: /tmp/node-complile-cache
shell:
  setup:
  {{- include "node packages proxy" . | nindent 2 }}
  - cd /app
  - npm install
  - npm run build
  - chown 64535:64535 /app
---
