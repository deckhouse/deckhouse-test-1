---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd, conntrack-tools]
git:
- add: /modules/030-cloud-provider-aws/images/ebs-csi-plugin/relocate.sh
  to: /relocate.sh
  stageDependencies:
    install: ['**/*']
shell:
  install:
  - bash /relocate.sh /relocate /usr/bin/conntrack /usr/bin/conntrackd

  {{- range $key, $value := .CandiVersionMap.k8s }}
  {{- $version := toString $key }}
  {{- $patch := $value.patch | toString }}
  {{- $v := semver $version }}
  {{- $image_version := printf "%s.%s" $version $patch | replace "." "-" }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $version | replace "." "-" }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /relocate
  to: /
  before: setup
- from: common/kubernetes-artifact-{{ $image_version }}
  add: /src/_output/bin/kube-proxy
  to: /usr/local/bin/kube-proxy
  before: setup
{{- include "image mount points" $ }}
imageSpec:
  config:
    entrypoint: ["/usr/bin/kube-proxy"]
---
{{- end }}
