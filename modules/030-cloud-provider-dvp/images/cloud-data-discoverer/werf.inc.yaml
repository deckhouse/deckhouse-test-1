---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /discoverer
  to: /discoverer
  before: setup
imageSpec:
  config:
    entrypoint: ["/discoverer"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [coreutils, sed]
fromCacheVersion: 2025-03-04.01
git:
- add: {{ .gitPrefix }}/go_lib/cloud-data
  to: /go_lib/cloud-data
  excludePaths:
  - "**/*.md"
  - "**/*.yaml"
  stageDependencies:
    install:
    - go.mod
    - go.sum
    - "**/*.go"
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to:  /src/cloud-data-discoverer/src
  stageDependencies:
    install:
      - go.mod
      - go.sum
      - "**/*.go"
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/images/dvp-common
  to:  /src/dvp-common
  stageDependencies:
    install:
      - go.mod
      - go.sum
      - "**/*.go"
shell:
  install:
  - mv /go_lib /src
  - cd /src/cloud-data-discoverer/src
  - rm -rf .git vendor
  - sed -i -e 's# ../../../../../go_lib/cloud-data/# /src/go_lib/cloud-data#g' go.mod
  - cd /src/dvp-common
  - rm -rf .git vendor
---
image: {{ .ModuleName }}/{{ .ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src/cloud-data-discoverer/src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
shell:
  install:
  - cd /src/cloud-data-discoverer/src
  - export GOPROXY=off
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /discoverer
  - chown 64535:64535 /discoverer
  - chmod 0755 /discoverer
