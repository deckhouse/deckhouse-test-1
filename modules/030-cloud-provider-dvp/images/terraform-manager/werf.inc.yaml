{{- $version := include "get_oss_version_by_id" (list "terraform-provider-kubernetes" $) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: scratch
git:
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi
  to: /
  excludePaths:
  - '**/terraform_versions.yml'
  - '**/plan_rules.yml'
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi/terraform_versions.yml
  to: /terraform-manager/terraform_versions.yml
# plan_rules.yml must sit next to terraform_versions.yml: dhctl reads the pair
# straight from the unpacked bundle, and the rules describe that versions file.
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi/plan_rules.yml
  to: /terraform-manager/plan_rules.yml
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/openapi/
  to: /candi/module-openapi
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/crds/instance_class.yaml
  to: /crd/instance_class.yaml
import:
- from: terraform-provider-kubernetes
  add: /terraform-provider-kubernetes
  to: /terraform-manager/terraform-provider-kubernetes
  before: setup
- from: {{ $.ModuleName }}/validator
  add: /dhctl-provider-dvp
  to: /validator
  before: setup
{{ include "image_spec_for_infrastructure_manager" . }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [git, coreutils]
git:
- url: {{ $.SOURCE_REPO }}/hashicorp/terraform-provider-kubernetes.git
  tag: v{{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi
  to: /candi
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - rm -rf manifest/test/
---
image: terraform-provider-kubernetes
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang, git, coreutils, binutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  install:
  - export GOPROXY=off
  - cd /src
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -extldflags \"-static\" -X main.version={{ $version }} -X main.commit=00000000" -o terraform-provider-kubernetes ./
  - mv /src/terraform-provider-kubernetes /terraform-provider-kubernetes
  - strip /terraform-provider-kubernetes
  - chmod -R 755 /terraform-provider-kubernetes
  - chown 64535:64535 /terraform-provider-kubernetes
---
