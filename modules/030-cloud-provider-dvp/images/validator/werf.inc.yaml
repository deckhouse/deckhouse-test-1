---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /dhctl-provider-dvp
  to: /dhctl-provider-dvp
  before: setup
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [sed]
git:
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
  to: /src/validator/src
  excludePaths:
  - "**/*.md"
  - "**/*.yaml"
  stageDependencies:
    install:
    - go.mod
    - go.sum
    - "**/*.go"
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/pkg
  to: /src/validator/pkg
  excludePaths:
  - "**/*.md"
  - "**/*.yaml"
  stageDependencies:
    install:
    - go.mod
    - go.sum
    - "**/*.go"
- add: {{ .gitPrefix }}/go_lib/cloud-provider
  to: /src/go_lib/cloud-provider
  excludePaths:
  - "**/*.md"
  - "**/*.yaml"
  stageDependencies:
    install:
    - go.mod
    - go.sum
    - "**/*.go"
- add: {{ .gitPrefix }}/go_lib/dhctl-provider-protocol
  to: /src/go_lib/dhctl-provider-protocol
  excludePaths:
  - "**/*.md"
  stageDependencies:
    install:
    - go.mod
    - go.sum
    - "**/*.go"
- add: {{ .gitPrefix }}/pkg/log
  to: /src/pkg/log
  excludePaths:
  - "**/*.md"
  stageDependencies:
    install:
    - go.mod
    - go.sum
    - "**/*.go"
shell:
  install:
  - cd /src/validator/pkg
  - sed -i -e 's# /deckhouse/go_lib/cloud-provider# /src/go_lib/cloud-provider#g' go.mod
  - sed -i -e 's# /deckhouse/go_lib/dhctl-provider-protocol# /src/go_lib/dhctl-provider-protocol#g' go.mod
  - sed -i -e 's# /deckhouse/pkg/log# /src/pkg/log#g' go.mod
  - cd /src/validator/src
  - sed -i -e 's# /deckhouse/modules/030-cloud-provider-dvp/pkg# /src/validator/pkg#g' go.mod
  - sed -i -e 's# /deckhouse/go_lib/cloud-provider# /src/go_lib/cloud-provider#g' go.mod
  - sed -i -e 's# /deckhouse/go_lib/dhctl-provider-protocol# /src/go_lib/dhctl-provider-protocol#g' go.mod
  - sed -i -e 's# /deckhouse/pkg/log# /src/pkg/log#g' go.mod
  - cd /src/go_lib/cloud-provider
  - sed -i -e 's# /deckhouse/go_lib/dhctl-provider-protocol# /src/go_lib/dhctl-provider-protocol#g' go.mod
  - sed -i -e 's# /deckhouse/pkg/log# /src/pkg/log#g' go.mod
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src/validator/src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
shell:
  install:
  - export GOPROXY=off
  - cd /src/validator/src
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o /dhctl-provider-dvp .
  - chown 64535:64535 /dhctl-provider-dvp
  - chmod 0755 /dhctl-provider-dvp
