---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: common/distroless
import:
- from: {{ .ModuleName }}/vertical-pod-autoscaler-artifact
  add: /admission-controller
  to: /admission-controller
  before: setup
{{- include "image mount points" . }}  
imageSpec:
  config:
    entrypoint: ["/admission-controller"]
    cmd: ["--v=4", "--stderrthreshold=info"]
---
