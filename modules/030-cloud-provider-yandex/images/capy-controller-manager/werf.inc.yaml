{{- $version := include "get_oss_version_by_id" (list "capy-yandex" $) }}
{{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
{{- $patch := false }}
{{- range $path, $_ := $.Files.Glob (printf "%s/patches/*.patch" $patches) }}
  {{- $patch = true }}
{{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /src/manager
  to: /capy-controller-manager
  before: setup
imageSpec:
  config:
    entrypoint: ["/capy-controller-manager"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [git, coreutils]
git:
  - url: {{ .SOURCE_REPO }}/yandex-cloud/cluster-api-provider-yandex.git
    tag: {{ $version }}
    add: /
    to: /src
    stageDependencies:
      install: ['**/*']
{{- if $patch }}
  - add: {{ $patches }}/patches
    to: /patches
    stageDependencies:
      install:
        - '**/*'
{{- end }}
shell:
  install:
  - cd /src
  {{- if $patch }}
  - git apply /patches/*.patch --verbose
  {{- end }}
  - rm -rf .git
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  setup:
  - cd /src
  - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o manager main.go
  - chown 64535:64535 /src/manager
  - chmod 0755 /src/manager
