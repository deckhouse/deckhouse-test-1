{{- $version := include "get_oss_version_by_id" (list "csi-yandex" $) }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: common/distroless
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /go/bin/yandex-csi-driver
  to: /bin/yandex-csi-driver
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: install
  includePaths:
  - '**/*'
imageSpec:
  config:
    entrypoint: ["/bin/yandex-csi-driver"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
git:
- url: {{ $.SOURCE_REPO }}/deckhouse/yandex-csi-driver.git
  tag: {{ $version }}
  add: /
  to: /go/src/app
final: false
from: common/src-artifact
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/golang" }}
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /go/src/app
    to: /go/src/app
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /go/src/app
  - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
  setup:
    - cd /go/src/app
    - |
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a \
      -ldflags '-X github.com/deckhouse/yandex-csi-driver/driver.version={{ $version }}' \
      -o /go/bin/yandex-csi-driver \
      github.com/deckhouse/yandex-csi-driver/cmd/yandex-csi-driver
    - chown 64535:64535 /go/bin/yandex-csi-driver
    - chmod 0755 /go/bin/yandex-csi-driver
---
{{- $csiBinaries := "/bin/chmod /bin/mount /bin/mkdir /bin/rmdir /bin/umount /bin/findmnt /bin/lsblk /sbin/badblocks /sbin/blockdev /sbin/blk* /sbin/dumpe2fs /sbin/e2* /sbin/findfs /sbin/fsck* /sbin/fstrim /sbin/mke2fs /sbin/mkfs* /sbin/resize2fs /usr/sbin/parted /usr/sbin/xfs*" }}
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
final: false
from: common/relocate-artifact
shell:
  beforeInstall:
    - apt-get update -y
    - apt-get install -y e2fsprogs xfsprogs parted
  install:
    - /binary_replace.sh -i "{{ $csiBinaries }}" -o /relocate
