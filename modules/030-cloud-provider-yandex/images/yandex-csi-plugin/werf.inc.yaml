{{- $version := include "get_oss_version_by_id" (list "csi-yandex" $) }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
  add: /go/bin/yandex-csi-driver
  to: /usr/bin/yandex-csi-driver
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: install
  includePaths:
  - '**/*'
imageSpec:
  config:
    entrypoint: ["/bin/yandex-csi-driver"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ .SOURCE_REPO }}/deckhouse/yandex-csi-driver.git
  tag: {{ $version }}
  add: /
  to: /go/src/app
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /go/src/app
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
  - from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact
    add: /go/src/app
    to: /go/src/app
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  setup:
    - cd /go/src/app
    - |
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a \
      -ldflags '-X github.com/deckhouse/yandex-csi-driver/driver.version={{ $version }}' \
      -o /go/bin/yandex-csi-driver \
      github.com/deckhouse/yandex-csi-driver/cmd/yandex-csi-driver
    - chown 64535:64535 /go/bin/yandex-csi-driver
    - chmod 0755 /go/bin/yandex-csi-driver
---
{{- $csiBinaries := "/usr/bin/chmod /usr/bin/mount /usr/bin/mkdir /usr/bin/rmdir /usr/bin/umount /usr/bin/findmnt /usr/bin/lsblk /usr/bin/badblocks /usr/bin/blockdev /usr/bin/blk* /usr/bin/dumpe2fs /usr/bin/e2* /usr/bin/findfs /usr/bin/fsck* /usr/bin/fstrim /usr/bin/mke2fs /usr/bin/mkfs* /usr/bin/resize2fs /usr/bin/parted /usr/bin/xfs*" }}
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /modules/030-cloud-provider-aws/images/ebs-csi-plugin/relocate.sh
  to: /relocate.sh
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd, util-linux, e2fsprogs, xfsprogs, parted]
shell:
  install:
    - bash /relocate.sh /relocate {{ $csiBinaries }}
