{{- $version := include "get_oss_version_by_id" (list "terraform-provider-gcp" $) }}
---
image: {{ .ModuleName }}/{{ .ImageName }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: scratch
git:
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi
  to: /candi
  excludePaths:
  - '**/terraform_versions.yml'
- add: /{{ $.ModulePath }}modules/030-{{ $.ModuleName }}/candi/terraform_versions.yml
  to: /terraform-manager/terraform_versions.yml
import:
- from: terraform-provider-gcp
  add: /terraform-provider-gcp
  to: /terraform-manager/terraform-provider-gcp
  before: setup
{{ include "image_spec_for_infrastructure_manager" . }}
---
image: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [git, coreutils]
git:
- url: {{ .SOURCE_REPO }}/hashicorp/terraform-provider-google.git
  tag: v{{ $version }}
  add: /
  to: /src
  stageDependencies:
    install: ['**/*']
- add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/patches
  to: /patches
  stageDependencies:
    install:
    - '**/*'
shell:
  install:
  - cd /src
  - git apply /patches/*.patch --verbose
  - rm -rf scripts/diff.go google/test-fixtures/appengine/hello-world-flask
---
image: terraform-provider-gcp
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang, git, coreutils, binutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
mount:
{{ include "mount points for golang builds" . }}
import:
- from: {{ .ModuleName }}/{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - cd /src
  - export GOPROXY=off
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o terraform-provider-gcp -ldflags="-s -w -extldflags \"-static\" -X github.com/hashicorp/terraform-provider-google/version.ProviderVersion={{ $version }}"
  - mv terraform-provider-gcp /terraform-provider-gcp
  - strip /terraform-provider-gcp
  - chmod -R 755 /terraform-provider-gcp
  - chown 64535:64535 /terraform-provider-gcp
---
