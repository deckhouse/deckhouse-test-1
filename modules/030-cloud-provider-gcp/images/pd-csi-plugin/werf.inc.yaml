{{- $version_map := include "get_oss_version_map_by_id_and_condition_key" (list "csi-gcp" "k8s" $) | fromYaml }}
{{- range $key, $value := $version_map }}
  {{- $image_version := toString $key | replace "." "-" }}
  {{- $version := toString $value }}
  {{- if $version }}
    {{- $patches := (printf "/%smodules/%s-%s/images/%s" $.ModulePath $.ModulePriority $.ModuleName $.ImageName) }}
    {{- $patch := false }}
    {{- range $path, $_ := $.Files.Glob (printf "%s/patches/%s/*.patch" $patches $version) }}
        {{- $patch = true }}
    {{- end }}
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-{{ $image_version }}
{{- $vexPath := printf "%smodules/%s-%s/images/%s/known_vulnerabilities.vex" $.ModulePath $.ModulePriority $.ModuleName $.ImageName }}
{{- if eq (len ($.Files.Glob $vexPath)) 1 }}
vex: {{ $vexPath }}
{{- end }}
from: {{ index $.Images "base/distroless" }}
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /src/bin/gce-pd-csi-driver
  to: /gce-pd-csi-driver
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /relocate
  to: /
  before: install
  includePaths:
  - '**/*'
- from: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
  add: /relocate/usr/lib/udev/scsi_id
  to: /usr/lib/udev_containerized/scsi_id
  before: setup
- from: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
  add: /src/deploy/kubernetes/udev/google_nvme_id
  to: /usr/lib/udev_containerized/google_nvme_id
  before: setup
imageSpec:
  config:
    entrypoint: ["/gce-pd-csi-driver"]
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [git, coreutils]
git:
  - url: {{ $.SOURCE_REPO }}/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver.git
    tag: {{ $version }}
    add: /
    to: /src
    stageDependencies:
      install: ['**/*']
{{- if $patch }}
  - add: {{ $patches }}/patches/{{ $version }}
    to: /patches
    stageDependencies:
      install:
        - '**/*'
{{- end }}
shell:
  install:
  - cd /src
  {{- if $patch}}
  - git apply /patches/*.patch --verbose
  {{- end}}
  - rm -rf .git vendor
---
image: {{ $.ModuleName }}/{{ $.ImageName }}-artifact-{{ $image_version }}
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [golang, git, coreutils]
- type: go-mod
  workdir: /src
  env:
    GOPROXY: "%secret:GOPROXY%"
import:
- from: {{ $.ModuleName }}/{{ $.ImageName }}-src-artifact-{{ $image_version }}
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" $ }}
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
shell:
  setup:
  - cd /src
  - mkdir -p bin
  - CGO_ENABLED=0 go build -ldflags "-extldflags=static -X main.version={{ $version }}" -o bin/gce-pd-csi-driver ./cmd/gce-pd-csi-driver/
---
{{- end }}
{{- end }}
---
{{- $csiBinaries := "/usr/bin/chmod /usr/bin/mount /usr/bin/mkdir /usr/bin/rmdir /usr/bin/umount /usr/bin/findmnt /usr/bin/lsblk /usr/bin/badblocks /usr/bin/blockdev /usr/bin/blk* /usr/bin/btrfs* /usr/bin/dumpe2fs /usr/bin/e2* /usr/bin/findfs /usr/bin/fsck* /usr/bin/fsfreeze /usr/bin/fstrim /usr/bin/mke2fs /usr/bin/mkfs* /usr/bin/resize2fs /usr/bin/xfs_repair /usr/bin/nvme /usr/bin/parted /usr/bin/xfs* /usr/lib/udev/scsi_id /usr/lib/libresolv*" }}
image: {{ $.ModuleName }}/{{ $.ImageName }}-binaries-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- add: /modules/030-cloud-provider-aws/images/ebs-csi-plugin/relocate.sh
  to: /relocate.sh
  stageDependencies:
    install: ['**/*']
packages:
- type: os-pm
  spec: [bash, coreutils, gawk, ldd, util-linux, e2fsprogs, xfsprogs, parted, btrfs-progs, nvme-cli, udev, gnu-glibc]
shell:
  install:
  - bash /relocate.sh /relocate {{ $csiBinaries }}
