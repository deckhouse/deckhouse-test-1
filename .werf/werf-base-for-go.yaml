---
image: base-for-go
from: {{ index $.Images "builder/distroless" }}
final: false
packages:
- type: os-pm
  spec: [golang, findutils, sed, make, git, coreutils, libcap, bash, gnu-glibc-devel, semver]
import:
{{ include "base components imports" (dict "Images" .Images "k8sVersions" .k8sVersions "CandiVersionMap" .CandiVersionMap) }}
shell:
  install:
  {{- include "base components" (dict "Files" .Files "prefix" .prefix "k8sVersions" .k8sVersions) | nindent 2 }}
