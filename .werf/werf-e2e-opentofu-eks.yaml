{{- if ne $.Env "CSE" }}
---
image: e2e-opentofu-eks-os-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
packages:
- type: os-pm
  spec: [bash, coreutils, ca-certificates, wget, unzip, tar, git, python==3.12.12, jq, curl, gettext]
shell:
  install:
  - ln -sf /usr/bin/pip3 /usr/bin/pip
---
image: e2e-opentofu-eks
from: e2e-opentofu-eks-os-artifact
git:
- add: /.werf/tooling/e2e-opentofu-eks/requirements.txt
  to: /requirements/requirements.txt
  stageDependencies:
    packages: ["**/*"]
packages:
- type: python-pip
  workdir: /requirements
  env:
    PIP_ONLY_BINARY: ":all:"
import:
  {{- $k8sVersion := index (index .k8sVersions 0) "kubectl" }}
  {{- $image_version := printf "%s.%d" $k8sVersion (index $.CandiVersionMap "k8s" $k8sVersion "patch") | replace "." "-" }}
  - from: common/kubernetes-artifact-{{ $image_version }}
    add: /src/_output/bin/kubectl
    to: /usr/local/bin/kubectl
    before: setup
  - from: opentofu # from modules/040-terraform-manager/images/terraform-manager-base/werf.inc.yaml
    add: /opentofu/opentofu
    to: /image/bin/opentofu
    before: setup
  {{- if ne $.Env "CSE" }}
  {{- $tf := index $.TF "aws" }}
  - from: {{ $tf.artifact }} # from modules/040-terraform-manager/images/terraform-manager-aws/werf.inc.yaml
    add: /{{ $tf.artifactBinary }}
    to: /usr/local/share/opentofu/plugins/registry.opentofu.org/{{ $tf.namespace }}/{{ $tf.type }}/{{ $tf.version }}//linux_amd64/{{ $tf.destinationBinary }}
    before: setup
  {{- end }}
  - from: e2e-eks-terraform-plugins
    add: /terraform-provider-random
    to: /usr/local/share/opentofu/plugins/registry.opentofu.org/hashicorp/random/3.4.3/linux_amd64/terraform-provider-random_v3.4.3_x5
    before: setup
  - from: e2e-eks-terraform-plugins
    add: /terraform-provider-tls
    to: /usr/local/share/opentofu/plugins/registry.opentofu.org/hashicorp/tls/4.0.5/linux_amd64/terraform-provider-tls_v4.0.5_x5
    before: setup
  - from: e2e-eks-terraform-plugins
    add: /terraform-provider-cloudinit
    to: /usr/local/share/opentofu/plugins/registry.opentofu.org/hashicorp/cloudinit/2.2.0/linux_amd64/terraform-provider-cloudinit_v2.2.0_x5
    before: setup
  - from: e2e-eks-terraform-plugins
    add: /terraform-provider-kubernetes
    to: /usr/local/share/opentofu/plugins/registry.opentofu.org/hashicorp/kubernetes/2.31.0/linux_amd64/terraform-provider-kubernetes_v2.31.0_x5
    before: setup
shell:
  install:
  - |
    mkdir -p /opentofu /root /usr/local/share/opentofu/plugins
    cat << EOD > /root/.tofurc
    provider_installation {
      filesystem_mirror {
        path    = "/usr/local/share/opentofu/plugins"
        include = ["*/*/*"]
      }
    }
    EOD
    touch /opentofu.log
    chmod 755 /opentofu.log
---
image: e2e-eks-terraform-plugins-src-artifact
final: false
from: {{ index $.Images "builder/distroless" }}
git:
- url: {{ .SOURCE_REPO }}/hashicorp/terraform-provider-random.git
  tag: v3.4.3
  add: /
  to: /src/provider-random
- url: {{ .SOURCE_REPO }}/hashicorp/terraform-provider-tls.git
  tag: v4.0.4
  add: /
  to: /src/provider-tls
- url: {{ .SOURCE_REPO }}/hashicorp/terraform-provider-cloudinit.git
  tag: v2.2.0
  add: /
  to: /src/provider-cloudinit
- url: {{ .SOURCE_REPO }}/hashicorp/terraform-provider-kubernetes.git
  tag: v2.31.0
  add: /
  to: /src/provider-kubernetes
---
image: e2e-eks-terraform-plugins
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- from: e2e-eks-terraform-plugins-src-artifact
  add: /src
  to: /src
  before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils, bash]
{{- range $provider := list "random" "tls" "cloudinit" "kubernetes" }}
- type: go-mod
  workdir: /src/provider-{{ $provider }}
  env:
    GOPROXY: "%secret:GOPROXY%"
{{- end }}
shell:
  install:
  - export GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local
  - cd /src/provider-random
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -ldflags="-s -w -extldflags \"-static\""
  - cd /src/provider-tls
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -ldflags="-s -w -extldflags \"-static\""
  - cd /src/provider-cloudinit
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -ldflags="-s -w -extldflags \"-static\""
  - cd /src/provider-kubernetes
  - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -ldflags="-s -w -extldflags \"-static\""
  - mv /src/provider-random/terraform-provider-random /terraform-provider-random
  - mv /src/provider-tls/terraform-provider-tls /terraform-provider-tls
  - mv /src/provider-cloudinit/terraform-provider-cloudinit /terraform-provider-cloudinit
  - mv /src/provider-kubernetes/terraform-provider-kubernetes /terraform-provider-kubernetes
  - chmod 755 /terraform-provider-*
  - chown 64535:64535 /terraform-provider-*
{{- end }}
