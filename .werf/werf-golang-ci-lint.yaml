{{- if eq $.Env "FE" }}
{{- $golangciLintVersion := "v2.13.1" }}
---
image: golangci-lint-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
git:
- url: {{ .SOURCE_REPO }}/golangci/golangci-lint
  tag: {{ $golangciLintVersion }}
  add: /
  to: /golangci-lint
  stageDependencies:
    packages: [go.mod, go.sum]
    install: ["**/*"]
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
packages:
- type: os-pm
  spec: [golang, git, coreutils, bash]
- type: go-mod
  workdir: /golangci-lint
  env:
    GOPROXY: "%secret:GOPROXY%"
shell:
  install:
  - export GOLANGCI_LINT_VERSION={{ $golangciLintVersion }}
  - cd /golangci-lint
  - CGO_ENABLED=0 GOOS=linux go build -ldflags "-s -w -extldflags '-static' -X 'main.version=${GOLANGCI_LINT_VERSION}' -X 'main.date=$(date -u +%Y-%m-%d)'" -o /usr/local/bin/golangci-lint cmd/golangci-lint/main.go
---
{{- end }}
